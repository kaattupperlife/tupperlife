        };

        // ---------- ACTIVITEIT (logboek van iedereen) ----------
        const AdminActivityFeed = ({ users, details, onOpenUser }) => {
            const [uidFilter, setUidFilter] = useState('');
            const [typeFilter, setTypeFilter] = useState('');
            const all = users.flatMap(u => ((details[u.uid] || {}).activity || []).map(a => ({ ...a, userName: u.name, uid: u.uid })))
                .filter(a => (!uidFilter || a.uid === uidFilter) && (!typeFilter || a.type === typeFilter))
                .sort((a, b) => b.ts - a.ts);
            const byDay = {};
            all.forEach(a => { const k = new Date(a.ts).toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); (byDay[k] = byDay[k] || []).push(a); });
            return (
                <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row gap-3">
                        <select value={uidFilter} onChange={e => setUidFilter(e.target.value)} className="flex-grow p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white font-semibold outline-none">
                            <option value="">Alle gebruikers</option>
                            {users.map(u => <option key={u.uid} value={u.uid}>{u.name}</option>)}
                        </select>
                        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white font-semibold outline-none">
                            <option value="">Alle soorten</option>
                            {Object.entries(ACTIVITY_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                        </select>
                    </div>
                    {Object.keys(byDay).length === 0 && <Panel><ActivityList items={[]} empty="Nog geen activiteit. Vanaf nu wordt alles bijgehouden."/></Panel>}
                    {Object.entries(byDay).map(([day, items]) => (
                        <Panel key={day} title={day.charAt(0).toUpperCase() + day.slice(1)} right={<span className="text-xs text-slate-400">{items.length} acties</span>}>
                            <ActivityList items={items} showUser={!uidFilter}/>
                        </Panel>
                    ))}
                </div>
            );
        };

        // ---------- GEBRUIKERSFICHE ----------
        const AdminUserDetail = ({ u, det, sl, selectedYear, globalPsData, formatCurrency, onBack, onRefresh }) => {
            const [tab, setTab] = useState('overview');
            const d = det || {}; const p = d.profile || {};
            const st = activityStatus(lastSeenOf(u, d));
            const tabs = [
                ['overview', 'Overzicht', 'fa-gauge'], ['activity', 'Activiteit', 'fa-clock-rotate-left'], ['sales', 'Verkoop', 'fa-chart-line'], ['goals', 'Doelen', 'fa-bullseye'],
                ['requests', 'Wensen', 'fa-gift'], ['stock', 'Voorraad', 'fa-box'], ['customers', 'Klanten', 'fa-address-book'], ['recipes', 'Recepten', 'fa-utensils'], ['rights', 'Rechten', 'fa-user-lock'],
            ];
            const info = [
                ['E-mail', u.email || p.email || '–'], ['Status', st.label], ['Laatst actief', fmtDateTime(lastSeenOf(u, d))], ['Laatste login', fmtDateTime(p.lastLogin)],
                ['Eerst gezien', fmtDateTime(p.firstSeen)], ['Aantal bezoeken', String(p.visits || 0)], ['Toestel', p.device || '–'], ['Laatste actie', p.lastAction ? `${p.lastAction} (${timeAgo(p.lastActionAt)})` : '–'],
                ['Laatste verkoop ingevuld', sl.lastSale ? fmtDateTime(sl.lastSale) : '–'], ['Laatste wens/voorraad', d.lastData ? fmtDateTime(d.lastData) : '–'],
            ];
            return (
                <div className="space-y-5">
                    <button onClick={onBack} className="text-sm font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-white flex items-center gap-2"><i className="fa-solid fa-arrow-left"></i> Alle gebruikers</button>
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-glass border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center gap-4">
                        <Avatar u={u} size="w-16 h-16 text-2xl"/>
                        <div className="flex-grow min-w-0">
                            <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white truncate">{u.name}</h3>
                            <div className={`flex items-center gap-2 text-sm mt-0.5 ${st.cls}`}><span className={`w-2.5 h-2.5 rounded-full ${st.dot}`}></span>{st.label}</div>
                        </div>
                        <div className="flex gap-2 shrink-0">
                            <button onClick={onRefresh} className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-sm font-semibold hover:bg-slate-200"><i className="fa-solid fa-rotate mr-2"></i>Vernieuwen</button>
                            <button onClick={() => openUserApp(u)} className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700"><i className="fa-solid fa-arrow-up-right-from-square mr-2"></i>App openen</button>
                        </div>
                    </div>

                    <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
                        {tabs.map(([id, label, icon]) => (
                            <button key={id} onClick={() => setTab(id)} className={`shrink-0 px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 border transition-colors ${tab === id ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50'}`}><i className={`fa-solid ${icon} text-xs`}></i>{label}</button>
                        ))}
                    </div>

                    {tab === 'overview' && (
                        <div className="space-y-5">
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                                <StatCard label={`Omzet ${selectedYear}`} value={formatCurrency(sl.total || 0)} sub={`Winst ${formatCurrency((sl.total || 0) * PROFIT_RATE)}`} icon="fa-euro-sign" tint="bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400" onClick={() => setTab('sales')}/>
                                <StatCard label="Deze maand" value={formatCurrency(sl.current || 0)} sub={`${sl.months || 0} actieve maanden`} icon="fa-calendar-day" tint="bg-sky-50 text-sky-600 dark:bg-sky-900/30 dark:text-sky-400"/>
                                <StatCard label="Wensen" value={d.requests ? `${d.requests.open} open` : '…'} sub={d.requests ? `${d.requests.found} gevonden · ${d.requests.total} totaal` : ''} icon="fa-gift" tint="bg-pink-50 text-pink-600 dark:bg-pink-900/30 dark:text-pink-400" onClick={() => setTab('requests')}/>
                                <StatCard label="Voorraad" value={d.stock ? formatCurrency(d.stock.value) : '…'} sub={d.stock ? `${d.stock.items} producten · ${d.stock.qty} stuks · ${d.stock.vinted} op Vinted` : ''} icon="fa-box" tint="bg-cyan-50 text-cyan-600 dark:bg-cyan-900/30 dark:text-cyan-400" onClick={() => setTab('stock')}/>
                                <StatCard label="Klanten" value={String(d.customers ?? '…')} icon="fa-address-book" tint="bg-purple-50 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400" onClick={() => setTab('customers')}/>
                                <StatCard label="Recepten" value={String(d.recipes ?? '…')} icon="fa-utensils" tint="bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400" onClick={() => setTab('recipes')}/>
                                <StatCard label="Doelen" value={String(d.goals ?? '…')} icon="fa-bullseye" tint="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400" onClick={() => setTab('goals')}/>
                                <StatCard label="Bezoeken" value={String(p.visits || 0)} sub={p.lastLogin ? `laatste ${timeAgo(p.lastLogin)}` : 'nog niet gezien'} icon="fa-right-to-bracket" tint="bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300" onClick={() => setTab('activity')}/>
                            </div>
                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
                                <Panel title="Gegevens">
                                    <dl className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {info.map(([k, v]) => <div key={k} className="flex justify-between gap-4 py-2.5 text-sm"><dt className="text-slate-500">{k}</dt><dd className="font-semibold text-slate-800 dark:text-slate-100 text-right break-all">{v}</dd></div>)}
                                    </dl>
                                </Panel>
                                <Panel title="Laatste activiteit" right={<button onClick={() => setTab('activity')} className="text-xs font-semibold text-emerald-600 hover:underline">Alles →</button>}>
                                    <ActivityList items={(d.activity || []).slice(0, 8)}/>
                                </Panel>
                            </div>
                        </div>
                    )}
                    {tab === 'activity' && <Panel title={`Activiteit van ${u.name}`} right={<span className="text-xs text-slate-400">laatste {(d.activity || []).length}</span>}><ActivityList items={d.activity || []}/></Panel>}
                    {tab === 'sales' && <AdminSalesSection key={u.uid} uid={u.uid} realName={u.name} selectedYear={selectedYear} globalPsData={globalPsData} formatCurrency={formatCurrency}/>}
                    {tab === 'goals' && <AdminGoalsSection key={u.uid} uid={u.uid} name={u.name} selectedYear={selectedYear} formatCurrency={formatCurrency}/>}
                    {tab === 'requests' && <RequestsTab key={u.uid} targetUid={u.uid}/>}
                    {tab === 'stock' && <StockTab key={u.uid} targetUid={u.uid} user={null}/>}
                    {tab === 'customers' && <CustomersTab key={u.uid} targetUid={u.uid}/>}
                    {tab === 'recipes' && <RecipesTab key={u.uid} targetUid={u.uid}/>}
                    {tab === 'rights' && <AdminUserModal inline isOpen={true} onClose={() => {}} selectedYear={selectedYear} onSelectUser={openUserApp} onlyUid={u.uid} onlyName={u.name}/>}
                </div>
            );
        };

        function AdminApp() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [monthDocs, setMonthDocs] = useState([]);
            const [globalPsData, setGlobalPsData] = useState({});
            const [showMenu, setShowMenu] = useState(false);
            const [refreshKey, setRefreshKey] = useState(0);
            const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem('theme') === 'dark'; } catch (e) { return false; } });
            const parseHash = () => {
                const h = (window.location.hash || '').slice(1);
                if (h.startsWith('user=')) return { section: 'users', userUid: decodeURIComponent(h.slice(5)) };
                if (ADMIN_NAV.some(n => n.id === h)) return { section: h, userUid: null };
                try { const s = localStorage.getItem('tl-admin-nav'); if (ADMIN_NAV.some(n => n.id === s)) return { section: s, userUid: null }; } catch (e) {}
                return { section: 'start', userUid: null };
            };
            const [nav, setNav] = useState(parseHash);
            const setSection = (s) => {
                setNav({ section: s, userUid: null }); setShowMenu(false);
                try { localStorage.setItem('tl-admin-nav', s); } catch (e) {}
                try { history.replaceState(null, '', '#' + s); } catch (e) {}
                window.scrollTo({ top: 0 });
            };
            const openUser = (uid) => {
                setNav({ section: 'users', userUid: uid }); setShowMenu(false);
                try { history.replaceState(null, '', '#user=' + encodeURIComponent(uid)); } catch (e) {}
                window.scrollTo({ top: 0 });
            };

            useEffect(() => {
                const unsub = window.auth.onAuthStateChanged(u => {
                    if (!u) { window.location.href = 'index.html'; return; }
                    if (!isAdminEmail(u.email)) { window.location.replace('dashboard.html'); return; }
                    setUser(u); setLoading(false);
                    window.recordVisit(u);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
                try { localStorage.setItem('theme', darkMode ? 'dark' : 'light'); } catch (e) {}
            }, [darkMode]);

            useEffect(() => {
                const onHash = () => setNav(parseHash());
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, []);

            useEffect(() => {
                if (!user) return;
                const u1 = window.db.collectionGroup('months').where('yearId', 'in', [selectedYear, selectedYear - 1]).onSnapshot(snap => {
                    const arr = [];
                    snap.forEach(d => arr.push({ ...d.data(), _id: d.id, _path: d.ref && d.ref.path ? d.ref.path : '' }));
                    setMonthDocs(arr);
                }, err => { console.error(err); window.showAlert("Verkoopgegevens laden mislukt: " + err.message); });
                const u2 = window.db.collection('settings').doc(`global_ps_${selectedYear}`).onSnapshot(doc => setGlobalPsData(doc.exists ? doc.data() : {}), err => console.error(err));
                return () => { u1(); u2(); };
            }, [user, selectedYear]);

            const { users, details, loadingDetails } = useAdminData(user, monthDocs, refreshKey);
            const sales = React.useMemo(() => salesByUser(monthDocs, selectedYear), [monthDocs, selectedYear]);

            const formatCurrency = (val) => new Intl.NumberFormat('nl-BE', { style: 'currency', currency: 'EUR' }).format(val || 0);
            const updateGlobalPsData = async (month, newLevels) => {
                try { await window.db.collection('settings').doc(`global_ps_${selectedYear}`).set({ [month]: newLevels }, { merge: true }); }
                catch (e) { window.showAlert("Opslaan mislukt: " + e.message); }
            };

            if (loading) return <div className="h-screen flex flex-col items-center justify-center text-emerald-600"><Icons.Loader className="text-4xl mb-4"/><div className="font-semibold">Beheer wordt geladen...</div></div>;

            const userOptions = users.map(u => ({ uid: u.uid, name: u.uid === user.uid ? `${u.name} (jij)` : u.name, realName: u.name }));
            const selfFirst = [...userOptions.filter(u => u.uid === user.uid), ...userOptions.filter(u => u.uid !== user.uid)];
            const current = ADMIN_NAV.find(n => n.id === nav.section) || ADMIN_NAV[0];
            const detailUser = nav.userUid ? (users.find(u => u.uid === nav.userUid) || { uid: nav.userUid, name: 'Gebruiker' }) : null;
            const yearOptions = [0, 1, 2, 3, 4].map(i => new Date().getFullYear() - 2 + i);
            const showYear = ['start', 'users', 'sales', 'goals', 'rights', 'ps'].includes(current.id);
            const navBtn = (n, mobile) => (
                <button key={n.id} onClick={() => setSection(n.id)} className={mobile
                    ? `shrink-0 px-3.5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 ${current.id === n.id && !detailUser ? 'bg-white text-slate-900' : 'text-slate-300 bg-white/5'}`
                    : `w-full px-3 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 transition-colors ${current.id === n.id && !(detailUser && n.id !== 'users') ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                    <i className={`fa-solid ${n.icon} w-4 text-center text-[13px]`}></i> {n.label}
                </button>
            );

            return (
                <div className="relative min-h-screen">
                    <GlobalDialogs />

                    {/* KOP */}
                    <header className="sticky top-0 z-30 bg-slate-900 text-white border-b border-slate-800">
                        <div className="px-4 sm:px-6 h-16 flex items-center gap-4">
                            <button onClick={() => setSection('start')} className="flex items-center gap-3 shrink-0 select-none">
                                <img src="apple-touch-icon.png" alt="" className="w-9 h-9 rounded-xl bg-white object-cover"/>
                                <div className="text-left leading-tight">
                                    <div className="font-extrabold text-[17px] tracking-tight">Tupper Life</div>
                                    <div className="text-[11px] font-bold text-amber-400 -mt-0.5 uppercase tracking-wider">Beheer</div>
                                </div>
                            </button>
                            <div className="ml-auto flex items-center gap-2">
                                <button onClick={() => setRefreshKey(k => k + 1)} title="Gegevens vernieuwen" className="w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20"><i className={`fa-solid fa-rotate ${loadingDetails ? 'fa-spin' : ''}`}></i></button>
                                <div className="relative">
                                    <button onClick={() => setShowMenu(!showMenu)} aria-label="Profielmenu" className="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center border border-white/20 bg-white/10 text-white">
                                        {user.photoURL ? <img src={user.photoURL} referrerPolicy="no-referrer" className="w-full h-full object-cover"/> : <Icons.User/>}
                                    </button>
                                    {showMenu && (
                                        <React.Fragment>
                                            <div className="fixed inset-0 z-10" onClick={() => setShowMenu(false)}></div>
                                            <div className="absolute right-0 mt-2 w-72 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 z-20 py-2 overflow-hidden modal-content">
                                                <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800">
                                                    <div className="text-sm font-bold truncate">{user.displayName || 'Beheerder'}</div>
                                                    <div className="text-xs text-slate-500 truncate">{user.email}</div>
                                                </div>
                                                <a href="dashboard.html" className="w-full px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-semibold flex gap-3 items-center"><i className="fa-solid fa-mobile-screen w-5 text-emerald-500"></i> Mijn eigen app</a>
                                                <button onClick={() => setDarkMode(!darkMode)} className="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800">
                                                    <span className="text-sm font-semibold flex items-center gap-3"><i className={`fa-solid ${darkMode ? 'fa-moon' : 'fa-sun'} w-5 text-slate-400`}></i> Donkere modus</span>
                                                    <span className={`w-11 h-6 rounded-full relative transition-colors ${darkMode ? 'bg-emerald-500' : 'bg-slate-200 dark:bg-slate-600'}`}><span className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform shadow-sm ${darkMode ? 'translate-x-5' : ''}`}></span></span>
                                                </button>
                                                <div className="border-t border-slate-100 dark:border-slate-800 mt-1 pt-1">
                                                    <button onClick={() => window.auth.signOut()} className="w-full text-left px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm font-semibold text-red-600 dark:text-red-400 flex gap-3 items-center"><i className="fa-solid fa-right-from-bracket w-5"></i> Uitloggen</button>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        </div>
                        {/* gsm/tablet: menu als schuifbalk */}
                        <nav className="lg:hidden flex gap-2 overflow-x-auto no-scrollbar px-4 pb-3">
                            {ADMIN_NAV.map(n => navBtn(n, true))}
                        </nav>
                    </header>

                    <div className="flex">
                        {/* computer: zijbalk */}
                        <aside className="hidden lg:block w-60 shrink-0 bg-slate-900 min-h-[calc(100vh-4rem)] sticky top-16 self-start max-h-[calc(100vh-4rem)] overflow-y-auto px-3 py-5">
                            {ADMIN_NAV_GROUPS.map(g => (
                                <div key={g} className="mb-5">
                                    <div className="px-3 mb-2 text-[11px] font-bold uppercase tracking-wider text-slate-500">{g}</div>
                                    <div className="space-y-1">{ADMIN_NAV.filter(n => n.group === g).map(n => navBtn(n, false))}</div>
                                </div>
                            ))}
                        </aside>

                        <main className="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 pt-5 sm:pt-8 pb-16">
                            <div className="max-w-6xl mx-auto">
                                <div className="flex flex-wrap items-center justify-between gap-3 mb-5 sm:mb-7">
                                    <div className="min-w-0">
                                        <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">{detailUser ? 'Gebruikersfiche' : current.label}</h2>
                                        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">{detailUser ? `Alles over ${detailUser.name}` : current.subtitle}</p>
                                    </div>
                                    <div id="page-actions" className="flex flex-wrap items-center justify-end gap-2 sm:gap-3 ml-auto empty:hidden"></div>
                                    {(showYear || detailUser) && (
                                        <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="shrink-0 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 font-semibold pl-3 pr-8 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-emerald-500/30 shadow-sm text-sm">
                                            {yearOptions.map(y => <option key={y} value={y}>{y}</option>)}
                                        </select>
                                    )}
                                </div>

                                <ErrorBoundary key={(detailUser ? 'u:' + detailUser.uid : current.id)}>
                                    {detailUser ? (
                                        <AdminUserDetail u={detailUser} det={details[detailUser.uid]} sl={sales[detailUser.uid] || {}} selectedYear={selectedYear} globalPsData={globalPsData} formatCurrency={formatCurrency} onBack={() => setSection('users')} onRefresh={() => setRefreshKey(k => k + 1)}/>
                                    ) : current.id === 'start' ? (
                                        <AdminStart users={users} details={details} sales={sales} selectedYear={selectedYear} formatCurrency={formatCurrency} onOpenUser={openUser} setSection={setSection} loadingDetails={loadingDetails}/>
                                    ) : current.id === 'users' ? (
                                        <AdminUsersOverview users={users} details={details} sales={sales} formatCurrency={formatCurrency} onOpenUser={openUser} selectedYear={selectedYear}/>
                                    ) : current.id === 'activity' ? (
                                        <AdminActivityFeed users={users} details={details} onOpenUser={openUser}/>
                                    ) : current.id === 'rights' ? (
                                        <AdminUserModal inline isOpen={true} onClose={() => {}} selectedYear={selectedYear} onSelectUser={openUserApp}/>
                                    ) : (
                                        <AdminPage hideNav section={current.id} setSection={setSection} users={selfFirst} formatCurrency={formatCurrency} selectedYear={selectedYear} globalPsData={globalPsData} updateGlobalPsData={updateGlobalPsData} isAdmin={true} onSelectUser={openUserApp}/>
                                    )}
                                </ErrorBoundary>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(window.TL_MODE === 'admin' ? <AdminApp /> : <DashboardPage />);
    </script>

    <!-- LADER: vertaalt de app één keer en bewaart het resultaat -->
    <script>
        (function () {
            var BABEL_URL = 'https://unpkg.com/@babel/standalone@7.23.6/babel.min.js';
            var showError = function (msg) {
                var box = document.getElementById('debug-console');
                if (!box) return;
                var p = document.createElement('pre');
                p.style.whiteSpace = 'pre-wrap';
                p.textContent = msg;
                box.appendChild(p);
                box.style.display = 'block';
            };
            window.addEventListener('error', function (e) { if (e && e.message) showError(e.message); });

            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof firebase === 'undefined' || !window.db) {
                showError('Niet alle onderdelen konden geladen worden. Controleer je internetverbinding en vernieuw de pagina.');
                return;
            }

            var src = document.getElementById('app-source').textContent;
            var h = 5381;
            for (var i = 0; i < src.length; i++) { h = ((h << 5) + h + src.charCodeAt(i)) | 0; }
            var key = 'v1-' + src.length + '-' + (h >>> 0).toString(36);

            var run = function (code) {
                var s = document.createElement('script');
                s.text = code;
                document.body.appendChild(s);
            };

            var cached = null;
            try { if (localStorage.getItem('tl-app-key') === key) cached = localStorage.getItem('tl-app-code'); } catch (e) {}
            if (cached) { run(cached); return; }

            var b = document.createElement('script');
            b.src = BABEL_URL;
            b.onload = function () {
                var out;
                try {
                    out = Babel.transform(src, { presets: ['react'], sourceType: 'script' }).code;
                } catch (err) {
                    showError('Fout in de app-code: ' + err.message);
                    return;
                }
                try {
                    localStorage.removeItem('tl-app-code');
                    localStorage.setItem('tl-app-code', out);
                    localStorage.setItem('tl-app-key', key);
                } catch (e) { /* opslag vol of uitgeschakeld: gewoon verder */ }
                run(out);
            };
            b.onerror = function () { showError('De vertaler (Babel) kon niet geladen worden. Controleer je internetverbinding.'); };
            document.head.appendChild(b);
        })();
    </script>
</body>
</html>
