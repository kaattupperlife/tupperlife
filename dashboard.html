                if(sortBy==='price-asc') return a.price - b.price;
                if(sortBy==='qty-desc') return b.quantity - a.quantity;
                if(sortBy==='qty-asc') return a.quantity - b.quantity;
                if(sortBy==='vinted-desc') return (Number(b.vinted)||0) - (Number(a.vinted)||0); 
                if(sortBy==='vinted-asc') return (Number(a.vinted)||0) - (Number(b.vinted)||0); 
                return 0;
            });

            const totalStockValue = filteredItems.reduce((sum, item) => sum + ((item.price || 0) * (item.quantity || 1)), 0);
            const totalStockCount = filteredItems.reduce((sum, item) => sum + (item.quantity || 1), 0);

            const totalItems = filteredItems.length;
            const totalPages = itemsPerPage === 'All' ? 1 : Math.ceil(totalItems / itemsPerPage);
            const displayedItems = itemsPerPage === 'All' ? filteredItems : filteredItems.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            const getCategoryColor = (catName) => {
                const cat = categories.find(c => c.name === catName);
                return cat ? cat.color : CATEGORY_COLORS[16];
            };
            const getLocationColor = (locName) => {
                const loc = locations.find(l => l.name === locName);
                return loc ? loc.color : CATEGORY_COLORS[16];
            };

            const formatEuro = (n) => new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(n || 0);
            
            if (loading) return <div className="text-center p-8"><Icons.Loader className="text-3xl text-emerald-600"/></div>;

            return (
                <div className="space-y-6">
                    {/* INPUT CARD */}
                    <div className={`p-6 rounded-3xl shadow-glass dark:shadow-glass-dark border transition-all duration-300 ${editingId ? 'bg-amber-50/80 dark:bg-amber-900/20 backdrop-blur-md border-amber-200 dark:border-amber-700' : 'bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-white/40 dark:border-slate-700'}`}>
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <h3 className={`font-bold text-xl flex items-center gap-3 ${editingId ? 'text-amber-800 dark:text-amber-400' : 'text-emerald-800 dark:text-emerald-400'}`}>
                                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-white ${editingId ? 'bg-gradient-to-br from-amber-400 to-amber-600' : 'bg-gradient-to-br from-emerald-400 to-emerald-600'}`}>
                                    {editingId ? <Icons.Edit className="text-lg"/> : <Icons.Package className="text-lg"/>} 
                                </div>
                                {editingId ? 'Product Wijzigen' : 'Nieuw Product'}
                            </h3>
                            <div className="flex gap-2 sm:gap-3 text-xs font-bold w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 custom-scroll">
                                <label className={`px-3 py-1.5 rounded-lg text-white font-bold transition-colors shadow-sm flex items-center gap-1.5 cursor-pointer shrink-0 ${importing ? 'bg-slate-400' : 'bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600'}`}>
                                    {importing ? <Icons.Loader/> : <Icons.Upload/>} {importing ? 'Bezig met importeren...' : 'CSV Import'}
                                    <input type="file" accept=".csv" className="hidden" onChange={handleImportCSV} disabled={importing}/>
                                </label>
                                <button onClick={()=>openManager('category')} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-slate-700 hover:text-emerald-600 transition-colors flex items-center gap-1.5 shrink-0"><Icons.Settings className="text-emerald-500"/> Categorieën</button>
                                <button onClick={()=>openManager('location')} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-slate-700 hover:text-emerald-600 transition-colors flex items-center gap-1.5 shrink-0"><Icons.Settings className="text-emerald-500"/> Locaties</button>
                            </div>
                        </div>

                        {(showCatManager || showLocManager) && (
                            <div className="mb-6 p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-sm animate-in">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b dark:border-slate-700"><span className="font-bold text-slate-700 dark:text-slate-200 text-base">Beheer {showCatManager ? 'Categorieën' : 'Locaties'}</span> <button onClick={()=>{setShowCatManager(false);setShowLocManager(false)}} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 flex items-center justify-center"><Icons.X className="dark:text-slate-400"/></button></div>
                                <div className="flex gap-3 mb-4">
                                    <input value={editName} onChange={e=>setEditName(e.target.value)} className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 dark:text-white p-2.5 rounded-xl flex-grow outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all" placeholder="Naam..."/>
                                    <button onClick={()=>saveConfig(showCatManager?'cat':'loc')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 rounded-xl font-bold shadow-sm transition-colors">OK</button>
                                </div>
                                <div className="flex gap-1.5 mb-4 flex-wrap bg-slate-50 dark:bg-slate-900 p-2 rounded-xl">{CATEGORY_COLORS.map((c,i)=><button key={i} onClick={()=>setEditColor(i)} className={`w-7 h-7 rounded-full border-2 ${c.bg} ${editColor===i?'border-emerald-600 ring-4 ring-emerald-200/50 dark:ring-emerald-900/50':'border-transparent hover:scale-110'} transition-all`} title={c.name}></button>)}</div>
                                <div className="max-h-40 overflow-y-auto space-y-1.5 custom-scroll pr-2">
                                    {(showCatManager?categories:locations).map((it, idx) => (
                                        <div key={idx} className="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-2.5 rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition-colors">
                                            <span className="flex items-center gap-3 text-slate-800 dark:text-slate-200 font-medium"><span className={`w-4 h-4 rounded-full ${it.color.bg} border border-slate-200 dark:border-slate-700`}></span>{it.name}</span>
                                            <div className="flex gap-1">
                                                <button onClick={()=>{startEditConfig(showCatManager?'category':'location', idx, it)}} className="w-8 h-8 rounded-lg text-slate-400 hover:bg-white dark:hover:bg-slate-800 hover:text-emerald-600 flex items-center justify-center transition-all"><Icons.Edit/></button>
                                                <button onClick={()=>deleteConfig(showCatManager?'cat':'loc', idx)} className="w-8 h-8 rounded-lg text-slate-400 hover:bg-white dark:hover:bg-slate-800 hover:text-red-500 flex items-center justify-center transition-all"><Icons.Trash/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="col-span-1 md:col-span-2">
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Naam</label>
                                <input value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium text-base shadow-sm" placeholder="Productnaam"/>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Categorie</label>
                                <select value={newItem.category} onChange={e=>setNewItem({...newItem, category:e.target.value})} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium shadow-sm cursor-pointer">{categories.map((c,i)=><option key={i} value={c.name}>{c.name}</option>)}</select>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Locatie</label>
                                <select value={newItem.location} onChange={e=>setNewItem({...newItem, location:e.target.value})} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium shadow-sm cursor-pointer">{locations.map((l,i)=><option key={i} value={l.name}>{l.name}</option>)}</select>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Prijs (€)</label>
                                <input type="text" inputMode="decimal" value={newItem.price} onChange={e=>{ const val = e.target.value.replace(',', '.'); if (/^\d*\.?\d*$/.test(val)) setNewItem({...newItem, price:val}); }} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-mono font-bold text-base shadow-sm"/>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Aantal in stock</label>
                                <input type="number" value={newItem.quantity} onChange={e=>setNewItem({...newItem, quantity:e.target.value})} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-mono font-bold text-base shadow-sm text-center"/>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block flex items-center gap-1"><Icons.Shirt className="text-[10px] text-cyan-500"/> Op Vinted</label>
                                <input type="number" value={newItem.vinted} onChange={e=>setNewItem({...newItem, vinted:e.target.value})} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-cyan-500/30 transition-all font-mono font-bold text-base shadow-sm text-center text-cyan-700 dark:text-cyan-400" placeholder="0"/>
                            </div>
                            
                            <div className="col-span-1 md:col-span-2 lg:col-span-1 flex flex-col justify-end">
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Status</label>
                                <div className="flex bg-slate-100 dark:bg-slate-800 rounded-xl p-1 h-[46px] border border-slate-200 dark:border-slate-700 shadow-inner">
                                    <button onClick={()=>setNewItem({...newItem, status:'zolder'})} className={`flex-1 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${newItem.status==='zolder'?'bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white scale-100':'text-slate-500 scale-95 hover:text-slate-700 dark:hover:text-slate-300'}`}>📦 Zolder</button>
                                    <button onClick={()=>setNewItem({...newItem, status:'gebruik'})} className={`flex-1 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${newItem.status==='gebruik'?'bg-white dark:bg-slate-600 shadow-sm text-emerald-600 dark:text-emerald-400 scale-100':'text-slate-500 scale-95 hover:text-emerald-600'}`}>🏠 Gebruik</button>
                                </div>
                            </div>
                            
                            <div className="col-span-1 md:col-span-2 lg:col-span-4">
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Afbeelding</label>
                                <div className="flex flex-col sm:flex-row gap-3">

                                                                <Icons.Shirt className="w-3 h-3"/>
                                                                Vinted: {item.vinted}

                                                        )}

                                                    <div className="flex flex-col items-end gap-2">
                                                        <div className="flex items-center border border-slate-200 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-800 shadow-sm overflow-hidden h-8">

                                                        </div>

                    </div>}
                </div>
            );
        };

        const RequestsTab = ({ targetUid }) => {
            const [list, setList] = useState([]);
            const [input, setInput] = useState({customer:'', product:'', note:'', image: '', email: '', phone: ''});
            const [uploading, setUploading] = useState(false);
            const [previewImage, setPreviewImage] = useState(null);
            const [editingId, setEditingId] = useState(null); 
            
            useEffect(() => {
                if(!targetUid) return;
                const unsub = window.db.collection('users').doc(targetUid).collection('requests').orderBy('createdAt','desc').onSnapshot(s => setList(s.docs.map(d=>({id:d.id,...d.data()}))));
                return () => unsub();
            }, [targetUid]);

            const handleSave = async () => { 
                if(input.customer && input.product) { 
                    if(editingId) {
                        await window.db.collection('users').doc(targetUid).collection('requests').doc(editingId).update(input);
                        setEditingId(null);
                    } else {
                        await window.db.collection('users').doc(targetUid).collection('requests').add({...input, completed:false, createdAt:Date.now()}); 
                    }
                    setInput({customer:'',product:'',note:'', image: '', email: '', phone: ''}); 
                } else {
                    window.showAlert("Vul minimaal de klantnaam en het product in.");
                }
            };
            
            const handleEdit = (item) => {
                setInput({ customer: item.customer, product: item.product, note: item.note || '', image: item.image || '', email: item.email || '', phone: item.phone || '' });
                setEditingId(item.id);
                window.scrollTo({top:0, behavior:'smooth'});
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    const ref = firebase.storage().ref().child(`users/${targetUid}/requests/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    setInput({...input, image: url});
                } catch (error) { window.showAlert("Upload fout: " + error.message); } finally { setUploading(false); }
            };

            const toggle = async (item) => window.db.collection('users').doc(targetUid).collection('requests').doc(item.id).update({completed:!item.completed});
            const del = (id) => { 
                window.showConfirm("Wens verwijderen?", async () => {
                    window.db.collection('users').doc(targetUid).collection('requests').doc(id).delete(); 
                });
            };

            const activeRequests = list.filter(item => !item.completed);
            const completedRequests = list.filter(item => item.completed);

            return (
                <div className="space-y-6">
                    <div className={`p-6 rounded-3xl shadow-glass dark:shadow-glass-dark border transition-all duration-300 ${editingId ? 'bg-amber-50/80 dark:bg-amber-900/20 backdrop-blur-md border-amber-200 dark:border-amber-700' : 'bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-white/40 dark:border-slate-700'}`}>

                                    <input type="file" className="hidden" onChange={handleImageUpload}/>
                                    {uploading ? <Icons.Loader className="text-emerald-600 text-xl"/> : (input.image ? <img src={input.image} className="w-full h-full object-cover"/> : <div className="text-center text-slate-400 font-medium text-[10px]"><Icons.Image className="text-2xl mb-1"/><br/>Foto</div>)}
                                </label>
                                <div className="flex flex-col gap-3 flex-grow">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <input value={input.customer} onChange={e=>setInput({...input, customer:e.target.value})} placeholder="Klant naam" className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium shadow-sm w-full"/>
                                        <input value={input.product} onChange={e=>setInput({...input, product:e.target.value})} placeholder="Gezocht Product" className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium shadow-sm w-full"/>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <input value={input.email} onChange={e=>setInput({...input, email:e.target.value})} placeholder="Email (optioneel)" className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium shadow-sm w-full"/>
                                        <input value={input.phone} onChange={e=>setInput({...input, phone:e.target.value})} placeholder="Telefoon (optioneel)" className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all font-medium shadow-sm w-full"/>
                                    </div>
                                </div>
                            </div>
                            <input value={input.image} onChange={e=>setInput({...input, image:e.target.value})} placeholder="Of plak een link naar een afbeelding..." className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-slate-300 p-3 rounded-xl text-sm w-full outline-none focus:ring-2 focus:ring-emerald-500/30 shadow-sm transition-all"/>
                            <input value={input.note} onChange={e=>setInput({...input, note:e.target.value})} placeholder="Notitie of specifieke wensen (optioneel)" className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-xl text-sm w-full outline-none focus:ring-2 focus:ring-emerald-500/30 shadow-sm transition-all"/>
                        </div>
                        <button onClick={handleSave} className={`w-full mt-6 py-3.5 text-white font-extrabold rounded-2xl shadow-lg transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0 ${editingId ? 'bg-gradient-to-r from-amber-500 to-amber-600 shadow-amber-500/30' : 'bg-gradient-to-r from-emerald-500 to-teal-500 shadow-emerald-500/30'}`}>

            };

            const executeImport = async () => {
                if (!importUserUid) return window.showAlert("Selecteer een gebruiker.");
                try {
                    const doc = await window.db.collection('users').doc(importUserUid).collection('years').doc(String(selectedYear)).collection('months').doc(selectedMonth).get();
                    if (doc.exists && doc.data().psLevels && doc.data().psLevels.length > 0) {
                        const imported = doc.data().psLevels.map((l, i) => ({ ...l, id: 'g_' + Date.now() + i }));
                        updateGlobalPsData(selectedMonth, [...psLevels, ...imported]);
                        window.showAlert(`${imported.length} beloningen succesvol geïmporteerd!`);
                        setShowImport(false);
                    } else {
                        window.showAlert(`Geen persoonlijke beloningen gevonden voor deze gebruiker in ${selectedMonth}.`);

                            </div>
                            <select value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)} className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white font-bold outline-none focus:ring-2 focus:ring-blue-500/30 shadow-sm cursor-pointer transition-all">
                                {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>

                            <button onClick={toggleImport} className="text-xs font-bold text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 flex items-center gap-1.5 transition-colors w-fit">
                                <div className="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><Icons.Upload className="text-[10px]"/></div> Bestaande PS importeren
                            </button>

                            {showImport && (
                                <div className="p-4 bg-blue-50/50 dark:bg-blue-900/20 rounded-2xl border border-blue-100 dark:border-blue-800/50 flex flex-col sm:flex-row gap-3 animate-in">
                                    <select value={importUserUid} onChange={e=>setImportUserUid(e.target.value)} className="flex-grow p-2.5 text-sm font-medium rounded-xl border border-blue-200 dark:border-blue-700/50 bg-white dark:bg-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/30">
                                        <option value="">-- Kies een gebruiker --</option>
                                        {usersList.map(u => <option key={u.uid} value={u.uid}>{u.name}</option>)}
                                    </select>
                                    <button onClick={executeImport} className="px-5 py-2.5 bg-blue-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-blue-700 hover:shadow-blue-500/30 transition-all">Importeer</button>
                                </div>
                            )}
                        </div>
                        <div className="p-5 overflow-y-auto space-y-5 custom-scroll">
                            {psLevels.length === 0 && <div className="text-center py-10 text-slate-400 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl"><Icons.Gift className="text-3xl mb-2 opacity-50 block mx-auto"/><p className="font-medium">Geen globale beloningen voor {selectedMonth}.</p></div>}
                            {psLevels.sort((a,b)=>(Number(a.amount)||0)-(Number(b.amount)||0)).map((level, index) => (
                                <div key={level.id} className="bg-blue-50/50 dark:bg-blue-900/10 border border-blue-100 dark:border-blue-800/50 rounded-2xl p-4 shadow-sm relative transition-all hover:border-blue-300 dark:hover:border-blue-600">
                                    <div className="flex justify-between items-center mb-3"><span className="text-xs font-black text-blue-600 dark:text-blue-400 uppercase tracking-widest">{level.label || `PS ${index + 1}`} (Globaal)</span><button onClick={() => deleteLevel(level.id)} className="w-8 h-8 rounded-full bg-white dark:bg-slate-800 shadow-sm text-slate-400 hover:text-red-500 flex items-center justify-center transition-colors"><Icons.Trash className="text-xs"/></button></div>
                                    <div className="grid grid-cols-1 gap-3 mb-4">
                                        <div className="flex gap-3">
                                            <div className="w-1/3"><label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Label</label><input type="text" placeholder={`PS ${index + 1}`} value={level.label} onChange={(e)=>updateLevel(level.id, 'label', e.target.value)} className="w-full p-2.5 text-sm font-bold border border-white dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl outline-none text-blue-700 dark:text-blue-400 focus:ring-2 focus:ring-blue-500/30"/></div>
                                            <div className="w-2/3"><label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Bedrag (€)</label><input type="number" value={level.amount} onChange={(e)=>updateLevel(level.id, 'amount', e.target.value)} className="w-full p-2.5 text-sm font-bold border border-white dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-blue-500/30"/></div>
                                        </div>
                                        <div><label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Naam</label><input type="text" placeholder="Bijv. Braadpan" value={level.name} onChange={(e)=>updateLevel(level.id, 'name', e.target.value)} className="w-full p-2.5 text-sm border border-white dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-blue-500/30"/></div>
                                    </div>
                                    <div><label className="text-[10px] font-bold text-slate-500 uppercase block mb-1.5">Afbeelding</label><div className="flex gap-3 items-center"><div className="w-16 h-16 rounded-xl border border-white dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center overflow-hidden shrink-0 shadow-sm relative">{uploadingId === level.id ? <Icons.Loader className="text-blue-600"/> : level.image ? <img src={level.image} className="w-full h-full object-cover"/> : <Icons.Image className="text-2xl text-slate-300"/>}</div><div className="flex-grow flex flex-col gap-2"><label className="flex items-center justify-center gap-2 px-3 py-2 bg-white dark:bg-slate-800 border border-white dark:border-slate-700 rounded-xl cursor-pointer hover:bg-blue-50 dark:hover:bg-slate-700 w-full transition-colors shadow-sm text-sm font-bold text-slate-600 dark:text-slate-300"><input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e, level.id)}/><Icons.Upload className="text-blue-500"/> Upload Foto</label><input type="text" placeholder="Of plak afbeeldingslink..." value={level.image} onChange={(e)=>updateLevel(level.id, 'image', e.target.value)} className="w-full p-2 text-xs border border-white dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-blue-500/30"/></div></div></div>
                                </div>
                            ))}
                            <button onClick={addLevel} className="w-full py-4 border-2 border-dashed border-blue-300 dark:border-blue-800 text-blue-600 dark:text-blue-400 rounded-2xl font-bold hover:bg-blue-50 dark:hover:bg-blue-900/20 flex items-center justify-center gap-2 transition-colors"><Icons.Plus/> Nieuw Niveau Toevoegen</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MonthRow = ({ month, monthIndex, year, data, updateMonthData, formatCurrency, user, globalPs }) => {
            const [expanded, setExpanded] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            const useCalendar = monthIndex >= 3;
            const calendarWeeks = useCalendar ? getMonthWeeks(year, month, monthIndex) : [];
            const manualWeeks = data.weeks || 4;
            
            const localPs = data.psLevels || [];
            const receivedGlobalPs = data.receivedGlobalPs || [];
            
            const allPs = [
                ...localPs.map(l => ({ ...l, isGlobal: false, received: !!l.received })),
                ...(globalPs || []).map(l => ({ ...l, isGlobal: true, received: receivedGlobalPs.includes(l.id) }))
            ].sort((a, b) => (Number(a.amount)||0) - (Number(b.amount)||0));
            
            let total = 0; 
            for(let i=1; i<=10; i++) total += Number(data[`week${i}`])||0;
            const profit = total * 0.29184;
            const earnedLevels = allPs.filter(l => total >= (Number(l.amount)||0)).length;

            const toggleReceived = (id, isGlobal) => { 
                if (isGlobal) {
                    const currentArr = data.receivedGlobalPs || [];
                    const newArr = currentArr.includes(id) ? currentArr.filter(x => x !== id) : [...currentArr, id];
                    updateMonthData(month, 'receivedGlobalPs', newArr);
                } else {
                    const newLevels = localPs.map(l => l.id === id ? { ...l, received: !l.received } : l); 
                    updateMonthData(month, 'psLevels', newLevels); 
                }
            };

            return (
                <React.Fragment>
                    <tr onClick={()=>setExpanded(!expanded)} className={`cursor-pointer border-b border-emerald-100/50 dark:border-slate-800 transition-colors duration-300 ${expanded?'bg-emerald-50/50 dark:bg-emerald-900/10 hover:bg-emerald-50 dark:hover:bg-emerald-900/20':'hover:bg-slate-50 dark:hover:bg-slate-800/50'}`}>
                        <td className="px-3 py-4 sm:p-5 font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 sm:gap-3">
                            <div className={`w-6 h-6 sm:w-8 sm:h-8 shrink-0 rounded-full flex items-center justify-center transition-colors ${expanded ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-400' : 'bg-slate-100 text-slate-400 dark:bg-slate-800'}`}>
                                {expanded ? <Icons.ChevronUp className="text-[10px] sm:text-base"/> : <Icons.ChevronDown className="text-[10px] sm:text-base"/>}
                            </div>
                            <div className="flex-grow min-w-0">
                                <div className="text-sm sm:text-lg flex items-center gap-2 truncate">
                                    {month}
                                </div>
                                {earnedLevels > 0 && <div className="text-[9px] sm:text-[10px] text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider bg-emerald-100 dark:bg-emerald-900/30 inline-flex items-center gap-1 px-1.5 sm:px-2 py-0.5 rounded mt-1"><Icons.Gift className="w-2 h-2 sm:w-2.5 sm:h-2.5"/> {earnedLevels} Cadeaus</div>}
                            </div>
                        </td>
                        <td className="px-3 py-4 sm:p-5 font-black text-sm sm:text-2xl text-slate-800 dark:text-white whitespace-nowrap">{formatCurrency(total)}</td>
                        <td className="px-3 py-4 sm:p-5 font-black text-sm sm:text-2xl text-right text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-teal-600 font-mono whitespace-nowrap">{formatCurrency(profit)}</td>
                    </tr>
                    {expanded && (
                        <tr>
                            <td colSpan="3" className="p-0 border-b-2 border-emerald-200 dark:border-emerald-800/50 bg-slate-50/30 dark:bg-slate-900/30">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8 p-4 sm:p-8 animate-in">
                                    {/* LINKER KOLOM: WEKEN */}
                                    <div className="space-y-4 sm:space-y-5">
                                        <div className="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700/50">
                                            <span className="text-[10px] sm:text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                                {useCalendar ? <Icons.Calendar className="text-emerald-500 text-sm sm:text-base" /> : <Icons.Euro className="text-emerald-500 text-sm sm:text-base"/>}
                                                {useCalendar ? `Verkoopkalender (${year})` : 'Verkoop'}
                                            </span>
                                            {!useCalendar && (
                                                <div className="flex bg-white dark:bg-slate-800 rounded-xl p-1 border border-slate-200 dark:border-slate-700 shadow-sm">{[4,5].map(n=><button key={n} onClick={(e)=>{e.stopPropagation();updateMonthData(month,'weeks',n)}} className={`px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-colors ${manualWeeks===n?'bg-emerald-500 text-white shadow-sm':'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>{n}</button>)}</div>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-1 gap-3 sm:gap-4">
                                            {useCalendar ? (
                                                calendarWeeks.map((weekInfo, index) => {
                                                    const w = index + 1;
                                                    const weekVal = Number(data[`week${w}`]) || 0;
                                                    const weekProfit = weekVal * 0.29184;
                                                    const dateRange = weekInfo.label.split('(')[1].replace(')', '');

                                                    return (
                                                        <div key={w} className="flex flex-col gap-2 bg-white dark:bg-[#1e293b] p-3 sm:p-4 rounded-2xl border border-slate-100 dark:border-slate-700/50 shadow-glass transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.06)] dark:hover:shadow-[0_8px_30px_rgba(16,185,129,0.05)] hover:-translate-y-0.5">
                                                            <div className="flex justify-between items-center text-[9px] sm:text-[10px] text-slate-400 dark:text-slate-500 mb-1">
                                                                <span className="font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">Week {weekInfo.weekNumber}</span>
                                                                <span className="bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700 px-2 py-1 rounded-md font-medium text-slate-500">{dateRange}</span>
                                                            </div>
                                                            <div className="flex items-center gap-2 sm:gap-4">
                                                                <div className="bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl flex justify-center items-center text-xs sm:text-sm font-black border border-emerald-100 dark:border-emerald-800 shrink-0">W{weekInfo.weekNumber}</div>
                                                                <div className="flex-grow">
                                                                    <input 
                                                                        type="text" inputMode="decimal" placeholder="0.00" value={data[`week${w}`]||''} 
                                                                        onClick={e=>e.stopPropagation()} 
                                                                        onChange={e=>{ const val = e.target.value.replace(',', '.'); if (/^\d*\.?\d*$/.test(val)) updateMonthData(month,`week${w}`,val); }} 
                                                                        className="w-full px-2 sm:px-3 py-2 sm:py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/30 text-sm sm:text-lg font-black font-mono transition-all"
                                                                    />
                                                                </div>
                                                                <div className="text-right shrink-0 min-w-[60px] sm:min-w-[80px]">
                                                                    <div className="text-[9px] sm:text-[10px] text-slate-400 dark:text-slate-500 uppercase font-black tracking-widest mb-0.5">Winst</div>
                                                                    <div className="font-mono font-black text-emerald-600 dark:text-emerald-400 text-xs sm:text-base">{formatCurrency(weekProfit)}</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )
                                                })
                                            ) : (
                                                Array.from({length:manualWeeks},(_,i)=>i+1).map(w => {
                                                    const weekVal = Number(data[`week${w}`]) || 0;
                                                    const weekProfit = weekVal * 0.29184;
                                                    return (
                                                        <div key={w} className="flex items-center gap-2 sm:gap-4 bg-white dark:bg-[#1e293b] p-3 sm:p-4 rounded-2xl border border-slate-100 dark:border-slate-700/50 shadow-glass transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.06)] dark:hover:shadow-[0_8px_30px_rgba(16,185,129,0.05)] hover:-translate-y-0.5">
                                                            <div className="bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl flex justify-center items-center text-sm sm:text-lg font-black border border-emerald-100 dark:border-emerald-800 shrink-0">{w}</div>
                                                            <div className="flex-grow">
                                                                <input 
                                                                    type="text" inputMode="decimal" placeholder="0.00" value={data[`week${w}`]||''} 
                                                                    onClick={e=>e.stopPropagation()} 
                                                                    onChange={e=>{ const val = e.target.value.replace(',', '.'); if (/^\d*\.?\d*$/.test(val)) updateMonthData(month,`week${w}`,val); }} 
                                                                    className="w-full px-2 sm:px-3 py-2 sm:py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/30 text-sm sm:text-lg font-black font-mono transition-all"
                                                                />
                                                            </div>
                                                            <div className="text-right shrink-0 min-w-[60px] sm:min-w-[80px]">
                                                                <div className="text-[9px] sm:text-[10px] text-slate-400 dark:text-slate-500 uppercase font-black tracking-widest mb-0.5">Winst</div>
                                                                <div className="font-mono font-black text-emerald-600 dark:text-emerald-400 text-xs sm:text-base">{formatCurrency(weekProfit)}</div>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>

                                    {/* RECHTER KOLOM: PS BELONINGEN */}
                                    <div className="space-y-4 sm:space-y-5">
                                        <div className="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700/50">
                                            <span className="text-[10px] sm:text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icons.Gift className="text-amber-500 text-sm sm:text-base"/> PS Beloningen</span>
                                            <button onClick={(e)=>{e.stopPropagation();setIsModalOpen(true)}} className="flex items-center gap-2 text-xs px-3 sm:px-4 py-1.5 sm:py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl font-bold shadow-sm transition-all hover:shadow-md"><Icons.Settings className="w-3"/> Instellen</button>
                                        </div>
                                        <div className="space-y-3 sm:space-y-4">
                                            {allPs.length === 0 ? <div className="text-center py-10 bg-slate-50 dark:bg-slate-800/50 text-slate-400 dark:text-slate-500 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-3xl"><Icons.Gift className="text-3xl mb-3 opacity-30 mx-auto block"/><p className="font-medium text-sm">Nog geen beloningen ingesteld.</p></div> : 
                                                [...allPs].sort((a,b)=>(Number(a.amount)||0)-(Number(b.amount)||0)).map((level, index) => {
                                                    const amt = Number(level.amount)||0; const unlocked = total >= amt && amt > 0;
                                                    return (
                                                        <div key={level.id} className={`bg-white dark:bg-slate-800 rounded-2xl sm:rounded-3xl overflow-hidden shadow-glass dark:shadow-glass-dark border transition-all duration-500 group ${unlocked ? 'border-emerald-400 shadow-[0_8px_30px_rgba(16,185,129,0.15)]' : 'border-slate-100 dark:border-slate-700 opacity-90'}`}>
                                                            {/* Progress Bar Top */}
                                                            <div className={`h-2 w-full bg-slate-100 dark:bg-slate-900 relative`}>
                                                                <div className={`absolute top-0 left-0 h-full transition-all duration-1000 ${unlocked ? 'bg-gradient-to-r from-emerald-400 to-teal-500 w-full' : 'bg-gradient-to-r from-amber-400 to-orange-400'}`} style={{ width: unlocked ? '100%' : `${Math.min(100, (total/amt)*100)}%` }}></div>
                                                            </div>
                                                            <div className="p-3 sm:p-5 flex gap-3 sm:gap-4 items-center">
                                                                <div className={`w-16 h-16 sm:w-20 sm:h-20 shrink-0 rounded-2xl flex items-center justify-center overflow-hidden relative shadow-sm border ${unlocked ? 'border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-900/20' : 'border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900'}`}>
                                                                    {level.image ? <img src={level.image} className={`w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 ${unlocked ? '' : 'grayscale opacity-70'}`}/> : <Icons.Image className="text-2xl sm:text-3xl text-slate-300"/>}
                                                                </div>
                                                                <div className="flex-grow min-w-0">
                                                                    <div className="flex flex-col mb-1 sm:mb-1.5">
                                                                        <span className={`text-[9px] sm:text-[10px] font-black uppercase tracking-widest ${unlocked ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}`}>
                                                                            {level.label || `PS ${index+1}`}
                                                                        </span>
                                                                        <h4 className="font-bold text-slate-800 dark:text-slate-100 text-sm sm:text-lg truncate leading-tight mt-0.5">{level.name||'Naamloos'}</h4>
                                                                    </div>
                                                                    <div className="text-xs sm:text-sm mt-1 sm:mt-2">{unlocked ? (<div className="flex items-center gap-2 sm:gap-3">{level.received ? (<span className="flex items-center gap-1 sm:gap-1.5 text-blue-600 dark:text-blue-300 font-bold bg-blue-50 dark:bg-blue-900/40 px-2 sm:px-3 py-1 sm:py-1.5 rounded-xl cursor-pointer border border-blue-100 dark:border-blue-800/50 shadow-sm transition-all hover:shadow-md text-[10px] sm:text-sm" onClick={(e) => {e.stopPropagation(); toggleReceived(level.id, level.isGlobal);}}><Icons.CheckCircle className="text-xs sm:text-sm"/> Ontvangen!</span>) : (<><span className="flex items-center gap-1 sm:gap-1.5 text-emerald-600 dark:text-emerald-400 font-black tracking-wide text-[10px] sm:text-sm"><Icons.CheckCircle className="text-xs sm:text-sm"/> Behaald!</span><button onClick={(e) => { e.stopPropagation(); toggleReceived(level.id, level.isGlobal); }} className="bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-900/40 dark:hover:bg-emerald-800/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-bold transition-all shadow-sm">Ontvangen?</button></>)}</div>) : <div className="text-slate-500 dark:text-slate-400 text-[10px] sm:text-xs font-medium bg-slate-50 dark:bg-slate-900 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg border border-slate-100 dark:border-slate-800 inline-block">Nog <strong className="text-amber-500 font-bold">{formatCurrency(Math.max(0, amt-total))}</strong></div>}</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            }
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    )}
                    <PsManagementModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} psLevels={localPs} updatePsLevels={(newLevels) => updateMonthData(month, 'psLevels', newLevels)} user={user} />
                </React.Fragment>
            )
        };

        function DashboardPage() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [monthlyData, setMonthlyData] = useState({});
            const [globalPsData, setGlobalPsData] = useState({});
            
            const [activeTab, setActiveTab] = useState('overview');
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [showGlobalPsModal, setShowGlobalPsModal] = useState(false);
            const [showCustomGoalsModal, setShowCustomGoalsModal] = useState(false); 
            const [customGoals, setCustomGoals] = useState([]); 
            const [viewingUser, setViewingUser] = useState(null); 
            const [showProfileMenu, setShowProfileMenu] = useState(false);
            const [darkMode, setDarkMode] = useState(localStorage.getItem('theme') === 'dark');
            const [showMobileMenu, setShowMobileMenu] = useState(false); 
            const [userPermissions, setUserPermissions] = useState({ showStock: true, showRequests: true, showCustomers: true, showRecipes: true, showClub: true });

            useEffect(() => {
                const unsub = window.auth.onAuthStateChanged(u => {
                    if (!u) window.location.href = 'index.html'; 
                    else { setUser(u); setLoading(false); }
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (darkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            }, [darkMode]);

            const targetUid = viewingUser ? viewingUser.uid : (user ? user.uid : null);
            const isAdmin = user && ADMIN_EMAILS.includes(user.email);

            useEffect(() => {
                if (!targetUid || !window.db) return;
                
                const unsubData = window.db.collection('users').doc(targetUid).collection('years').doc(String(selectedYear)).collection('months')
                    .onSnapshot(snap => {
                        const d = {};
                        snap.forEach(doc => d[doc.id] = doc.data());
                        setMonthlyData(d);
                    });

                const unsubPerms = window.db.collection('users').doc(targetUid).collection('settings').doc('config')
                    .onSnapshot(doc => {
                        if (doc.exists) setUserPermissions(doc.data());
                        else setUserPermissions({ showStock: true, showRequests: true, showCustomers: true, showRecipes: true, showClub: true }); 
                    });

                const unsubGoals = window.db.collection('users').doc(targetUid).collection('settings').doc('custom_goals')
                    .onSnapshot(doc => {
                        if (doc.exists) setCustomGoals(doc.data().list || []);
                        else setCustomGoals([]);
                    });
                    
                const unsubGlobalPs = window.db.collection('settings').doc(`global_ps_${selectedYear}`)
                    .onSnapshot(doc => {
                        if (doc.exists) setGlobalPsData(doc.data());
                        else setGlobalPsData({});
                    });

                return () => { unsubData(); unsubPerms(); unsubGoals(); unsubGlobalPs(); };
            }, [targetUid, selectedYear]);

            const availableWeeks = React.useMemo(() => buildAvailableWeeks(selectedYear, monthlyData), [selectedYear, monthlyData]);

            const updateMonthData = async (month, field, value) => {
                if(!targetUid) return;
                await window.db.collection('users').doc(targetUid).collection('years').doc(String(selectedYear)).collection('months').doc(month).set({
                    [field]: value, userId: targetUid, userName: viewingUser ? viewingUser.name : user.displayName, yearId: selectedYear, monthId: month
                }, { merge: true });
            };

            const updateCustomGoals = async (newGoalsList) => {
                if(!targetUid) return;
                await window.db.collection('users').doc(targetUid).collection('settings').doc('custom_goals').set({ list: newGoalsList }, { merge: true });
            };

            const updateGlobalPsData = async (month, newLevels) => {
                await window.db.collection('settings').doc(`global_ps_${selectedYear}`).set({
                    [month]: newLevels
                }, { merge: true });
            };

            const formatCurrency = (val) => new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(val || 0);

            if (loading) return <div className="h-screen flex flex-col items-center justify-center text-emerald-600 bg-slate-50 dark:bg-slate-900"><Icons.Loader className="text-5xl mb-4"/><div className="font-bold text-lg">Applicatie laden...</div></div>;

            return (
                <div className="relative">
                    <GlobalDialogs />
                    {/* Header Glassmorphism */}
                    <header className={`${viewingUser ? 'bg-amber-500/80 dark:bg-amber-900/80 border-amber-600/30' : 'bg-white/80 dark:bg-slate-900/80 border-slate-200/50 dark:border-slate-800/50'} backdrop-blur-xl border-b shadow-[0_4px_30px_rgba(0,0,0,0.05)] sticky top-0 z-30 transition-all duration-500`}>
                        <div className="max-w-4xl mx-auto px-5 py-3 relative flex items-center justify-between">
                            <button onClick={() => setShowMobileMenu(!showMobileMenu)} className={`sm:hidden text-2xl ${viewingUser ? 'text-white' : 'text-slate-600 dark:text-slate-300'}`}>
                                <Icons.Bars />
                            </button>

                            <h1 className={`font-black text-xl flex items-center gap-3 select-none absolute left-1/2 transform -translate-x-1/2 sm:static sm:translate-x-0 ${viewingUser ? 'text-white drop-shadow-md' : 'text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 to-teal-500 dark:from-emerald-400 dark:to-teal-300'}`}>
                                {viewingUser ? <Icons.Shield className="text-white"/> : <img src="favicon-32x32.png" className="w-8 h-8 bg-white rounded-xl shadow-sm"/>}
                                <span className="hidden sm:inline">Tupper Life {viewingUser ? '(ADMIN)' : 'by Kaat'}</span>
                                <span className="sm:hidden">{viewingUser ? 'ADMIN' : 'Tupper Life'}</span>
                            </h1>
                            
                            <div className="relative">
                                <button onClick={()=>setShowProfileMenu(!showProfileMenu)} className={`w-10 h-10 rounded-2xl flex items-center justify-center shadow-sm transition-transform hover:scale-105 border ${viewingUser ? 'bg-white/20 border-white/40 text-white' : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}`}>
                                    {user.photoURL ? <img src={user.photoURL} className="w-full h-full rounded-2xl object-cover"/> : <Icons.User/>}
                                </button>
                                {showProfileMenu && (
                                    <React.Fragment>
                                        <div className="fixed inset-0 z-10" onClick={()=>setShowProfileMenu(false)}></div>
                                        <div className="absolute right-0 mt-3 w-64 bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl rounded-3xl shadow-glass dark:shadow-glass-dark border border-white/50 dark:border-slate-700 z-20 py-2 overflow-hidden animate-in">
                                            <div className="px-5 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center gap-3">
                                                {user.photoURL ? <img src={user.photoURL} className="w-10 h-10 rounded-xl object-cover border border-slate-200 dark:border-slate-600"/> : <div className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center"><Icons.User/></div>}
                                                <div className="min-w-0">
                                                    <div className="text-sm font-black truncate text-slate-800 dark:text-white">{user.displayName}</div>
                                                    <div className="text-[10px] text-slate-500 font-medium truncate">{user.email}</div>
                                                </div>
                                            </div>
                                            
                                            <div className="px-5 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition-colors" onClick={()=>setDarkMode(!darkMode)}>
                                                <span className="text-sm font-bold flex items-center gap-3 text-slate-700 dark:text-slate-200"><Icons.Moon className="text-slate-400 text-lg"/> Donkere modus</span>
                                                <div className={`w-12 h-6 rounded-full relative transition-colors duration-300 shadow-inner ${darkMode ? 'bg-emerald-500' : 'bg-slate-200 dark:bg-slate-600'}`}>
                                                    <div className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 shadow-sm ${darkMode ? 'translate-x-6' : ''}`}></div>
                                                </div>
                                            </div>
                                            
                                            <button onClick={()=>{setShowCustomGoalsModal(true);setShowProfileMenu(false)}} className="w-full text-left px-5 py-3.5 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-bold flex gap-3 items-center border-b border-slate-100 dark:border-slate-700 transition-colors">
                                                <Icons.Target className="text-lg"/> Mijn Doelen
                                            </button>
                                            
                                            {isAdmin && <button onClick={()=>{setShowGlobalPsModal(true);setShowProfileMenu(false)}} className="w-full text-left px-5 py-3.5 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-bold flex gap-3 items-center border-b border-slate-100 dark:border-slate-700 transition-colors"><Icons.Gift className="text-lg"/> Globale PS</button>}
                                            {isAdmin && <button onClick={()=>{setShowAdminModal(true);setShowProfileMenu(false)}} className="w-full text-left px-5 py-3.5 hover:bg-amber-50 dark:hover:bg-amber-900/30 text-amber-600 dark:text-amber-400 font-bold flex gap-3 items-center border-b border-slate-100 dark:border-slate-700 transition-colors"><Icons.Users className="text-lg"/> Beheer Gebruikers</button>}
                                            <button onClick={()=>window.auth.signOut()} className="w-full text-left px-5 py-3.5 hover:bg-red-50 dark:hover:bg-red-900/30 text-red-600 dark:text-red-400 flex gap-3 items-center transition-colors"><Icons.LogOut className="text-lg"/> Uitloggen</button>
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>
                        </div>
                        {viewingUser && <div className="bg-amber-100 dark:bg-amber-900 text-amber-900 dark:text-amber-100 text-center text-xs font-bold py-1.5 flex justify-center items-center gap-2 shadow-inner"><span>Je bekijkt nu het account van: <strong className="uppercase">{viewingUser.name}</strong></span> <button onClick={()=>setViewingUser(null)} className="underline ml-2 hover:text-amber-700 transition-colors">Afsluiten</button></div>}
                    </header>

                    {showMobileMenu && (
                        <div className="sm:hidden bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 shadow-glass absolute w-full z-20 animate-in rounded-b-3xl">
                            <div className="flex flex-col p-4 gap-2">
                                {['overview', 'requests', 'stock', 'recipes', 'customers'].map(tab => {
                                    if(tab === 'requests' && !userPermissions.showRequests && !isAdmin) return null;
                                    if(tab === 'stock' && !userPermissions.showStock && !isAdmin) return null;
                                    if(tab === 'recipes' && !userPermissions.showRecipes && !isAdmin) return null;
                                    if(tab === 'customers' && !userPermissions.showCustomers && !isAdmin) return null;

                                    const labels = { overview: 'Overzicht', requests: 'Wensen', stock: 'Voorraad', recipes: 'Recepten', customers: 'Klanten' };
                                    const icons = { overview: <Icons.Layers className="mr-2"/>, requests: !userPermissions.showRequests ? <Icons.Lock className="opacity-50 ml-auto"/> : <Icons.Gift className="mr-2"/>, stock: !userPermissions.showStock ? <Icons.Lock className="opacity-50 ml-auto"/> : <Icons.Box className="mr-2"/>, recipes: !userPermissions.showRecipes ? <Icons.Lock className="opacity-50 ml-auto"/> : <Icons.BookOpen className="mr-2"/>, customers: !userPermissions.showCustomers ? <Icons.Lock className="opacity-50 ml-auto"/> : <Icons.Users className="mr-2"/> };
                                    
                                    return (
                                        <button key={tab} onClick={()=>{setActiveTab(tab); setShowMobileMenu(false)}} className={`text-left px-5 py-4 rounded-2xl text-base font-bold transition-all flex items-center ${activeTab===tab?'bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-lg shadow-emerald-500/30':'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                            {icons[tab]} {labels[tab]}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto p-4 sm:p-6 animate-in">
                        {/* Navigatie Balk (Desktop) */}
                        <div className="hidden sm:flex flex-row gap-3 items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-2.5 rounded-3xl border border-white/50 dark:border-slate-700/50 shadow-glass mb-8">
                            <div className="flex gap-2 w-auto overflow-x-auto">
                                {['overview', 'requests', 'stock', 'recipes', 'customers'].map(tab => {
                                    if(tab === 'requests' && !userPermissions.showRequests && !isAdmin) return null;
                                    if(tab === 'stock' && !userPermissions.showStock && !isAdmin) return null;
                                    if(tab === 'recipes' && !userPermissions.showRecipes && !isAdmin) return null;
                                    if(tab === 'customers' && !userPermissions.showCustomers && !isAdmin) return null;

                                    const labels = { overview: 'Overzicht', requests: 'Wensen', stock: 'Voorraad', recipes: 'Recepten', customers: 'Klanten' };
                                    const icons = { overview: <Icons.Layers/>, requests: !userPermissions.showRequests ? <Icons.Lock className="ml-1 opacity-50"/> : <Icons.Gift/>, stock: !userPermissions.showStock ? <Icons.Lock className="ml-1 opacity-50"/> : <Icons.Box/>, recipes: !userPermissions.showRecipes ? <Icons.Lock className="ml-1 opacity-50"/> : <Icons.BookOpen/>, customers: !userPermissions.showCustomers ? <Icons.Lock className="ml-1 opacity-50"/> : <Icons.Users/> };
                                    
                                    return (
                                        <button key={tab} onClick={()=>setActiveTab(tab)} className={`whitespace-nowrap px-5 py-3 rounded-2xl text-sm font-bold transition-all duration-300 flex items-center gap-2 ${activeTab===tab?'bg-gradient-to-r from-emerald-500 to-teal-500 shadow-lg shadow-emerald-500/30 text-white translate-y-[-2px]':'text-slate-500 dark:text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-slate-800'}`}>
                                            {icons[tab]} {labels[tab]}
                                        </button>
                                    );
                                })}
                            </div>
                            
                            {activeTab === 'overview' && (
                                <select value={selectedYear} onChange={e=>setSelectedYear(Number(e.target.value))} className="bg-emerald-50 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-300 font-bold px-5 py-3 rounded-2xl border border-emerald-200/50 dark:border-emerald-800/50 outline-none cursor-pointer hover:bg-emerald-100 dark:hover:bg-emerald-800/50 transition-colors shadow-sm ml-2">
                                    {[0,1,2,3,4].map(i => <option key={i} value={new Date().getFullYear()-2+i}>{new Date().getFullYear()-2+i}</option>)}
                                </select>
                            )}
                        </div>

                        {/* Mobiele Titelbalk */}
                        <div className="sm:hidden flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-white/50 dark:border-slate-700/50 shadow-glass mb-6">
                            <span className="font-black text-xl text-slate-800 dark:text-white flex items-center gap-2">
                                {activeTab === 'overview' && <><Icons.Layers className="text-emerald-500"/> Overzicht</>}
                                {activeTab === 'requests' && <><Icons.Gift className="text-emerald-500"/> Wensen</>}
                                {activeTab === 'stock' && <><Icons.Box className="text-emerald-500"/> Voorraad</>}
                                {activeTab === 'recipes' && <><Icons.BookOpen className="text-emerald-500"/> Recepten</>}
                                {activeTab === 'customers' && <><Icons.Users className="text-emerald-500"/> Klanten</>}
                            </span>
                            {activeTab === 'overview' && (
                                <select value={selectedYear} onChange={e=>setSelectedYear(Number(e.target.value))} className="bg-emerald-50 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-300 font-bold px-3 py-2 rounded-xl border border-emerald-200 dark:border-emerald-800/50 outline-none text-sm shadow-sm">
                                    {[0,1,2,3,4].map(i => <option key={i} value={new Date().getFullYear()-2+i}>{new Date().getFullYear()-2+i}</option>)}
                                </select>
                            )}
                        </div>

                        {/* HOOFD INHOUD */}
                        {activeTab === 'overview' && (
                            <div className="space-y-8">
                                {(userPermissions.showClub || isAdmin) && (
                                    <ClubTab targetUid={targetUid} monthlyData={monthlyData} selectedYear={selectedYear} formatCurrency={formatCurrency} />
                                )}

                                <CustomGoalsDisplay customGoals={customGoals} monthlyData={monthlyData} selectedYear={selectedYear} formatCurrency={formatCurrency} availableWeeks={availableWeeks} />

                                <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-3xl shadow-glass dark:shadow-glass-dark border border-white/40 dark:border-slate-700 overflow-hidden w-full">
                                    <div className="w-full overflow-x-auto custom-scroll pb-2">
                                        <table className="w-full text-left border-collapse min-w-full">
                                            <thead className="bg-slate-50/50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700/50 backdrop-blur-sm">
                                                <tr>
                                                    <th className="px-2 sm:px-4 py-3 sm:py-5 text-xs sm:text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400 font-black whitespace-nowrap">Maand</th>
                                                    <th className="px-2 sm:px-4 py-3 sm:py-5 text-xs sm:text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400 font-black whitespace-nowrap text-right">Verkoop</th>
                                                    <th className="px-2 sm:px-4 py-3 sm:py-5 text-xs sm:text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400 font-black whitespace-nowrap text-right">Winst</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {MONTHS.map((m, index) => <MonthRow key={m} month={m} monthIndex={index} year={selectedYear} data={monthlyData[m]||{}} updateMonthData={updateMonthData} formatCurrency={formatCurrency} user={user} globalPs={globalPsData[m] || []} />)}
                                            </tbody>
                                            <tfoot className="bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-[0_-4px_20px_rgba(16,185,129,0.2)]">
                                                <tr>
                                                    <td className="px-2 sm:px-4 py-3 sm:py-5 font-black text-sm sm:text-lg uppercase tracking-widest whitespace-nowrap">
                                                        <span className="sm:hidden">Totaal</span>
                                                        <span className="hidden sm:inline">Totaal Jaar</span>
                                                    </td>
                                                    <td className="px-2 sm:px-4 py-3 sm:py-5 font-black text-base sm:text-2xl whitespace-nowrap text-right">{formatCurrency(MONTHS.reduce((acc,m)=>{let t=0;for(let i=1;i<=10;i++)t+=Number((monthlyData[m]||{})[`week${i}`])||0;return acc+t},0))}</td>
                                                    <td className="px-2 sm:px-4 py-3 sm:py-5 font-black text-base sm:text-2xl text-right font-mono whitespace-nowrap">{formatCurrency(MONTHS.reduce((acc,m)=>{let t=0;for(let i=1;i<=10;i++)t+=Number((monthlyData[m]||{})[`week${i}`])||0;return acc+(t*0.29184)},0))}</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'requests' && ((userPermissions.showRequests || isAdmin) ? <RequestsTab targetUid={targetUid}/> : <div className="text-center py-20 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md rounded-3xl border border-white dark:border-slate-700 shadow-glass text-slate-400 font-bold text-lg"><Icons.Lock className="text-4xl mb-3 mx-auto block opacity-50"/> Deze module is uitgeschakeld voor u.</div>)}
                        {activeTab === 'stock' && ((userPermissions.showStock || isAdmin) ? <StockTab targetUid={targetUid} user={user}/> : <div className="text-center py-20 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md rounded-3xl border border-white dark:border-slate-700 shadow-glass text-slate-400 font-bold text-lg"><Icons.Lock className="text-4xl mb-3 mx-auto block opacity-50"/> Deze module is uitgeschakeld voor u.</div>)}
                        {activeTab === 'recipes' && ((userPermissions.showRecipes || isAdmin) ? <RecipesTab targetUid={targetUid}/> : <div className="text-center py-20 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md rounded-3xl border border-white dark:border-slate-700 shadow-glass text-slate-400 font-bold text-lg"><Icons.Lock className="text-4xl mb-3 mx-auto block opacity-50"/> Deze module is uitgeschakeld voor u.</div>)}
                        {activeTab === 'customers' && ((userPermissions.showCustomers || isAdmin) ? <CustomersTab targetUid={targetUid}/> : <div className="text-center py-20 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md rounded-3xl border border-white dark:border-slate-700 shadow-glass text-slate-400 font-bold text-lg"><Icons.Lock className="text-4xl mb-3 mx-auto block opacity-50"/> Deze module is uitgeschakeld voor u.</div>)}
                    </div>

                    <AdminUserModal isOpen={showAdminModal} onClose={()=>setShowAdminModal(false)} selectedYear={selectedYear} onSelectUser={(u)=>{setViewingUser(u);setShowAdminModal(false)}}/>
                    <CustomGoalsModal isOpen={showCustomGoalsModal} onClose={()=>setShowCustomGoalsModal(false)} customGoals={customGoals} updateCustomGoals={updateCustomGoals} formatCurrency={formatCurrency} availableWeeks={availableWeeks} />
                    <GlobalPsAdminModal isOpen={showGlobalPsModal} onClose={()=>setShowGlobalPsModal(false)} selectedYear={selectedYear} globalPsData={globalPsData} updateGlobalPsData={updateGlobalPsData} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardPage />);
    </script>
</body>
</html>
