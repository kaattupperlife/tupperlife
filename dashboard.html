    <!--
        DE APP
        De code hieronder is gewone React/JSX en kan je net zoals vroeger aanpassen.
        Ze wordt één keer vertaald en daarna in de browser bewaard, zodat de app
        bij een volgend bezoek veel sneller opent. Na een aanpassing wordt ze
        automatisch opnieuw vertaald.
    -->
    <script type="text/x-jsx" id="app-source">
        // === VUL HIER JOUW IMGBB API KEY IN ===
        const IMGBB_API_KEY = '2d8cfe2bc06041aea3bb266afde53d66';
        // ======================================

        const { useState, useEffect } = React;
        
        // De lijst met beheerders staat in firebase-setup.js (window.ADMIN_EMAILS), zodat inlogpagina, app en beheer-app dezelfde lijst gebruiken.
        const ADMIN_EMAILS = (window.ADMIN_EMAILS || ['jaiderjannis@gmail.com', 'kaat.tupperware@gmail.com']).map(e => e.toLowerCase());
        const isAdminEmail = (email) => !!email && ADMIN_EMAILS.includes(String(email).toLowerCase());
        const MONTHS = ['Januari', 'Februari', 'Maart', 'April', 'Mei', 'Juni', 'Juli & Augustus', 'September', 'Oktober', 'November', 'December'];
        
        window.uploadToImgBB = async (file) => {
            if (!IMGBB_API_KEY || IMGBB_API_KEY === 'JOUW_SLEUTEL_HIER') {
                throw new Error("ImgBB API Key ontbreekt! Vul je code in bovenaan de HTML file.");
            }
            const formData = new FormData();
            formData.append('image', file);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            if (data.success) {
                return data.data.url; 
            } else {
                throw new Error(data.error?.message || "Upload naar ImgBB mislukt.");
            }
        };

        // ===== ACTIVITEIT =====
        // Houdt bij wat een gebruiker in haar EIGEN account doet (niet wat een beheerder voor haar doet).
        window.logActivity = (targetUid, type, text) => {
            try {
                const me = window.auth && window.auth.currentUser;
                if (!me || !targetUid || me.uid !== targetUid) return;
                const key = type + '|' + text;
                window.__actThrottle = window.__actThrottle || {};
                const now = Date.now();
                if (window.__actThrottle[key] && now - window.__actThrottle[key] < 120000) return; // zelfde actie max. 1x per 2 min
                window.__actThrottle[key] = now;
                const base = window.db.collection('users').doc(me.uid);
                base.collection('activity').add({ ts: now, type, text }).catch(() => {});
                base.collection('settings').doc('profile').set({ lastActive: now, lastAction: text, lastActionAt: now }, { merge: true }).catch(() => {});
            } catch (e) {}
        };

        // Bezoek registreren + 'laatst actief' bijhouden zolang de app open staat
        window.recordVisit = (u) => {
            try {
                if (!u || window.__visitRecorded) return;
                window.__visitRecorded = true;
                const now = Date.now();
                const device = /iPad|Tablet/i.test(navigator.userAgent) ? 'tablet' : (/Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'gsm' : 'computer');
                const base = window.db.collection('users').doc(u.uid);
                const ref = base.collection('settings').doc('profile');
                const info = { type: 'profile', uid: u.uid, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '', lastLogin: now, lastActive: now, device, app: window.TL_MODE === 'admin' ? 'beheer' : 'app' };
                ref.get().then(d => {
                    const prev = d.exists ? d.data() : {};
                    ref.set({ ...info, firstSeen: prev.firstSeen || now, visits: (Number(prev.visits) || 0) + 1 }, { merge: true }).catch(() => {});
                }).catch(() => ref.set(info, { merge: true }).catch(() => {}));
                // Ook een hoofd-document, zodat de beheerder iedereen kan terugvinden (mag mislukken)
                base.set({ uid: u.uid, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '', lastActive: now }, { merge: true }).catch(() => {});
                let lastVisitLog = 0;
                try { lastVisitLog = Number(sessionStorage.getItem('tl-visit-log') || 0); } catch (e) {}
                if (now - lastVisitLog > 30 * 60 * 1000) {
                    base.collection('activity').add({ ts: now, type: 'bezoek', text: `Ingelogd (${device})` }).catch(() => {});
                    try { sessionStorage.setItem('tl-visit-log', String(now)); } catch (e) {}
                }
                const beat = () => {
                    if (document.visibilityState !== 'visible') return;
                    ref.set({ lastActive: Date.now() }, { merge: true }).catch(() => {});
                };
                setInterval(beat, 5 * 60 * 1000);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') beat(); });
            } catch (e) {}
        };

        window.showAlert = (msg) => {
            window.dispatchEvent(new CustomEvent('custom-alert', { detail: msg }));
        };
        window.showConfirm = (msg, onConfirm) => {
            window.dispatchEvent(new CustomEvent('custom-confirm', { detail: { msg, onConfirm } }));
        };

        const GlobalDialogs = () => {
            const [alertData, setAlertData] = useState(null);
            const [confirmData, setConfirmData] = useState(null);

            useEffect(() => {
                const handleAlert = (e) => setAlertData(e.detail);
                const handleConfirm = (e) => setConfirmData(e.detail);
                window.addEventListener('custom-alert', handleAlert);
                window.addEventListener('custom-confirm', handleConfirm);
                return () => {
                    window.removeEventListener('custom-alert', handleAlert);
                    window.removeEventListener('custom-confirm', handleConfirm);
                };
            }, []);

            return (
                <React.Fragment>
                    {alertData && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in">
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-glass dark:shadow-glass-dark max-w-sm w-full border border-slate-200/80 dark:border-slate-800">
                                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-2 flex items-center gap-2"><Icons.CheckCircle className="text-emerald-500"/> Melding</h3>
                                <p className="text-slate-600 dark:text-slate-300 mb-6 whitespace-pre-wrap">{alertData}</p>
                                <button onClick={() => setAlertData(null)} className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20">OK, begrepen</button>
                            </div>
                        </div>
                    )}
                    {confirmData && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in">
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-glass dark:shadow-glass-dark max-w-sm w-full border border-slate-200/80 dark:border-slate-800">
                                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-2 flex items-center gap-2"><Icons.Shield className="text-amber-500"/> Bevestigen</h3>
                                <p className="text-slate-600 dark:text-slate-300 mb-6 font-medium">{confirmData.msg}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmData(null)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-white rounded-xl font-bold transition-all">Annuleren</button>
                                    <button onClick={() => { confirmData.onConfirm(); setConfirmData(null); }} className="flex-1 py-3 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-red-500/20">Ja, doorgaan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        };

        // Toont 0.5 / 0,5 in een PS-label als 1/2 (bv. "0.5 PS" -> "1/2 PS", "PS 1,5" -> "PS 1 1/2")
        const formatPsLabel = (label) => String(label || '').replace(/(\d*)[.,]5(?!\d)/g, (m, whole) => (whole && Number(whole) > 0) ? `${Number(whole)} 1/2` : '1/2');

        const getRealMonthRange = (monthName, index) => {
            if (monthName === 'Juli & Augustus') return { start: 6, end: 7 }; 
            if (monthName === 'September') return { start: 8, end: 8 };
            if (monthName === 'Oktober') return { start: 9, end: 9 };
            if (monthName === 'November') return { start: 10, end: 10 };
            if (monthName === 'December') return { start: 11, end: 11 };
            return { start: index, end: index };
        };

        const getWeekNumber = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
            return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
        };

        const getMonthWeeks = (y, mName, mIdx) => {
            const range = getRealMonthRange(mName, mIdx);
            const weeks = [];
            const firstDayOfMonth = new Date(y, range.start, 1);
            const lastDayOfMonth = new Date(y, range.end + 1, 0);

            let currentWeekStart = new Date(firstDayOfMonth);
            const firstDayDayOfWeek = currentWeekStart.getDay();
            if (firstDayDayOfWeek !== 1) {
                const offset = firstDayDayOfWeek === 0 ? -6 : 1 - firstDayDayOfWeek;
                currentWeekStart.setDate(currentWeekStart.getDate() + offset);
            }

            while (currentWeekStart <= lastDayOfMonth) {
                let currentWeekEnd = new Date(currentWeekStart);
                currentWeekEnd.setDate(currentWeekEnd.getDate() + 6);

                const weekNum = getWeekNumber(currentWeekStart);

                let visibleStart = new Date(Math.max(currentWeekStart, firstDayOfMonth));
                let visibleEnd = new Date(Math.min(currentWeekEnd, lastDayOfMonth));

                const formatShortDate = (d) => `${d.getDate()} ${['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()]}`;
                
                let labelDateRange;
                if (visibleStart.getTime() === visibleEnd.getTime()) {
                    labelDateRange = formatShortDate(visibleStart); 
                } else {
                    labelDateRange = `${formatShortDate(visibleStart)} - ${formatShortDate(visibleEnd)}`;
                }

                weeks.push({
                    start: new Date(visibleStart), 
                    end: new Date(visibleEnd),
                    actualWeekStart: new Date(currentWeekStart), 
                    actualWeekEnd: new Date(currentWeekEnd),
                    weekNumber: weekNum,
                    label: `W${weekNum} (${labelDateRange})`
                });

                currentWeekStart = new Date(currentWeekEnd);
                currentWeekStart.setDate(currentWeekStart.getDate() + 1);
            }
            return weeks;
        };

        const buildAvailableWeeks = (year, mData) => {
            let list = [];
            MONTHS.forEach((m, index) => {
                const range = getRealMonthRange(m, index);
                const useCalendar = index >= 3;
                const calWeeks = useCalendar ? getMonthWeeks(year, m, index) : [];
                const numWeeks = useCalendar ? calWeeks.length : (mData[m]?.weeks || 4);

                for (let i = 1; i <= numWeeks; i++) {
                    let label = `${m} - Week ${i}`;
                    let endDate = new Date(year, range.end + 1, 0); 
                    
                    if (useCalendar && calWeeks[i-1]) {
                        label = `${calWeeks[i-1].label}`;
                        endDate = calWeeks[i-1].end;
                    } else {
                        const monthDays = new Date(year, range.end + 1, 0).getDate();
                        const chunk = monthDays / numWeeks;
                        endDate = new Date(year, range.start, Math.round(chunk * i));
                    }

                    list.push({
                        id: `${m}-w${i}`, month: m, week: i, label: label, absoluteIndex: list.length,
                        endDate: endDate.toISOString(), isCalendar: useCalendar,
                        weekNumber: (useCalendar && calWeeks[i-1]) ? calWeeks[i-1].weekNumber : null
                    });
                }
            });
            return list;
        };

        const CATEGORY_COLORS = [
            { name: 'Smaragd', bg: 'bg-emerald-100 dark:bg-emerald-900', text: 'text-emerald-700 dark:text-emerald-200' },
            { name: 'Groenblauw', bg: 'bg-teal-100 dark:bg-teal-900', text: 'text-teal-700 dark:text-teal-200' },
            { name: 'Cyaan', bg: 'bg-cyan-100 dark:bg-cyan-900', text: 'text-cyan-700 dark:text-cyan-200' },
            { name: 'Hemelsblauw', bg: 'bg-sky-100 dark:bg-sky-900', text: 'text-sky-700 dark:text-sky-200' },
            { name: 'Blauw', bg: 'bg-blue-100 dark:bg-blue-900', text: 'text-blue-700 dark:text-blue-200' },
            { name: 'Indigo', bg: 'bg-indigo-100 dark:bg-indigo-900', text: 'text-indigo-700 dark:text-indigo-200' },
            { name: 'Violet', bg: 'bg-violet-100 dark:bg-violet-900', text: 'text-violet-700 dark:text-violet-200' },
            { name: 'Paars', bg: 'bg-purple-100 dark:bg-purple-900', text: 'text-purple-700 dark:text-purple-200' },
            { name: 'Fuchsia', bg: 'bg-fuchsia-100 dark:bg-fuchsia-900', text: 'text-fuchsia-700 dark:text-fuchsia-200' },
            { name: 'Roze', bg: 'bg-pink-100 dark:bg-pink-900', text: 'text-pink-700 dark:text-pink-200' },
            { name: 'Rozerood', bg: 'bg-rose-100 dark:bg-rose-900', text: 'text-rose-700 dark:text-rose-200' },
            { name: 'Rood', bg: 'bg-red-100 dark:bg-red-900', text: 'text-red-700 dark:text-red-200' },
            { name: 'Oranje', bg: 'bg-orange-100 dark:bg-orange-900', text: 'text-orange-700 dark:text-orange-200' },
            { name: 'Amber', bg: 'bg-amber-100 dark:bg-amber-900', text: 'text-amber-700 dark:text-amber-200' },
            { name: 'Geel', bg: 'bg-yellow-100 dark:bg-yellow-900', text: 'text-yellow-700 dark:text-yellow-200' },
            { name: 'Limoen', bg: 'bg-lime-100 dark:bg-lime-900', text: 'text-lime-700 dark:text-lime-200' },
            { name: 'Leisteen', bg: 'bg-slate-100 dark:bg-slate-700', text: 'text-slate-700 dark:text-slate-200' },
            { name: 'Zink', bg: 'bg-zinc-100 dark:bg-zinc-800', text: 'text-zinc-700 dark:text-zinc-200' },
            { name: 'Neutraal', bg: 'bg-neutral-100 dark:bg-neutral-800', text: 'text-neutral-700 dark:text-neutral-200' },
            { name: 'Steen', bg: 'bg-stone-100 dark:bg-stone-800', text: 'text-stone-700 dark:text-stone-200' },
        ];

const CatalogsTab = ({ isAdmin, section = 'view', showPromotions = true }) => {
            const [catalogs, setCatalogs] = useState([]);
            const [promotions, setPromotions] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            
            const [isAdding, setIsAdding] = useState(false);
            const [adminPanel, setAdminPanel] = useState(null); // 'Catalogus' | 'Leaflet' | 'Ander' | 'promo'
            const ADMIN_PANELS = [
                { id: 'Catalogus', label: 'Catalogen',     icon: 'fa-book-open',  iconCls: 'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400', activeCls: 'bg-gradient-to-br from-emerald-500 to-teal-500 border-transparent' },
                { id: 'Leaflet',   label: 'Leaflets',      icon: 'fa-newspaper',  iconCls: 'bg-sky-50 text-sky-600 dark:bg-sky-900/30 dark:text-sky-400',             activeCls: 'bg-gradient-to-br from-sky-500 to-blue-500 border-transparent' },
                { id: 'Ander',     label: 'Andere',        icon: 'fa-folder-open', iconCls: 'bg-violet-50 text-violet-600 dark:bg-violet-900/30 dark:text-violet-400', activeCls: 'bg-gradient-to-br from-violet-500 to-purple-500 border-transparent' },
                { id: 'promo',     label: 'Weekpromoties', icon: 'fa-images',     iconCls: 'bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400', activeCls: 'bg-gradient-to-br from-orange-500 to-rose-500 border-transparent' },
            ];
            const openPanel = (id) => { setAdminPanel(prev => prev === id ? null : id); setIsAdding(false); setEditingCatalogId(null); };
            const currentCatPanel = ADMIN_PANELS.find(pnl => pnl.id === adminPanel && pnl.id !== 'promo');
            const [input, setInput] = useState({ title: '', type: 'Catalogus', url: '' });
            
            const [uploading, setUploading] = useState(false);
            const [previewImage, setPreviewImage] = useState(null);
            
            // Bewerk states voor Catalogen
            const [editingCatalogId, setEditingCatalogId] = useState(null);
            const [editCatalogInput, setEditCatalogInput] = useState({ title: '', type: 'Catalogus', url: '' });

            // Bewerk states voor Promoties
            const [editingPromoId, setEditingPromoId] = useState(null);
            const [editPromoTitle, setEditPromoTitle] = useState('');

            useEffect(() => {
                const unsubCat = window.db.collection('settings').doc('global_catalogs').onSnapshot(doc => {
                    if (doc.exists && doc.data().list) {
                        const list = doc.data().list || [];
                        setCatalogs(list);
                        setSelectedItem(prev => prev ? (list.find(c => c.id === prev.id) || null) : null);
                    }
                });
                
                const unsubPromo = window.db.collection('settings').doc('global_promotions').onSnapshot(doc => {
                    if (doc.exists && doc.data().list) {
                        setPromotions(doc.data().list || []);
                    }
                });

                return () => { unsubCat(); unsubPromo(); };
            }, []);

            // --- CATALOG LOGIC ---
            const handleSaveCatalog = async () => {
                if (!input.title || !input.url) return window.showAlert("Vul een titel en een link in.");
                const newList = [...catalogs, { id: Date.now().toString(), ...input, createdAt: Date.now() }];
                await window.db.collection('settings').doc('global_catalogs').set({ list: newList }, { merge: true });
                setIsAdding(false);
                setInput({ title: '', type: 'Catalogus', url: '' });
                window.showAlert("Succesvol toegevoegd!");
            };

            const handleSaveCatalogEdit = async (id) => {
                if (!editCatalogInput.title || !editCatalogInput.url) return window.showAlert("Vul een titel en link in.");
                const newList = catalogs.map(c => c.id === id ? { ...c, ...editCatalogInput } : c);
                await window.db.collection('settings').doc('global_catalogs').set({ list: newList }, { merge: true });
                setEditingCatalogId(null);
            };

            const handleDeleteCatalog = async (id) => {
                window.showConfirm("Weet je zeker dat je dit wilt verwijderen?", async () => {
                    const newList = catalogs.filter(c => c.id !== id);
                    await window.db.collection('settings').doc('global_catalogs').set({ list: newList }, { merge: true });
                    if (selectedItem?.id === id) setSelectedItem(null);
                });
            };

            const handleMoveCatalog = async (id, direction) => {
                const itemToMove = catalogs.find(c => c.id === id);
                if (!itemToMove) return;
                
                const type = itemToMove.type;
                const sameTypeItems = catalogs.filter(c => c.type === type);
                const index = sameTypeItems.findIndex(c => c.id === id);
                
                if (direction === 'up' && index > 0) {
                    const temp = sameTypeItems[index - 1];
                    sameTypeItems[index - 1] = sameTypeItems[index];
                    sameTypeItems[index] = temp;
                } else if (direction === 'down' && index < sameTypeItems.length - 1) {
                    const temp = sameTypeItems[index + 1];
                    sameTypeItems[index + 1] = sameTypeItems[index];
                    sameTypeItems[index] = temp;
                } else {
                    return;
                }
                
                let sameTypeIndex = 0;
                const newList = catalogs.map(c => {
                    if (c.type === type) return sameTypeItems[sameTypeIndex++];
                    return c;
                });
                
                await window.db.collection('settings').doc('global_catalogs').set({ list: newList }, { merge: true });
            };

            // --- PROMO LOGIC ---
            const handlePromoUpload = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                
                setUploading(true);
                try {
                    const uploadedUrls = [];
                    for (let i = 0; i < files.length; i++) {
                        const url = await window.uploadToImgBB(files[i]);
                        uploadedUrls.push(url);
                    }
                    
                    const newPromo = {
                        id: Date.now().toString(),
                        images: uploadedUrls,
                        title: `Weekpromotie ${promotions.length + 1}`,
                        createdAt: Date.now()
                    };
                    
                    const newList = [...promotions, newPromo];
                    await window.db.collection('settings').doc('global_promotions').set({ list: newList }, { merge: true });
                    window.showAlert("Weekpromotie(s) succesvol toegevoegd als één groep!");
                } catch (error) {
                    window.showAlert("Upload fout: " + error.message);
                } finally {
                    setUploading(false);
                    e.target.value = null; 
                }
            };

            const [promoLinks, setPromoLinks] = useState('');
            const handlePromoLinks = async () => {
                const urls = promoLinks.split(/[\s,]+/).map(u => u.trim()).filter(u => /^https?:\/\//i.test(u));
                if (urls.length === 0) return window.showAlert("Plak minstens één geldige link (beginnend met https://).");
                const newPromo = { id: Date.now().toString(), images: urls, title: `Weekpromotie ${promotions.length + 1}`, createdAt: Date.now() };
                try {
                    await window.db.collection('settings').doc('global_promotions').set({ list: [...promotions, newPromo] }, { merge: true });
                    setPromoLinks('');
                    window.showAlert(urls.length === 1 ? "Weekpromotie toegevoegd!" : `Weekpromotie met ${urls.length} afbeeldingen toegevoegd!`);
                } catch (err) { window.showAlert("Opslaan mislukt: " + err.message); }
            };

            const handleSavePromoTitle = async (id) => {
                const newList = promotions.map(p => p.id === id ? { ...p, title: editPromoTitle } : p);
                await window.db.collection('settings').doc('global_promotions').set({ list: newList }, { merge: true });
                setEditingPromoId(null);
                setEditPromoTitle('');
            };

            const handleDeletePromo = (id) => {
                window.showConfirm("Weet je zeker dat je deze promotiegroep wilt verwijderen?", async () => {
                    const newList = promotions.filter(p => p.id !== id);
                    await window.db.collection('settings').doc('global_promotions').set({ list: newList }, { merge: true });
                });
            };

            const handleMovePromo = async (index, direction) => {
                if (direction === 'up' && index === 0) return;
                if (direction === 'down' && index === promotions.length - 1) return;
                
                const newList = [...promotions];
                if (direction === 'up') {
                    const temp = newList[index - 1];
                    newList[index - 1] = newList[index];
                    newList[index] = temp;
                } else {
                    const temp = newList[index + 1];
                    newList[index + 1] = newList[index];
                    newList[index] = temp;
                }
                await window.db.collection('settings').doc('global_promotions').set({ list: newList }, { merge: true });
            };

            const types = [...new Set(catalogs.map(c => c.type))];
            const [selectedPromoId, setSelectedPromoId] = useState('');
            const selectedPromoIndex = promotions.findIndex(p => p.id === selectedPromoId);
            const selectedPromo = selectedPromoIndex >= 0 ? promotions[selectedPromoIndex] : null;
            const typeLabel = (t) => ({ Catalogus: 'Catalogen', Leaflet: 'Leaflets', Ander: 'Andere' }[t] || t);
            const selectCls = "w-full sm:w-72 p-3 rounded-xl border font-bold outline-none focus:ring-2 cursor-pointer shadow-sm";

            const renderCatalogCategory = (categoryType, categoryTitle) => {
                const categoryItems = catalogs.filter(c => c.type === categoryType);
                if (categoryItems.length === 0) return <p className="text-sm text-slate-400 text-center py-4">Nog geen {categoryTitle.toLowerCase()}. Tik op "+ Toevoegen".</p>;

                return (
                    <div>
                        <div className="flex flex-col gap-2">
                            {categoryItems.map((c, index) => (
                                <div key={c.id} className="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 transition-all">
                                    {editingCatalogId === c.id ? (
                                        <div className="flex flex-col sm:flex-row gap-2 w-full animate-in">
                                            <select value={editCatalogInput.type} onChange={e=>setEditCatalogInput({...editCatalogInput, type:e.target.value})} className="p-2 rounded-lg border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 text-sm w-full sm:w-1/4">
                                                <option value="Catalogus">Catalogus</option>
                                                <option value="Leaflet">Leaflet</option>
                                                <option value="Ander">Ander</option>
                                            </select>
                                            <input value={editCatalogInput.title} onChange={e=>setEditCatalogInput({...editCatalogInput, title:e.target.value})} placeholder="Titel" className="p-2 rounded-lg border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 text-sm w-full sm:w-1/4"/>
                                            <input value={editCatalogInput.url} onChange={e=>setEditCatalogInput({...editCatalogInput, url:e.target.value})} placeholder="Link (URL)" className="p-2 rounded-lg border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 text-sm flex-grow"/>
                                            
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={() => handleSaveCatalogEdit(c.id)} className="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-600 hover:bg-emerald-200 flex justify-center items-center shadow-sm"><Icons.CheckCircle className="text-sm"/></button>
                                                <button onClick={() => setEditingCatalogId(null)} className="w-9 h-9 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-500 hover:bg-slate-300 dark:hover:bg-slate-600 flex justify-center items-center shadow-sm"><Icons.X className="text-sm"/></button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex justify-between items-center w-full">
                                            <div className="min-w-0 pr-4">
                                                <span className="bg-slate-200 dark:bg-slate-700 text-[10px] px-2 py-1 rounded font-bold mr-2">{c.type}</span>
                                                <span className="text-sm font-medium dark:text-white truncate">{c.title}</span>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                <button onClick={() => { setEditingCatalogId(c.id); setEditCatalogInput(c); }} className="w-8 h-8 rounded-lg bg-white dark:bg-slate-700 text-slate-400 hover:text-amber-500 flex justify-center items-center shadow-sm mr-1"><Icons.Edit className="text-xs"/></button>
                                                <button onClick={() => handleMoveCatalog(c.id, 'up')} disabled={index === 0} className={`w-8 h-8 rounded-lg flex justify-center items-center shadow-sm ${index === 0 ? 'bg-slate-100 dark:bg-slate-700 text-slate-300 dark:text-slate-600 cursor-not-allowed' : 'bg-white dark:bg-slate-700 text-slate-400 hover:text-emerald-500'}`}><Icons.ChevronUp className="text-xs"/></button>
                                                <button onClick={() => handleMoveCatalog(c.id, 'down')} disabled={index === categoryItems.length - 1} className={`w-8 h-8 rounded-lg flex justify-center items-center shadow-sm ${index === categoryItems.length - 1 ? 'bg-slate-100 dark:bg-slate-700 text-slate-300 dark:text-slate-600 cursor-not-allowed' : 'bg-white dark:bg-slate-700 text-slate-400 hover:text-emerald-500'}`}><Icons.ChevronDown className="text-xs"/></button>
                                                <button onClick={() => handleDeleteCatalog(c.id)} className="w-8 h-8 ml-2 rounded-lg bg-white dark:bg-slate-700 text-slate-400 hover:text-red-500 flex justify-center items-center shadow-sm"><Icons.Trash className="text-xs"/></button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-6">
                    {/* ADMIN BEHEER: knoppen, met het beheer achter elke knop */}
                    {isAdmin && section === 'admin' && (
                        <div className="bg-white dark:bg-slate-900 p-4 sm:p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-glass dark:shadow-glass-dark">
                            <h3 className="font-bold text-base text-slate-800 dark:text-slate-200 flex items-center gap-2 mb-3"><Icons.BookReader className="text-emerald-500"/> Catalogen, leaflets & weekpromoties</h3>
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
                                {ADMIN_PANELS.map(pnl => {
                                    const active = adminPanel === pnl.id;
                                    const count = pnl.id === 'promo' ? promotions.length : catalogs.filter(c => c.type === pnl.id).length;
                                    return (
                                        <button key={pnl.id} onClick={() => openPanel(pnl.id)} className={`flex items-center gap-3 p-3 sm:p-4 rounded-2xl border text-left transition-all ${active ? `${pnl.activeCls} shadow-md` : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}`}>
                                            <span className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${active ? 'bg-white/25 text-white' : pnl.iconCls}`}><i className={`fa-solid ${pnl.icon}`}></i></span>
                                            <span className="min-w-0">
                                                <span className={`block font-bold text-sm leading-tight ${active ? 'text-white' : 'text-slate-800 dark:text-slate-100'}`}>{pnl.label}</span>
                                                <span className={`block text-xs mt-0.5 ${active ? 'text-white/80' : 'text-slate-400'}`}>{count} {count === 1 ? 'item' : 'items'}</span>
                                            </span>
                                            <i className={`hidden sm:inline fa-solid fa-chevron-down ml-auto text-xs transition-transform ${active ? 'rotate-180 text-white' : 'text-slate-400'}`}></i>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* --- CATALOGEN / LEAFLETS / ANDERE --- */}
                            {currentCatPanel && (
                                <div className="mt-5 pt-5 border-t border-slate-100 dark:border-slate-800 animate-in">
                                    <div className="flex justify-between items-center gap-3 mb-4">
                                        <h4 className="font-bold text-lg text-slate-800 dark:text-slate-200">{currentCatPanel.label}</h4>
                                        <button onClick={() => { setIsAdding(!isAdding); setInput({ title: '', type: currentCatPanel.id, url: '' }); }} className="shrink-0 whitespace-nowrap px-4 py-2 rounded-xl text-white font-bold transition-colors shadow-md bg-gradient-to-r from-emerald-500 to-teal-500 hover:-translate-y-0.5">
                                            {isAdding ? 'Annuleren' : '+ Toevoegen'}
                                        </button>
                                    </div>

                                    {isAdding && (
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 animate-in space-y-4 mb-5">
                                            <div className="grid grid-cols-1 gap-4">
                                                <div>
                                                    <label className="text-[11px] font-bold text-slate-500 uppercase block mb-1">Titel (bijv. Voorjaar {new Date().getFullYear() + 1})</label>
                                                    <input value={input.title} onChange={e=>setInput({...input, title:e.target.value})} placeholder="Titel..." className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/30"/>
                                                </div>
                                                <div>
                                                    <label className="text-[11px] font-bold text-slate-500 uppercase block mb-1">Embed Link (URL)</label>
                                                    <input value={input.url} onChange={e=>setInput({...input, url:e.target.value.trim()})} placeholder="https://heyzine.com/flip-book/..." className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/30"/>
                                                </div>
                                            </div>
                                            <button onClick={handleSaveCatalog} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md transition-all">Opslaan</button>
                                        </div>
                                    )}

                                    {renderCatalogCategory(currentCatPanel.id, currentCatPanel.label)}
                                </div>
                            )}

                            {/* --- WEEKPROMOTIES --- */}
                            {adminPanel === 'promo' && (
                            <div className="mt-5 pt-5 border-t border-slate-100 dark:border-slate-800 animate-in">
                            <div className="flex justify-between items-center gap-3 mb-4">
                                <h4 className="font-bold text-lg text-slate-800 dark:text-slate-200">Weekpromoties</h4>
                                <label className="shrink-0 whitespace-nowrap px-4 py-2 rounded-xl text-white font-bold transition-colors shadow-md bg-gradient-to-r from-orange-500 to-rose-500 hover:-translate-y-0.5 cursor-pointer flex items-center gap-2">
                                    <input type="file" multiple className="hidden" accept="image/*" onChange={handlePromoUpload} disabled={uploading}/>
                                    {uploading ? <><Icons.Loader className="animate-spin"/> Uploaden...</> : '+ Foto\'s uploaden'}
                                </label>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-2 mb-2">
                                <textarea value={promoLinks} onChange={e=>setPromoLinks(e.target.value)} rows={1} placeholder="Of plak afbeeldingslink(s), één per regel" className="flex-grow p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-orange-500/30 text-sm resize-y min-h-[46px]"/>
                                <button onClick={handlePromoLinks} className="shrink-0 whitespace-nowrap px-4 py-2.5 rounded-xl font-bold text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20 border border-orange-200 dark:border-orange-800 hover:bg-orange-100 transition-colors">+ Via link</button>
                            </div>

                            {promotions.length > 0 && (
                                <div className="mt-4">
                                    <div className="flex flex-col gap-2">
                                        {promotions.map((p, index) => {
                                            const imagesList = p.images || (p.image ? [p.image] : []);
                                            return (
                                                <div key={p.id} className="flex flex-col sm:flex-row justify-between sm:items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 gap-3">
                                                    
                                                    {editingPromoId === p.id ? (
                                                        <div className="flex flex-col gap-2 w-full animate-in">
                                                            <div className="flex items-center gap-2">
                                                                <input value={editPromoTitle} onChange={e=>setEditPromoTitle(e.target.value)} placeholder="Naam van promotiegroep" className="p-2 rounded-lg border border-orange-300 dark:border-orange-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-orange-500/50 text-sm flex-grow"/>
                                                                <button onClick={() => handleSavePromoTitle(p.id)} className="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-600 hover:bg-emerald-200 flex justify-center items-center shadow-sm shrink-0"><Icons.CheckCircle className="text-sm"/></button>
                                                                <button onClick={() => setEditingPromoId(null)} className="w-9 h-9 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-500 hover:bg-slate-300 dark:hover:bg-slate-600 flex justify-center items-center shadow-sm shrink-0"><Icons.X className="text-sm"/></button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <>
                                                            <div className="flex items-center gap-3 min-w-0 pr-4">
                                                                <div className="flex -space-x-3 overflow-hidden shrink-0">
                                                                    {imagesList.slice(0, 3).map((imgUrl, i) => (
                                                                        <img key={i} src={imgUrl} className="w-12 h-12 rounded-lg object-cover border-2 border-white dark:border-slate-800 cursor-pointer shadow-sm" onClick={() => setPreviewImage(imgUrl)}/>
                                                                    ))}
                                                                </div>
                                                                <div className="min-w-0">
                                                                    <span className="text-sm font-bold text-slate-700 dark:text-slate-300 truncate block">{p.title || `Weekpromotie ${index + 1}`}</span>
                                                                    <span className="text-[10px] text-slate-400">{imagesList.length} foto('s) in deze groep</span>
                                                                </div>
                                                            </div>
                                                            
                                                            <div className="flex items-center gap-1 shrink-0 justify-end mt-2 sm:mt-0">
                                                                <button onClick={() => { setEditingPromoId(p.id); setEditPromoTitle(p.title || `Weekpromotie ${index + 1}`); }} className="w-8 h-8 mr-1 rounded-lg bg-white dark:bg-slate-700 text-slate-400 hover:text-amber-500 flex justify-center items-center shadow-sm" title="Naam wijzigen"><Icons.Edit className="text-xs"/></button>

                        let endLabel = 'Onbekend';

                        if (isActivity) {
                            const startIdx = availableWeeks.findIndex(w => w.id === goal.startWeekId);
                            const endIdx = availableWeeks.findIndex(w => w.id === goal.endWeekId);
                            const validRange = startIdx !== -1 && endIdx !== -1;

                            if (validRange) {
                                availableWeeks.forEach(aw => {
                                    if (aw.absoluteIndex >= startIdx && aw.absoluteIndex <= endIdx) {
                                        const d = monthlyData[aw.month] || {};
                                        const weekVal = Number(d[`week${aw.week}`]) || 0;
                                        const isActive = weekVal >= 1;
                                        activityWeeks.push({
                                            id: aw.id, month: aw.month, week: aw.week, label: aw.label, active: isActive
                                        });
                                        if (isActive) currentProgress += 1;
                                    }
                                });
                                startLabel = availableWeeks[startIdx].label.split('(')[0].trim();
                                endLabel = availableWeeks[endIdx].label.split('(')[0].trim();
                            }
                        } else {
                            const goalStart = new Date(goal.startDate);
                            const goalEnd = new Date(goal.endDate);
                            startLabel = goalStart.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' });
                            endLabel = goalEnd.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' });

                            availableWeeks.forEach(aw => {
                                if (aw.isCalendar) {
                                    const d = monthlyData[aw.month] || {};
                                    const weekVal = Number(d[`week${aw.week}`]) || 0;
                                    
                                    if (weekVal > 0) {
                                        const match = aw.label.match(/\((\d+)\s([a-z]+)\s-\s(\d+)\s([a-z]+)\)/);
                                        if (match) {
                                            const mNames = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
                                            const wStartDay = parseInt(match[1]);
                                            const wStartMonth = mNames.indexOf(match[2]);
                                            const wEndDay = parseInt(match[3]);
                                            const wEndMonth = mNames.indexOf(match[4]);
                                            
                                            let wStartYear = selectedYear;
                                            let wEndYear = selectedYear;
                                            if (wStartMonth === 11 && wEndMonth === 0) { wEndYear = selectedYear + 1; }
                                            if (wStartMonth === 0 && wEndMonth === 11) { wStartYear = selectedYear - 1; }
                                            
                                            const weekStart = new Date(wStartYear, wStartMonth, wStartDay);
                                            const weekEnd = new Date(wEndYear, wEndMonth, wEndDay);
                                            
                                            const overlapStart = new Date(Math.max(weekStart, goalStart));
                                            const overlapEnd = new Date(Math.min(weekEnd, goalEnd));
                                            
                                            if (overlapStart <= overlapEnd) {
                                                const overlapDays = Math.round((overlapEnd - overlapStart) / (1000 * 60 * 60 * 24)) + 1;
                                                const weekDays = 7;
                                                currentProgress += weekVal * (overlapDays / weekDays);
                                            }
                                        }
                                    }
                                } else {
                                    const monthIndex = MONTHS.indexOf(aw.month);
                                    if (monthIndex !== -1) {
                                        const monthStart = new Date(selectedYear, monthIndex, 1);
                                        const monthEnd = new Date(selectedYear, monthIndex + 1, 0);
                                        if (monthStart <= goalEnd && monthEnd >= goalStart) {
                                            const d = monthlyData[aw.month] || {};
                                            currentProgress += Number(d[`week${aw.week}`]) || 0;
                                        }
                                    }
                                }
                            });
                        }

                        const progressPercent = goal.amount > 0 ? Math.min(100, (currentProgress / goal.amount) * 100) : 0;
                        const remaining = Math.max(0, goal.amount - currentProgress);
                        
                        return (
                            <div key={goal.id} className={`bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-indigo-900/50 shadow-glass dark:shadow-glass-dark p-5 relative overflow-hidden flex flex-col group transition-all hover:shadow-[0_8px_30px_rgba(79,70,229,0.15)] ${goal.colSpan === 2 ? 'md:col-span-2' : ''}`}>
                                <div className="flex justify-between items-start mb-4 relative z-10">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-2xl bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shrink-0 border border-indigo-200 dark:border-indigo-800">
                                            {isActivity ? <Icons.Calendar className="w-4 h-4"/> : <Icons.Target className="w-4 h-4"/>}
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-800 dark:text-slate-100 text-lg leading-tight">{goal.name}</h4>
                                            <div className="text-[11px] text-slate-500 font-medium mt-0.5">
                                                {startLabel} t/m {endLabel}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-indigo-600 dark:text-indigo-400 font-black text-xl leading-none">
                                            {isActivity ? `${currentProgress} wkn` : formatCurrency(currentProgress)}
                                        </div>
                                        <div className="text-[11px] text-slate-400 mt-1 font-bold">
                                            / {isActivity ? `${goal.amount} wkn` : formatCurrency(goal.amount)}
                                        </div>
                                    </div>
                                </div>

                                <div className="h-3 w-full bg-slate-100 dark:bg-slate-800/80 rounded-full overflow-hidden shadow-inner border border-slate-200/50 dark:border-slate-700 relative z-10">
                                    <div className="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 shadow-[0_0_10px_rgba(79,70,229,0.5)] transition-all duration-1000" style={{width: `${progressPercent}%`}}></div>
                                </div>
                                
                                <div className="mt-3 text-xs font-medium text-center text-slate-500 dark:text-slate-400 mb-2 relative z-10">
                                    {remaining > 0 ? (
                                        <span>Nog <strong className="text-indigo-600 dark:text-indigo-400">{isActivity ? `${remaining} weken` : formatCurrency(remaining)}</strong> te gaan</span>
                                    ) : (
                                        <span className="text-emerald-500 font-bold uppercase tracking-widest"><Icons.CheckCircle className="w-3"/> Doel Behaald!</span>
                                    )}
                                </div>
                                
                                {isActivity && activityWeeks.length > 0 && (
                                    <div className="mt-auto pt-3 border-t border-slate-100 dark:border-slate-800 relative z-10">
                                        <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scroll pr-1">
                                            {activityWeeks.map(aw => {
                                                const wMatch = aw.label.match(/^W(\d+)/);
                                                const shortLabel = wMatch ? wMatch[0] : `${aw.month.substring(0,3)} W${aw.week}`;

                                                return (
                                                    <div 
                                                        key={aw.id} 
                                                        title={aw.label}
                                                        className={`flex items-center gap-1 text-[10px] px-2 py-1 rounded-lg border font-bold cursor-help transition-all ${aw.active ? 'bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/40 dark:text-emerald-400 dark:border-emerald-700 shadow-sm' : 'bg-slate-50 text-slate-400 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 dark:text-slate-500'}`}
                                                    >
                                                        {aw.active ? <Icons.Check className="w-2.5 h-2.5"/> : <Icons.X className="w-2.5 h-2.5 opacity-50"/>}
                                                        {shortLabel}
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const CustomGoalsModal = ({ isOpen, onClose, customGoals, updateCustomGoals, formatCurrency, availableWeeks, inline = false, title = 'Mijn doelen beheren', openFormSignal = 0, hideAddButton = false }) => {
            const [tab, setTab] = useState('active'); 
            const [showForm, setShowForm] = useState(false);
            useEffect(() => { if (openFormSignal) { setShowForm(true); setEditingId(null); } }, [openFormSignal]);
            const [editingId, setEditingId] = useState(null);
            const [input, setInput] = useState({ name: '', amount: '', startWeekId: '', endWeekId: '', startDate: '', endDate: '', type: 'sales', colSpan: 1 });

            if (!isOpen) return null;

            const handleSave = () => {
                let finalAmount = Number(input.amount);
                let finalEndDate = new Date().toISOString();
                
                if (input.type === 'activity') {
                    if (input.startWeekId && input.endWeekId) {
                        const s = availableWeeks.findIndex(w=>w.id===input.startWeekId);
                        const e = availableWeeks.findIndex(w=>w.id===input.endWeekId);
                        if (s !== -1 && e !== -1 && e >= s) {
                            finalAmount = (e - s) + 1; 
                            const endWeek = availableWeeks.find(w => w.id === input.endWeekId);
                            if (endWeek) finalEndDate = endWeek.endDate;
                        } else {
                            return window.showAlert("Zorg ervoor dat de eindweek na of op de startweek valt.");
                        }
                    } else {
                        return window.showAlert("Selecteer een start- en eindweek.");
                    }
                } else {
                    if (!input.startDate || !input.endDate) {
                        return window.showAlert("Selecteer een start- en einddatum voor dit omzetdoel.");
                    }
                    if (new Date(input.startDate) > new Date(input.endDate)) {
                        return window.showAlert("De einddatum moet na de startdatum liggen.");
                    }
                    finalEndDate = new Date(input.endDate).toISOString();
                }

                if(!input.name || (!finalAmount && finalAmount !== 0)) {
                    return window.showAlert("Vul a.u.b. de naam en het doel in!");
                }

                if (editingId) {
                    const updatedGoals = customGoals.map(g => g.id === editingId ? {
                        ...g, name: input.name, amount: finalAmount, startWeekId: input.type === 'activity' ? input.startWeekId : null,
                        endWeekId: input.type === 'activity' ? input.endWeekId : null, startDate: input.type === 'sales' ? new Date(input.startDate).toISOString() : null,
                        endDate: finalEndDate, type: input.type || 'sales', colSpan: Number(input.colSpan) || 1
                    } : g);
                    updateCustomGoals(updatedGoals);
                    setEditingId(null);
                } else {
                    const newGoal = { 
                        id: Date.now().toString(), name: input.name, amount: finalAmount, startWeekId: input.type === 'activity' ? input.startWeekId : null,
                        endWeekId: input.type === 'activity' ? input.endWeekId : null, startDate: input.type === 'sales' ? new Date(input.startDate).toISOString() : null,
                        endDate: finalEndDate, type: input.type || 'sales', createdAt: Date.now(), colSpan: Number(input.colSpan) || 1
                    };
                    updateCustomGoals([...(customGoals || []), newGoal]);
                }
                setInput({ name: '', amount: '', startWeekId: '', endWeekId: '', startDate: '', endDate: '', type: 'sales', colSpan: 1 });
                setTab('active');
                setShowForm(false);
            };

            const handleEdit = (goal) => {
                let formattedStart = '';
                let formattedEnd = '';
                if (goal.type === 'sales') {
                     formattedStart = goal.startDate ? new Date(goal.startDate).toISOString().split('T')[0] : '';
                     formattedEnd = goal.endDate ? new Date(goal.endDate).toISOString().split('T')[0] : '';
                }
                setInput({ name: goal.name, amount: goal.amount, startWeekId: goal.startWeekId || '', endWeekId: goal.endWeekId || '', startDate: formattedStart, endDate: formattedEnd, type: goal.type || 'sales', colSpan: goal.colSpan || 1 });
                setEditingId(goal.id);
                setTab('active');
            };

            const cancelEdit = () => {
                setEditingId(null);
                setShowForm(false);
                setInput({ name: '', amount: '', startWeekId: '', endWeekId: '', startDate: '', endDate: '', type: 'sales', colSpan: 1 });
            };

            const handleDelete = (id) => {
                window.showConfirm("Weet je zeker dat je dit doel wilt verwijderen?", () => {
                    updateCustomGoals(customGoals.filter(g => g.id !== id));
                });
            };

            const today = new Date();
            today.setHours(0,0,0,0);

            const activeGoalsList = (customGoals || []).filter(g => g.endDate ? new Date(g.endDate) >= today : true).sort((a,b) => new Date(a.endDate) - new Date(b.endDate));
            const historyGoalsList = (customGoals || []).filter(g => g.endDate ? new Date(g.endDate) < today : false).sort((a,b) => new Date(b.endDate) - new Date(a.endDate));

            return (
                <div className={inline ? '' : "fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm"} onClick={inline ? undefined : onClose}>
                    <div className={`bg-white dark:bg-slate-900 rounded-3xl shadow-glass border w-full overflow-hidden flex flex-col ${inline ? 'border-slate-200/80 dark:border-slate-800' : 'border-white/50 dark:border-slate-700 max-w-lg modal-content max-h-[90vh]'}`} onClick={e=>e.stopPropagation()}>
                        
                        <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <Icons.Target className="text-indigo-500"/> {title}
                            </h3>
                            {!inline && <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"><Icons.X/></button>}
                        </div>

                        <div className={`p-5 space-y-6 ${inline ? '' : 'overflow-y-auto custom-scroll'}`}>
                            {!showForm && !editingId && !hideAddButton && (
                                <button onClick={() => setShowForm(true)} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 text-white font-bold shadow-lg shadow-indigo-500/30 hover:-translate-y-0.5 transition-all"><Icons.Plus/> Nieuw doel maken</button>
                            )}
                            {(showForm || editingId) && <div className="bg-indigo-50/50 dark:bg-indigo-900/20 p-5 rounded-2xl border border-indigo-100 dark:border-indigo-800/50 animate-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="font-bold text-indigo-800 dark:text-indigo-300 text-sm flex items-center gap-2">
                                        {editingId ? <Icons.Edit className="w-3"/> : <Icons.Plus className="w-3"/>} 
                                        {editingId ? 'Doel Wijzigen' : 'Nieuw Doel Instellen'}
                                    </h4>
                                    <button onClick={cancelEdit} className="text-xs font-bold text-indigo-500 hover:text-indigo-700">Annuleren</button>
                                </div>

                                <div className="flex gap-2 mb-4 p-1 bg-slate-100 dark:bg-slate-800/50 rounded-xl">
                                    <button 
                                        onClick={() => setInput({...input, type: 'sales'})} 
                                        className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.type !== 'activity' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                    >
                                        💶 Omzet
                                    </button>
                                    <button 
                                        onClick={() => setInput({...input, type: 'activity'})} 
                                        className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.type === 'activity' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                    >
                                        📅 Activiteit
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                    <div className="sm:col-span-2">
                                        <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Naam van doel (bijv. Zomertrip)</label>
                                        <input type="text" value={input.name} onChange={e=>setInput({...input, name:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"/>
                                    </div>
                                    
                                    {input.type === 'activity' ? (
                                        <React.Fragment>
                                            <div className="sm:col-span-2">
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Doel (aantal actieve weken)</label>
                                                <div className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-indigo-50/50 dark:bg-slate-800/50 text-indigo-800 dark:text-indigo-300 font-bold">
                                                    {input.startWeekId && input.endWeekId ? (
                                                        (() => {
                                                            const s = availableWeeks.findIndex(w=>w.id===input.startWeekId);
                                                            const e = availableWeeks.findIndex(w=>w.id===input.endWeekId);
                                                            if(s !== -1 && e !== -1 && e >= s) return `${(e - s) + 1} weken (automatisch berekend)`;
                                                            return 'Let op: Eindweek moet na of op startweek vallen';
                                                        })()
                                                    ) : 'Kies eerst een start- en eindweek...'}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Start Week</label>
                                                <select value={input.startWeekId} onChange={e=>setInput({...input, startWeekId:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all">
                                                    <option value="">Kies week...</option>
                                                    {availableWeeks.map(w => <option key={w.id} value={w.id}>{w.label}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Eind Week</label>
                                                <select value={input.endWeekId} onChange={e=>setInput({...input, endWeekId:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all">
                                                    <option value="">Kies week...</option>
                                                    {availableWeeks.map(w => <option key={w.id} value={w.id}>{w.label}</option>)}
                                                </select>
                                            </div>
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <div className="sm:col-span-2">
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Doelbedrag (€)</label>
                                                <input type="number" value={input.amount} onChange={e=>setInput({...input, amount:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" placeholder="0"/>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Startdatum</label>
                                                <input type="date" value={input.startDate} onChange={e=>setInput({...input, startDate:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"/>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Einddatum</label>
                                                <input type="date" value={input.endDate} onChange={e=>setInput({...input, endDate:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"/>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    <div className="sm:col-span-2 mt-1">
                                        <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Weergave Grootte (Op Dashboard)</label>
                                        <div className="flex gap-2 p-1 bg-slate-100 dark:bg-slate-800/50 rounded-xl">
                                            <button 
                                                onClick={() => setInput({...input, colSpan: 1})} 
                                                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.colSpan === 1 ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                            >
                                                1 Kolom (Compact)
                                            </button>
                                            <button 
                                                onClick={() => setInput({...input, colSpan: 2})} 
                                                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.colSpan === 2 ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                            >
                                                2 Kolommen (Breed)
                                            </button>
                                        </div>
                                    </div>

                                </div>
                                <button onClick={handleSave} className="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all hover:-translate-y-0.5">
                                    {editingId ? 'Wijzigingen Opslaan' : 'Doel Toevoegen'}
                                </button>
                            </div>}

                            <div>
                                <div className="flex border-b border-slate-200 dark:border-slate-800 mb-4">
                                    <button onClick={()=>setTab('active')} className={`pb-3 px-5 text-sm font-bold transition-all ${tab==='active' ? 'border-b-2 border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>Actief ({activeGoalsList.length})</button>
                                    <button onClick={()=>setTab('history')} className={`pb-3 px-5 text-sm font-bold transition-all ${tab==='history' ? 'border-b-2 border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>Geschiedenis ({historyGoalsList.length})</button>
                                </div>

                                <div className="space-y-3">
                                    {tab === 'active' && activeGoalsList.length === 0 && <p className="text-center text-slate-400 text-sm py-6 italic border-2 border-dashed dark:border-slate-700 rounded-xl">Je hebt momenteel geen actieve doelen.</p>}
                                    {tab === 'history' && historyGoalsList.length === 0 && <p className="text-center text-slate-400 text-sm py-6 italic border-2 border-dashed dark:border-slate-700 rounded-xl">Geen oude doelen gevonden.</p>}

                                    {(tab === 'active' ? activeGoalsList : historyGoalsList).map(goal => {
                                        let startLabel = '';
                                        let endLabel = '';

                                        if (goal.type === 'activity') {
                                            startLabel = availableWeeks.find(w => w.id === goal.startWeekId)?.label.split('(')[0].trim() || 'Onbekend';
                                            endLabel = availableWeeks.find(w => w.id === goal.endWeekId)?.label.split('(')[0].trim() || 'Onbekend';
                                        } else {
                                            startLabel = goal.startDate ? new Date(goal.startDate).toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' }) : '';
                                            endLabel = goal.endDate ? new Date(goal.endDate).toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' }) : '';
                                        }
                                        
                                        return (
                                            <div key={goal.id} className={`p-4 rounded-2xl border flex items-center justify-between transition-all ${tab === 'active' ? 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 shadow-sm' : 'bg-slate-50 dark:bg-slate-800/50 border-slate-100 dark:border-slate-700/50 opacity-80'}`}>
                                                <div>

        const StockTab = ({ targetUid, user, showCsvImport = true }) => {

            const handleSaveItem = async () => {

                const itemData = { ...rest, name: String(newItem.name).trim(), price: Number(newItem.price)||0, quantity: Number(newItem.quantity)||0, vinted: Number(newItem.vinted)||0, updatedAt: Date.now() };

            const handleImportCSV = (e) => {
