                const linksArray = importLinks.split('\n').map(l => l.trim()).filter(l => l);

                Papa.parse(file, {
                    header: false,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        const data = results.data;
                        if (!data || data.length === 0) {
                            setImporting(false);
                            return window.showAlert("Het CSV-bestand lijkt leeg te zijn of kon niet worden gelezen.");
                        }

                        let addedCount = 0;
                        let updatedCount = 0;
                        let skippedCount = 0;

                        let newCats = [...categories];
                        let newLocs = [...locations];
                        let catsChanged = false;
                        let locsChanged = false;

                        const addPromises = [];
                        const updatePromises = [];

                        if (data[0] && data[0][0] && String(data[0][0]).toLowerCase().includes('naam')) {
                            data.shift(); 
                        }

                        for (const row of data) {
                            let itemName = row[0] ? String(row[0]).trim() : '';
                            if (!itemName) continue; 
                            
                            let rawQuantity = row[2];
                            let location = row[3] ? String(row[3]).trim() : '';
                            let category = row[5] ? String(row[5]).trim() : '';
                            let imageVal = row[6] ? String(row[6]).trim() : '';
                            let statusVal = row[9] ? String(row[9]).trim() : '';
                            let rawVinted = row[10];
                            let rawPrice = row[11];

                            const parsedQty = parseInt(rawQuantity);
                            const finalQuantity = isNaN(parsedQty) ? 1 : parsedQty;
                            const price = rawPrice ? parseFloat(String(rawPrice).replace('€', '').replace(',', '.').trim()) || 0 : 0;
                            const vinted = parseInt(rawVinted) || 0;
                            
                            const finalCategory = category;
                            const finalLocation = location;
                            const status = statusVal.toLowerCase().includes('gebruik') ? 'gebruik' : 'zolder';

                            let finalImageUrl = '';
                            if (imageVal && imageVal !== 'null' && imageVal !== 'undefined') {
                                if (imageVal.includes(',')) imageVal = imageVal.split(',')[0].trim();
                                
                                const cleanStringForMatch = (str) => {
                                    if(!str) return '';
                                    let filename = str.split('/').pop().split('\\').pop(); 
                                    filename = filename.substring(0, filename.lastIndexOf('.')) || filename; 
                                    return filename.toLowerCase().replace(/[^a-z0-9]/g, '');
                                };
                                
                                const cleanCsvImageName = cleanStringForMatch(imageVal);
                                const matchedLink = linksArray.find(link => {
                                    const cleanLinkName = cleanStringForMatch(link);
                                    return cleanLinkName !== '' && cleanLinkName === cleanCsvImageName;
                                });

                                if (matchedLink) {
                                    finalImageUrl = matchedLink;
                                } else if (imageVal.startsWith('http://') || imageVal.startsWith('https://') || imageVal.startsWith('data:image')) {
                                    finalImageUrl = imageVal;
                                } else {
                                    finalImageUrl = imageVal;
                                }
                            }

                            const nameMatches = items.filter(item => (item.name||'').toLowerCase() === itemName.toLowerCase());
                            
                            if (nameMatches.length > 0) {
                                let bestMatch = nameMatches.find(item => 
                                    item.status === status && 
                                    (item.category || '') === finalCategory && 
                                    (item.location || '') === finalLocation
                                );

                                if (!bestMatch) bestMatch = nameMatches.find(item => item.status === status);
                                if (!bestMatch && nameMatches.length === 1) bestMatch = nameMatches[0];

                                if (bestMatch) {
                                    let hasChanges = false;
                                    const updates = { updatedAt: Date.now() };

                                    if (bestMatch.quantity !== finalQuantity) { updates.quantity = finalQuantity; hasChanges = true; }
                                    if ((bestMatch.location || '') !== finalLocation) { updates.location = finalLocation; hasChanges = true; }
                                    if ((bestMatch.category || '') !== finalCategory) { updates.category = finalCategory; hasChanges = true; }
                                    if (bestMatch.price !== price && price > 0) { updates.price = price; hasChanges = true; }
                                    
                                    const isNewLink = finalImageUrl.startsWith('http');
                                    const currentImageIsNoLink = !bestMatch.image || !bestMatch.image.startsWith('http');
                                    
                                    if (isNewLink && (currentImageIsNoLink || bestMatch.image !== finalImageUrl)) {
                                        updates.image = finalImageUrl;
                                        hasChanges = true;
                                    }

                                    if (hasChanges) {
                                        updatePromises.push(window.db.collection('users').doc(targetUid).collection('stock').doc(bestMatch.id).update(updates));
                                        Object.assign(bestMatch, updates); 
                                        updatedCount++;
                                    } else {
                                        skippedCount++;
                                    }

                                    for (const otherItem of nameMatches) {
                                        if (otherItem.id !== bestMatch.id && isNewLink) {
                                            const otherImageIsNoLink = !otherItem.image || !otherItem.image.startsWith('http');
                                            if (otherImageIsNoLink || otherItem.image !== finalImageUrl) {
                                                updatePromises.push(window.db.collection('users').doc(targetUid).collection('stock').doc(otherItem.id).update({
                                                    image: finalImageUrl, updatedAt: Date.now()
                                                }));
                                                otherItem.image = finalImageUrl;
                                            }
                                        }
                                    }
                                    continue; 
                                }
                            }

                            if (finalCategory && !newCats.find(c => c.name.toLowerCase() === finalCategory.toLowerCase())) {
                                newCats.push({ name: finalCategory, color: CATEGORY_COLORS[16] });
                                catsChanged = true;
                            }
                            if (finalLocation && !newLocs.find(l => l.name.toLowerCase() === finalLocation.toLowerCase())) {
                                newLocs.push({ name: finalLocation, color: CATEGORY_COLORS[16] });
                                locsChanged = true;
                            }

                            const newItemData = {
                                name: itemName,
                                category: finalCategory,
                                location: finalLocation,
                                price: price,
                                quantity: finalQuantity,
                                vinted: vinted,
                                status: status,
                                image: finalImageUrl,
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            };

                            addPromises.push(window.db.collection('users').doc(targetUid).collection('stock').add(newItemData));
                            addedCount++;
                        }

                        try {
                            await Promise.all([...addPromises, ...updatePromises]);
                            if (catsChanged) await window.db.collection('users').doc(targetUid).collection('settings').doc('categories').set({ list: newCats }, { merge: true });
                            if (locsChanged) await window.db.collection('users').doc(targetUid).collection('settings').doc('locations').set({ list: newLocs }, { merge: true });
                            window.logActivity(targetUid, 'voorraad', `CSV-import: ${addedCount} nieuw, ${updatedCount} bijgewerkt`);
                            window.showAlert(`Import succesvol afgerond!\n\n🆕 ${addedCount} nieuwe producten.\n🔄 ${updatedCount} bestaande producten bijgewerkt (foto of aantal).\n⏭️ ${skippedCount} ongewijzigd gebleven.`);
                        } catch (err) {
                            console.error("Fout bij toevoegen:", err);
                            window.showAlert("Er ging iets mis tijdens het toevoegen. Check console.");
                        } finally {
                            setImporting(false);
                            e.target.value = null; 
                        }
                    },
                    error: (error) => {
                        setImporting(false);
                        window.showAlert("Fout bij het inlezen van de CSV: " + error.message);
                    }
                });
            };

            const deleteItem = (id) => { 
                window.showConfirm("Weet je zeker dat je dit product wilt verwijderen?", async () => {
                    await window.db.collection('users').doc(targetUid).collection('stock').doc(id).delete();
                    window.logActivity(targetUid, 'voorraad', 'Product verwijderd'); 
                });

            const updateQuantity = async (id, current, change) => { current = Number(current)||0; if(current+change >= 0) { const it = items.find(x => x.id === id); window.logActivity(targetUid, 'voorraad', `Aantal aangepast: ${it ? it.name : 'product'}`); } if(current+change >= 0) await window.db.collection('users').doc(targetUid).collection('stock').doc(id).update({ quantity: current+change }); };
            
            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    const url = await window.uploadToImgBB(file);
                    setNewItem(prev => ({...prev, image: url}));

            };

            const openManager = (type) => {
                setEditingItemType(type);
                setEditingItemIndex(null); 
                setEditName('');
                setEditColor(0);
                if (type === 'category') setShowCatManager(true);
                if (type === 'location') setShowLocManager(true);
            };

            const saveConfig = async (type) => {
                if(!editName.trim()) return window.showAlert("Vul een naam in.");
                const list = type === 'cat' ? [...categories] : [...locations];
                const newObj = { name: editName.trim(), color: CATEGORY_COLORS[editColor] };
                if(editingItemIndex !== null) list[editingItemIndex] = newObj; else list.push(newObj);
                await window.db.collection('users').doc(targetUid).collection('settings').doc(type === 'cat' ? 'categories' : 'locations').set({ list }, { merge: true });
                setEditName(''); setEditingItemIndex(null);
            };

            const startEditConfig = (type, index, item) => {
                setEditingItemType(type);
                setEditingItemIndex(index);
                setEditName(item.name);

                setEditColor(colorIndex !== -1 ? colorIndex : 16);

                window.showConfirm(`Weet je zeker dat je deze ${type === 'cat' ? 'categorie' : 'locatie'} wilt verwijderen?`, async () => {
                    const list = (type === 'cat' ? categories : locations).filter((_, i) => i !== index);
                    await window.db.collection('users').doc(targetUid).collection('settings').doc(type === 'cat' ? 'categories' : 'locations').set({ list }, { merge: true });
                });

            const sq = searchTerm.toLowerCase();
            const filteredItems = items.filter(item => {
                return ((item.name||'').toLowerCase().includes(sq) || (item.location||'').toLowerCase().includes(sq) || (item.category||'').toLowerCase().includes(sq)) &&
                       (filterCategory === 'Alles' || item.category === filterCategory) &&
                       (filterStatus === 'Alles' || item.status === filterStatus) &&
                       (filterLocation === 'Alles' || item.location === filterLocation) &&
                       (!filterVintedOnly || (item.vinted && Number(item.vinted) > 0));

                if(sortBy==='name') return (a.name||'').localeCompare(b.name||'', 'nl');
                if(sortBy==='price-desc') return (Number(b.price)||0) - (Number(a.price)||0);
                if(sortBy==='price-asc') return (Number(a.price)||0) - (Number(b.price)||0);
                if(sortBy==='qty-desc') return (Number(b.quantity)||0) - (Number(a.quantity)||0);
                if(sortBy==='qty-asc') return (Number(a.quantity)||0) - (Number(b.quantity)||0);
                if(sortBy==='vinted-desc') return (Number(b.vinted)||0) - (Number(a.vinted)||0); 
                if(sortBy==='vinted-asc') return (Number(a.vinted)||0) - (Number(b.vinted)||0); 
                return 0;

            const totalStockValue = filteredItems.reduce((sum, item) => sum + ((item.price || 0) * (item.quantity || 1)), 0);
            const totalStockCount = filteredItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const totalUniqueProducts = filteredItems.length;

            const totalPages = itemsPerPage === 'All' ? 1 : Math.ceil(totalItems / itemsPerPage);
            const displayedItems = itemsPerPage === 'All' ? filteredItems : filteredItems.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

                return cat ? cat.color : CATEGORY_COLORS[16];

                                <button onClick={()=>saveConfig(showCatManager?'cat':'loc')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 rounded-xl font-bold shadow-sm transition-colors">OK</button>

                            <div className="flex gap-1.5 mb-4 flex-wrap bg-slate-50 dark:bg-slate-900 p-2 rounded-xl">{CATEGORY_COLORS.map((c,i)=><button key={i} onClick={()=>setEditColor(i)} className={`w-7 h-7 rounded-full border-2 ${c.bg} ${editColor===i?'border-emerald-600 ring-4 ring-emerald-200/50 dark:ring-emerald-900/50':'border-transparent hover:scale-110'} transition-all`} title={c.name}></button>)}</div>

                                            <button onClick={()=>deleteConfig(showCatManager?'cat':'loc', idx)} className="w-8 h-8 rounded-lg text-slate-400 hover:bg-white dark:hover:bg-slate-800 hover:text-red-500 flex items-center justify-center transition-all"><Icons.Trash/></button>
                                        </div>

                    {/* INPUT CARD - Alleen zichtbaar als het slotje OPEN is */}
                    {!isLocked && (

                        {/* TOTAAL BLOK */}

                            <div className="bg-gradient-to-br from-emerald-50 to-teal-50 dark:from-emerald-900/30 dark:to-teal-900/30 border border-emerald-100 dark:border-emerald-800/50 rounded-2xl p-3 sm:p-5 flex justify-between items-center shadow-sm">

                                <div>
                                    <p className="text-[9px] sm:text-xs leading-tight text-purple-600 dark:text-purple-400 font-bold uppercase tracking-widest mb-1">Verschillende Producten</p>

                                </div>
                                <div className="hidden sm:flex w-12 h-12 rounded-2xl bg-white dark:bg-purple-800 shadow-sm flex items-center justify-center text-purple-500 dark:text-purple-200 text-xl border border-purple-50 dark:border-purple-700 shrink-0">

                        {/* PRODUCTEN LIJST RENDERING */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {displayedItems.length === 0 ? <div className="col-span-full text-center py-16 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700"><Icons.Package className="text-4xl text-slate-300 mb-3 block mx-auto"/><span className="text-slate-500 font-medium">Geen producten gevonden die voldoen aan je criteria.</span></div> :
                                displayedItems.map(item => {
                                    const catColor = getCategoryColor(item.category);
                                    const locColor = getLocationColor(item.location);
                                    
                                    return (
                                        <div key={item.id} className="bg-white dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/50 rounded-2xl p-4 flex gap-4 relative hover:shadow-[0_8px_30px_rgb(0,0,0,0.06)] dark:hover:shadow-[0_8px_30px_rgba(16,185,129,0.05)] hover:-translate-y-1 transition-all duration-300 group">
                                            <div onClick={() => item.image && (item.image.startsWith('http') || item.image.startsWith('data:image')) && setPreviewImage(item.image)} className={`w-20 h-20 bg-slate-50 dark:bg-slate-800 rounded-xl flex items-center justify-center overflow-hidden border border-slate-100 dark:border-slate-700 shrink-0 relative ${item.image && (item.image.startsWith('http') || item.image.startsWith('data:image')) ? 'cursor-pointer' : ''}`}>
                                                {item.image && (item.image.startsWith('http') || item.image.startsWith('data:image')) ? <img src={item.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"/> : <Icons.Package className="text-slate-300 dark:text-slate-600 text-3xl"/>}
                                            </div>
                                            <div className="flex-grow min-w-0 flex flex-col">
                                                <div className="flex justify-between items-start gap-2 mb-1">
                                                    <div className="min-w-0 flex-1">
                                                        <div className="flex flex-wrap gap-1.5 mb-1.5">
                                                            {item.category && <span className={`text-[9px] px-2 py-0.5 rounded-md uppercase font-bold tracking-wider ${catColor.bg} ${catColor.text} border border-white/20`}>{item.category}</span>}
                                                            <span className={`text-[9px] px-2 py-0.5 rounded-md uppercase font-bold tracking-wider ${item.status==='zolder'?'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300':'bg-orange-100 text-orange-700 dark:bg-orange-900/50 dark:text-orange-300'}`}>{item.status}</span>
                                                        </div>
                                                        <div className="font-bold text-slate-800 dark:text-slate-100 text-base leading-tight break-words pr-2">{item.name || 'Naamloos'}</div>
                                                    </div>
                                                    <div className="text-right flex flex-col items-end shrink-0 pl-2 border-l border-slate-100 dark:border-slate-700">
                                                        <div className="font-black text-emerald-600 dark:text-emerald-400 text-lg leading-none">{formatEuro(item.price)}</div>
                                                        {item.quantity > 1 && (
                                                            <span className="text-[10px] text-slate-400 font-bold mt-1 bg-slate-50 dark:bg-slate-800 px-1.5 py-0.5 rounded">
                                                                Tot. {formatEuro((item.price || 0) * item.quantity)}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-auto pt-3 flex items-end justify-between">
                                                    <div className="flex flex-col gap-1.5">
                                                        <div className={`flex items-center gap-1.5 text-[10px] px-2 py-1 rounded-lg w-fit ${item.location ? locColor.bg : 'bg-slate-100 dark:bg-slate-800'} ${item.location ? locColor.text : 'text-slate-400'} font-bold`}>
                                                            <Icons.Box className="w-3 h-3 opacity-70"/> 
                                                            {item.location || 'Geen bak gekozen'}
                                                        </div>
                                                        {item.vinted > 0 && (
                                                            <div className="flex items-center gap-1.5 text-[10px] px-2 py-1 rounded-lg w-fit bg-gradient-to-r from-cyan-100 to-blue-100 text-cyan-800 dark:from-cyan-900/50 dark:to-blue-900/50 dark:text-cyan-200 border border-cyan-200/50 dark:border-cyan-800/50 font-bold shadow-sm">
                                                                <Icons.Shirt className="w-3 h-3"/>
                                                                Vinted: {item.vinted}
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="flex flex-col items-end gap-2">
                                                        <div className={`flex items-center border border-slate-200 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-800 shadow-sm overflow-hidden h-9 ${isLocked ? 'opacity-50 pointer-events-none' : ''}`}>
                                                            <button onClick={()=>updateQuantity(item.id,item.quantity,-1)} className="w-8 h-full flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 dark:text-slate-200 transition-colors font-bold text-slate-500" disabled={isLocked}>-</button>
                                                            <span className="w-8 h-full flex items-center justify-center font-mono font-black text-sm bg-white dark:bg-slate-900 dark:text-white border-x border-slate-200 dark:border-slate-600">{item.quantity}</span>
                                                            <button onClick={()=>updateQuantity(item.id,item.quantity,1)} className="w-8 h-full flex items-center justify-center hover:bg-emerald-100 text-emerald-600 dark:hover:bg-emerald-900/50 dark:text-emerald-400 transition-colors font-bold" disabled={isLocked}>+</button>
                                                        </div>
                                                        {!isLocked && (
                                                            <div className="flex gap-1.5">
                                                                <button onClick={()=>{setNewItem({ name: item.name||'', category: item.category||'', location: item.location||'', quantity: item.quantity ?? 1, price: item.price ?? 0, status: item.status||'zolder', image: item.image||'', vinted: item.vinted ?? 0 });setEditingId(item.id);setIsLocked(false);window.scrollTo({top:0,behavior:'smooth'})}} className="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30 transition-colors"><Icons.Edit className="text-xs"/></button>
                                                                <button onClick={()=>deleteItem(item.id)} className="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors"><Icons.Trash className="text-xs"/></button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            }
                        </div>

                        {/* PAGINERING CONTROLS */}
                        {totalPages > 1 && (
                            <div className="flex justify-center items-center gap-4 pt-4 border-t border-slate-100 dark:border-slate-700/50">
                                <button 
                                    onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))}
                                    disabled={currentPage === 1}
                                    className={`px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${currentPage === 1 ? 'bg-slate-50 text-slate-300 dark:bg-slate-800/50 dark:text-slate-600 cursor-not-allowed' : 'bg-white border border-slate-200 text-emerald-600 shadow-sm hover:bg-emerald-50 dark:bg-slate-800 dark:border-slate-600 dark:text-emerald-400 dark:hover:bg-emerald-900/30'}`}
                                >
                                    <Icons.ChevronLeft/> Vorige
                                </button>
                                <span className="text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl border border-slate-100 dark:border-slate-700">{currentPage} / {totalPages}</span>
                                <button 
                                    onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))}
                                    disabled={currentPage === totalPages}
                                    className={`px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${currentPage === totalPages ? 'bg-slate-50 text-slate-300 dark:bg-slate-800/50 dark:text-slate-600 cursor-not-allowed' : 'bg-white border border-slate-200 text-emerald-600 shadow-sm hover:bg-emerald-50 dark:bg-slate-800 dark:border-slate-600 dark:text-emerald-400 dark:hover:bg-emerald-900/30'}`}
                                >
                                    Volgende <Icons.ChevronRight/>
                                </button>
                            </div>
                        )}
                    </div>
                    {previewImage && <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in" onClick={()=>setPreviewImage(null)}>
                        <img src={previewImage} className="max-w-full max-h-[85vh] rounded-2xl shadow-2xl border border-white/20"/>
                        <button className="absolute top-4 right-4 w-12 h-12 bg-white/20 hover:bg-white/40 rounded-full flex items-center justify-center text-white backdrop-blur-md transition-colors"><Icons.X className="text-2xl"/></button>
                    </div>}

                    {/* CSV IMPORT MODAL */}
                    {showImportModal && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowImportModal(false)}>
                            <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 w-full max-w-lg overflow-hidden flex flex-col p-6 animate-in" onClick={e=>e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><Icons.Upload className="text-blue-500"/> CSV Importeren</h3>
                                    <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-slate-600"><Icons.X/></button>
                                </div>
                                
                                <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">
                                    Plak hieronder al je directe ImgBB links (bijv. https://i.ibb.co/...). Het systeem zal deze automatisch koppelen aan de producten in je CSV-bestand!
                                </p>
                                
                                <textarea 
                                    value={importLinks} 
                                    onChange={e => setImportLinks(e.target.value)} 
                                    className="w-full h-40 p-3 mb-6 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-white rounded-xl text-xs font-mono outline-none focus:ring-2 focus:ring-blue-500/30 custom-scroll" 
                                    placeholder="https://i.ibb.co/...\nhttps://i.ibb.co/..."
                                ></textarea>
                                
                                <div className="bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/50 rounded-xl p-4 flex flex-col items-center justify-center gap-3">
                                    <label className="bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-bold px-6 py-3 rounded-xl shadow-md cursor-pointer transition-all hover:-translate-y-0.5 flex items-center gap-2">
                                        {importing ? <Icons.Loader className="animate-spin"/> : <Icons.Upload/>} {importing ? 'Bezig met importeren...' : 'Kies CSV Bestand & Start'}
                                        <input type="file" accept=".csv" className="hidden" onChange={handleImportCSV} disabled={importing}/>
                                    </label>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===== RECHTEN =====
        // Ontbreekt een recht in de database, dan staat het standaard AAN.
        const PERMISSIONS = [
            { key: 'showCatalogs',   label: 'Catalogen',        icon: 'fa-book-open-reader', group: 'Tabbladen' },
            { key: 'showRequests',   label: 'Wensen',           icon: 'fa-gift',             group: 'Tabbladen' },
            { key: 'showStock',      label: 'Voorraad',         icon: 'fa-box',              group: 'Tabbladen' },
            { key: 'showRecipes',    label: 'Recepten',         icon: 'fa-utensils',         group: 'Tabbladen' },
            { key: 'showCustomers',  label: 'Klanten',          icon: 'fa-address-book',     group: 'Tabbladen' },
            { key: 'canEditSales',   label: 'Verkoop invullen', icon: 'fa-pen',              group: 'Overzicht' },
            { key: 'showStats',      label: 'Kerncijfers',      icon: 'fa-chart-simple',     group: 'Overzicht' },
            { key: 'showClub',       label: 'Club Gold',        icon: 'fa-crown',            group: 'Overzicht' },
            { key: 'showGoals',      label: 'Doelen',           icon: 'fa-bullseye',         group: 'Overzicht' },
            { key: 'showPs',         label: 'PS-beloningen',    icon: 'fa-award',            group: 'Overzicht' },
            { key: 'canEditPersonalPs', label: 'Persoonlijke PS instellen', icon: 'fa-sliders', group: 'Overzicht' },
            { key: 'showPromotions', label: 'Weekpromoties',    icon: 'fa-images',           group: 'Extra' },
            { key: 'showCsvImport',  label: 'CSV-import',       icon: 'fa-file-csv',         group: 'Extra' },
        ];
        const DEFAULT_PERMS = PERMISSIONS.reduce((o, p) => { o[p.key] = true; return o; }, {});
        const PERM_GROUPS = ['Tabbladen', 'Overzicht', 'Extra'];

        const AdminUserModal = ({ isOpen, onClose, selectedYear, onSelectUser, inline = false, onlyUid = null, onlyName = '' }) => {
            const [usersList, setUsersList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [permsByUser, setPermsByUser] = useState({});
            const [search, setSearch] = useState('');
            const [openUid, setOpenUid] = useState(null);

            useEffect(() => {
                if (!isOpen) return;
                const unsub = window.db.collectionGroup('months').where('yearId', 'in', [selectedYear, selectedYear - 1]).onSnapshot(snapshot => {
                    const usersMap = {};
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        if (d.userId && !usersMap[d.userId]) usersMap[d.userId] = { uid: d.userId, name: d.userName || 'Onbekend', email: d.userEmail, photo: d.userPhoto };
                    });
                    setUsersList(Object.values(usersMap).sort((a,b) => (a.name||'').localeCompare(b.name||'', 'nl')));
                    setLoading(false);
                }, err => { console.error(err); setLoading(false); window.showAlert("Gebruikers laden mislukt: " + err.message); });
                return () => unsub();
            }, [isOpen, selectedYear]);

            // Rechten van elke gebruiker live volgen
            useEffect(() => {
                const list = onlyUid && !usersList.some(u => u.uid === onlyUid) ? [...usersList, { uid: onlyUid }] : usersList;
                const unsubs = list.map(u => window.db.collection('users').doc(u.uid).collection('settings').doc('config').onSnapshot(doc => {
                    setPermsByUser(prev => ({ ...prev, [u.uid]: { ...DEFAULT_PERMS, ...(doc.exists ? doc.data() : {}) } }));
                }, err => console.error(err)));
                return () => unsubs.forEach(f => f());
            }, [usersList.map(u => u.uid).join(','), onlyUid]);

            const savePerms = async (uid, newPerms) => {
                setPermsByUser(prev => ({ ...prev, [uid]: newPerms }));
                try { await window.db.collection('users').doc(uid).collection('settings').doc('config').set(newPerms, { merge: true }); }
                catch (e) { window.showAlert("Rechten opslaan mislukt: " + e.message); }
            };
            const togglePerm = (uid, key) => { const cur = permsByUser[uid] || DEFAULT_PERMS; savePerms(uid, { ...cur, [key]: !cur[key] }); };
            const setAll = (uid, value) => savePerms(uid, PERMISSIONS.reduce((o, p) => { o[p.key] = value; return o; }, {}));

            if (!isOpen) return null;

            const q = search.trim().toLowerCase();
            let shown = usersList.filter(u => !q || (u.name || '').toLowerCase().includes(q));
            if (onlyUid) { const f = usersList.find(u => u.uid === onlyUid); shown = [f || { uid: onlyUid, name: onlyName || 'Gebruiker' }]; }

            const content = (
                <div className="space-y-4">
                    {usersList.length > 4 && !onlyUid && (
                        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Zoek gebruiker..." className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/30"/>
                    )}
                    {loading && !onlyUid && <div className="text-center py-10"><Icons.Loader className="text-amber-500 text-2xl"/></div>}
                    {!loading && !onlyUid && shown.length === 0 && <p className="text-center text-slate-400 py-8 text-sm">Geen gebruikers gevonden voor {selectedYear}.</p>}
                    {shown.map(u => {
                        const perms = permsByUser[u.uid] || DEFAULT_PERMS;
                        const offCount = PERMISSIONS.filter(p => !perms[p.key]).length;

                                {q ? 'Geen wensen gevonden voor deze zoekopdracht.' : (view === 'open' ? 'Geen openstaande wensen. Goed bezig!' : 'Nog geen wensen gevonden.')}
