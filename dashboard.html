        const getRealMonthRange = (monthName, index) => {
            if (monthName === 'Juli & Augustus') return { start: 6, end: 7 }; 
            if (monthName === 'September') return { start: 8, end: 8 };
            if (monthName === 'Oktober') return { start: 9, end: 9 };
            if (monthName === 'November') return { start: 10, end: 10 };
            if (monthName === 'December') return { start: 11, end: 11 };
            return { start: index, end: index };
        };

        const getWeekNumber = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
            return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
        };

        const getMonthWeeks = (y, mName, mIdx) => {
            const range = getRealMonthRange(mName, mIdx);
            const weeks = [];
            const firstDayOfMonth = new Date(y, range.start, 1);
            const lastDayOfMonth = new Date(y, range.end + 1, 0);

            let currentWeekStart = new Date(firstDayOfMonth);
            const firstDayDayOfWeek = currentWeekStart.getDay();
            if (firstDayDayOfWeek !== 1) {
                const offset = firstDayDayOfWeek === 0 ? -6 : 1 - firstDayDayOfWeek;
                currentWeekStart.setDate(currentWeekStart.getDate() + offset);
            }

            while (currentWeekStart <= lastDayOfMonth) {
                let currentWeekEnd = new Date(currentWeekStart);
                currentWeekEnd.setDate(currentWeekEnd.getDate() + 6);

                const weekNum = getWeekNumber(currentWeekStart);

                let visibleStart = new Date(Math.max(currentWeekStart, firstDayOfMonth));
                let visibleEnd = new Date(Math.min(currentWeekEnd, lastDayOfMonth));

                const formatShortDate = (d) => `${d.getDate()} ${['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()]}`;
                
                let labelDateRange;
                if (visibleStart.getTime() === visibleEnd.getTime()) {
                    labelDateRange = formatShortDate(visibleStart); 
                } else {
                    labelDateRange = `${formatShortDate(visibleStart)} - ${formatShortDate(visibleEnd)}`;
                }

                weeks.push({
                    start: new Date(visibleStart), 
                    end: new Date(visibleEnd),
                    actualWeekStart: new Date(currentWeekStart), 
                    actualWeekEnd: new Date(currentWeekEnd),
                    weekNumber: weekNum,
                    label: `W${weekNum} (${labelDateRange})`
                });

                currentWeekStart = new Date(currentWeekEnd);
                currentWeekStart.setDate(currentWeekStart.getDate() + 1);
            }
            return weeks;
        };

        const buildAvailableWeeks = (year, mData) => {
            let list = [];
            MONTHS.forEach((m, index) => {
                const range = getRealMonthRange(m, index);
                const useCalendar = index >= 3;
                const calWeeks = useCalendar ? getMonthWeeks(year, m, index) : [];
                const numWeeks = useCalendar ? calWeeks.length : (mData[m]?.weeks || 4);

                for (let i = 1; i <= numWeeks; i++) {
                    let label = `${m} - Week ${i}`;
                    let endDate = new Date(year, range.end + 1, 0); 
                    
                    if (useCalendar && calWeeks[i-1]) {
                        label = `${calWeeks[i-1].label}`;
                        endDate = calWeeks[i-1].end;
                    } else {
                        const monthDays = new Date(year, range.end + 1, 0).getDate();
                        const chunk = monthDays / numWeeks;
                        endDate = new Date(year, range.start, Math.round(chunk * i));
                    }

                    list.push({
                        id: `${m}-w${i}`, month: m, week: i, label: label, absoluteIndex: list.length,
                        endDate: endDate.toISOString(), isCalendar: useCalendar,
                        weekNumber: (useCalendar && calWeeks[i-1]) ? calWeeks[i-1].weekNumber : null
                    });
                }
            });
            return list;
        };

        const CustomersTab = ({ targetUid }) => {
            const [customers, setCustomers] = useState([]);

                        <input className="w-full mb-6 p-3 bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-600 dark:text-white rounded-2xl outline-none focus:ring-2 focus:ring-purple-500/30 transition-all" placeholder="Zoek klant..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/>

                    </div>
                </div>
            );
        };

        const ClubTab = ({ targetUid, monthlyData, selectedYear, formatCurrency }) => {
            const [goal, setGoal] = useState({ amount: 40000 });
            const [isEditing, setIsEditing] = useState(false);
            const [isExpanded, setIsExpanded] = useState(false);

            useEffect(() => {
                if(!targetUid) return;
                const unsub = window.db.collection('users').doc(targetUid).collection('settings').doc(`clubgold_${selectedYear}`)
                    .onSnapshot(doc => {
                        if(doc.exists) setGoal({ amount: doc.data().amount || 40000 });
                    });
                return () => unsub();
            }, [targetUid, selectedYear]);

            const saveGoal = async (e) => {
                e?.stopPropagation();
                await window.db.collection('users').doc(targetUid).collection('settings').doc(`clubgold_${selectedYear}`).set(goal, {merge: true});
                setIsEditing(false);
            };

            const totalSales = MONTHS.reduce((acc, m) => {
                let t = 0;
                const d = monthlyData[m] || {};
                for (let i = 1; i <= 10; i++) t += Number(d[`week${i}`]) || 0; 
                return acc + t;
            }, 0);

            const progressPercent = goal.amount > 0 ? Math.min(100, (totalSales / goal.amount) * 100) : 0;

            return (
                <div className="mb-6">
                    <div 
                        onClick={() => setIsExpanded(!isExpanded)}
                        className="bg-gradient-to-br from-[#1a1a1a] to-[#0f0f0f] p-5 sm:p-8 rounded-3xl border border-amber-500/30 shadow-[0_8px_30px_rgba(245,158,11,0.15)] cursor-pointer transition-all hover:border-amber-400 hover:shadow-[0_8px_40px_rgba(245,158,11,0.25)] relative overflow-hidden group"
                    >
                        {/* Subtle decorative glow */}
                        <div className="absolute top-0 right-0 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl group-hover:bg-amber-500/20 transition-all pointer-events-none"></div>

                        <div className="flex justify-between items-center relative z-10">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-amber-500/20 flex items-center justify-center text-amber-400 shrink-0 text-xl border border-amber-500/30">
                                    <Icons.Crown />
                                </div>
                                <div>
                                    <h3 className="font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-500 text-lg sm:text-2xl uppercase tracking-wider">
                                        Club Gold {selectedYear}
                                    </h3>
                                    {isExpanded && <p className="text-xs sm:text-sm text-amber-200/60 mt-1 font-medium">Jouw voortgang voor de ultieme status.</p>}
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                {!isExpanded && (
                                    <div className="text-right hidden sm:block">
                                        <div className="text-amber-100 font-bold text-xl leading-none">{formatCurrency(totalSales)} <span className="text-amber-500/70 text-lg">/ {formatCurrency(goal.amount)}</span></div>
                                        {totalSales < goal.amount ? (
                                            <div className="text-[11px] text-amber-400/80 font-medium mt-1.5 tracking-wide uppercase">Nog {formatCurrency(goal.amount - totalSales)} te gaan</div>
                                        ) : (
                                            <div className="text-[11px] text-emerald-400 font-bold mt-1.5 tracking-widest uppercase">Doel Behaald!</div>
                                        )}
                                    </div>
                                )}
                                <div className="w-10 h-10 rounded-full bg-amber-500/10 hover:bg-amber-500/20 flex items-center justify-center shrink-0 transition-colors">
                                    <Icons.ChevronDown className={`text-amber-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
                                </div>
                            </div>
                        </div>

                        {isExpanded && (
                            <div className="mt-8 pt-6 border-t border-amber-500/20 relative z-10 animate-in" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-end mb-4">
                                    <button onClick={() => setIsEditing(!isEditing)} className="px-4 py-2 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl hover:bg-amber-500/20 transition-colors font-bold text-xs uppercase tracking-wider">
                                        {isEditing ? 'Annuleren' : 'Doel Aanpassen'}
                                    </button>
                                </div>

                                {isEditing && (
                                    <div className="bg-[#111] p-5 rounded-2xl border border-amber-500/30 mb-8 flex flex-col sm:flex-row gap-4 items-end animate-in">
                                        <div className="w-full">
                                            <label className="text-xs font-bold text-amber-500 uppercase tracking-wider mb-2 block">Doelbedrag (€)</label>
                                            <input type="number" value={goal.amount} onChange={e=>setGoal({amount: Number(e.target.value)})} className="w-full p-3.5 rounded-xl border border-amber-700/50 bg-black text-amber-100 outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-500/50 font-mono text-lg transition-all"/>
                                        </div>
                                        <button onClick={saveGoal} className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-black rounded-xl shadow-lg uppercase tracking-wider transition-all duration-300 hover:-translate-y-0.5">Opslaan</button>
                                    </div>
                                )}

                                <div className="relative">
                                    <div className="flex justify-between items-end mb-4">
                                        <div>
                                            <div className="text-[10px] sm:text-xs text-amber-500/80 font-bold uppercase tracking-widest mb-1">Huidige Verkoop</div>
                                            <div className="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-amber-200">{formatCurrency(totalSales)}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[10px] sm:text-xs text-amber-500/80 font-bold uppercase tracking-widest mb-1">Doel</div>
                                            <div className="text-xl sm:text-3xl font-bold text-amber-500/80">{formatCurrency(goal.amount)}</div>
                                        </div>
                                    </div>
                                    
                                    <div className="h-6 sm:h-8 w-full bg-[#111] rounded-full overflow-hidden shadow-inner border border-amber-900/50 relative">
                                        <div className="h-full bg-gradient-to-r from-amber-600 via-amber-400 to-yellow-300 transition-all duration-1000 relative" style={{width: `${progressPercent}%`}}>
                                            <div className="absolute inset-0 opacity-30" style={{ backgroundImage: 'linear-gradient(45deg,rgba(255,255,255,1) 25%,transparent 25%,transparent 50%,rgba(255,255,255,1) 50%,rgba(255,255,255,1) 75%,transparent 75%,transparent)' , backgroundSize: '2rem 2rem'}}></div>
                                        </div>
                                        <div className="absolute inset-0 flex items-center justify-center text-black text-xs sm:text-sm font-black tracking-widest drop-shadow-sm mix-blend-overlay">
                                            {Math.round(progressPercent)}%
                                        </div>
                                    </div>

                                    {totalSales < goal.amount && (
                                        <div className="text-xs sm:text-sm text-amber-200/60 text-center mt-6 font-medium tracking-wide">Nog <span className="font-bold text-amber-400">{formatCurrency(goal.amount - totalSales)}</span> te gaan voor Club Gold!</div>
                                    )}
                                    {totalSales >= goal.amount && goal.amount > 0 && (
                                        <div className="text-sm sm:text-base text-amber-400 text-center mt-6 font-black uppercase tracking-widest animate-pulse flex items-center justify-center gap-2">
                                            <Icons.Crown className="text-2xl"/> GEFELICITEERD, CLUB GOLD BEHAALD! <Icons.Crown className="text-2xl"/>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CustomGoalsDisplay = ({ customGoals, monthlyData, selectedYear, formatCurrency, availableWeeks }) => {
            const today = new Date();
            today.setHours(0,0,0,0);
            const activeGoals = customGoals.filter(g => g.endDate ? new Date(g.endDate) >= today : true);

            if (activeGoals.length === 0) return null;

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    {activeGoals.map(goal => {
                        const isActivity = goal.type === 'activity';
                        let currentProgress = 0;
                        let activityWeeks = [];
                        let startLabel = 'Onbekend';
                        let endLabel = 'Onbekend';

                        if (isActivity) {
                            const startIdx = availableWeeks.findIndex(w => w.id === goal.startWeekId);
                            const endIdx = availableWeeks.findIndex(w => w.id === goal.endWeekId);
                            const validRange = startIdx !== -1 && endIdx !== -1;

                            if (validRange) {
                                availableWeeks.forEach(aw => {
                                    if (aw.absoluteIndex >= startIdx && aw.absoluteIndex <= endIdx) {
                                        const d = monthlyData[aw.month] || {};
                                        const weekVal = Number(d[`week${aw.week}`]) || 0;
                                        const isActive = weekVal >= 1;
                                        activityWeeks.push({
                                            id: aw.id, month: aw.month, week: aw.week, label: aw.label, active: isActive
                                        });
                                        if (isActive) currentProgress += 1;
                                    }
                                });
                                startLabel = availableWeeks[startIdx].label.split('(')[0].trim();
                                endLabel = availableWeeks[endIdx].label.split('(')[0].trim();
                            }
                        } else {
                            const goalStart = new Date(goal.startDate);
                            const goalEnd = new Date(goal.endDate);
                            startLabel = goalStart.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' });
                            endLabel = goalEnd.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' });

                            availableWeeks.forEach(aw => {
                                if (aw.isCalendar) {
                                    const d = monthlyData[aw.month] || {};
                                    const weekVal = Number(d[`week${aw.week}`]) || 0;
                                    
                                    if (weekVal > 0) {
                                        const match = aw.label.match(/\((\d+)\s([a-z]+)\s-\s(\d+)\s([a-z]+)\)/);
                                        if (match) {
                                            const mNames = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
                                            const wStartDay = parseInt(match[1]);
                                            const wStartMonth = mNames.indexOf(match[2]);
                                            const wEndDay = parseInt(match[3]);
                                            const wEndMonth = mNames.indexOf(match[4]);
                                            
                                            let wStartYear = selectedYear;
                                            let wEndYear = selectedYear;
                                            if (wStartMonth === 11 && wEndMonth === 0) { wEndYear = selectedYear + 1; }
                                            if (wStartMonth === 0 && wEndMonth === 11) { wStartYear = selectedYear - 1; }
                                            
                                            const weekStart = new Date(wStartYear, wStartMonth, wStartDay);
                                            const weekEnd = new Date(wEndYear, wEndMonth, wEndDay);
                                            
                                            const overlapStart = new Date(Math.max(weekStart, goalStart));
                                            const overlapEnd = new Date(Math.min(weekEnd, goalEnd));
                                            
                                            if (overlapStart <= overlapEnd) {
                                                const overlapDays = Math.round((overlapEnd - overlapStart) / (1000 * 60 * 60 * 24)) + 1;
                                                const weekDays = 7;
                                                currentProgress += weekVal * (overlapDays / weekDays);
                                            }
                                        }
                                    }
                                } else {
                                    const monthIndex = MONTHS.indexOf(aw.month);
                                    if (monthIndex !== -1) {
                                        const monthStart = new Date(selectedYear, monthIndex, 1);
                                        const monthEnd = new Date(selectedYear, monthIndex + 1, 0);
                                        if (monthStart <= goalEnd && monthEnd >= goalStart) {
                                            const d = monthlyData[aw.month] || {};
                                            currentProgress += Number(d[`week${aw.week}`]) || 0;
                                        }
                                    }
                                }
                            });
                        }

                        const progressPercent = goal.amount > 0 ? Math.min(100, (currentProgress / goal.amount) * 100) : 0;
                        const remaining = Math.max(0, goal.amount - currentProgress);
                        
                        return (
                            <div key={goal.id} className={`bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-3xl border border-white/40 dark:border-indigo-900/50 shadow-glass dark:shadow-glass-dark p-5 relative overflow-hidden flex flex-col group transition-all hover:shadow-[0_8px_30px_rgba(79,70,229,0.15)] ${goal.colSpan === 2 ? 'md:col-span-2' : ''}`}>
                                <div className="flex justify-between items-start mb-4 relative z-10">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-2xl bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shrink-0 border border-indigo-200 dark:border-indigo-800">
                                            {isActivity ? <Icons.Calendar className="w-4 h-4"/> : <Icons.Target className="w-4 h-4"/>}
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-800 dark:text-slate-100 text-lg leading-tight">{goal.name}</h4>
                                            <div className="text-[11px] text-slate-500 font-medium mt-0.5">
                                                {startLabel} t/m {endLabel}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-indigo-600 dark:text-indigo-400 font-black text-xl leading-none">
                                            {isActivity ? `${currentProgress} wkn` : formatCurrency(currentProgress)}
                                        </div>
                                        <div className="text-[11px] text-slate-400 mt-1 font-bold">
                                            / {isActivity ? `${goal.amount} wkn` : formatCurrency(goal.amount)}
                                        </div>
                                    </div>
                                </div>

                                <div className="h-3 w-full bg-slate-100 dark:bg-slate-800/80 rounded-full overflow-hidden shadow-inner border border-slate-200/50 dark:border-slate-700 relative z-10">
                                    <div className="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 shadow-[0_0_10px_rgba(79,70,229,0.5)] transition-all duration-1000" style={{width: `${progressPercent}%`}}></div>
                                </div>
                                
                                <div className="mt-3 text-xs font-medium text-center text-slate-500 dark:text-slate-400 mb-2 relative z-10">
                                    {remaining > 0 ? (
                                        <span>Nog <strong className="text-indigo-600 dark:text-indigo-400">{isActivity ? `${remaining} weken` : formatCurrency(remaining)}</strong> te gaan</span>
                                    ) : (
                                        <span className="text-emerald-500 font-bold uppercase tracking-widest"><Icons.CheckCircle className="w-3"/> Doel Behaald!</span>
                                    )}
                                </div>
                                
                                {isActivity && activityWeeks.length > 0 && (
                                    <div className="mt-auto pt-3 border-t border-slate-100 dark:border-slate-800 relative z-10">
                                        <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scroll pr-1">
                                            {activityWeeks.map(aw => {
                                                const wMatch = aw.label.match(/^W(\d+)/);
                                                const shortLabel = wMatch ? wMatch[0] : `${aw.month.substring(0,3)} W${aw.week}`;

                                                return (
                                                    <div 
                                                        key={aw.id} 
                                                        title={aw.label}
                                                        className={`flex items-center gap-1 text-[10px] px-2 py-1 rounded-lg border font-bold cursor-help transition-all ${aw.active ? 'bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/40 dark:text-emerald-400 dark:border-emerald-700 shadow-sm' : 'bg-slate-50 text-slate-400 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 dark:text-slate-500'}`}
                                                    >
                                                        {aw.active ? <Icons.Check className="w-2.5 h-2.5"/> : <Icons.X className="w-2.5 h-2.5 opacity-50"/>}
                                                        {shortLabel}
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const CustomGoalsModal = ({ isOpen, onClose, customGoals, updateCustomGoals, formatCurrency, availableWeeks }) => {
            const [tab, setTab] = useState('active'); 
            const [editingId, setEditingId] = useState(null);
            const [input, setInput] = useState({ name: '', amount: '', startWeekId: '', endWeekId: '', startDate: '', endDate: '', type: 'sales', colSpan: 1 });

            if (!isOpen) return null;

            const handleSave = () => {
                let finalAmount = Number(input.amount);
                let finalEndDate = new Date().toISOString();
                
                if (input.type === 'activity') {
                    if (input.startWeekId && input.endWeekId) {
                        const s = availableWeeks.findIndex(w=>w.id===input.startWeekId);
                        const e = availableWeeks.findIndex(w=>w.id===input.endWeekId);
                        if (s !== -1 && e !== -1 && e >= s) {
                            finalAmount = (e - s) + 1; 
                            const endWeek = availableWeeks.find(w => w.id === input.endWeekId);
                            if (endWeek) finalEndDate = endWeek.endDate;
                        } else {
                            return window.showAlert("Zorg ervoor dat de eindweek na of op de startweek valt.");
                        }
                    } else {
                        return window.showAlert("Selecteer een start- en eindweek.");
                    }
                } else {
                    if (!input.startDate || !input.endDate) {
                        return window.showAlert("Selecteer een start- en einddatum voor dit omzetdoel.");
                    }
                    if (new Date(input.startDate) > new Date(input.endDate)) {
                        return window.showAlert("De einddatum moet na de startdatum liggen.");
                    }
                    finalEndDate = new Date(input.endDate).toISOString();
                }

                if(!input.name || (!finalAmount && finalAmount !== 0)) {
                    return window.showAlert("Vul a.u.b. de naam en het doel in!");
                }

                if (editingId) {
                    const updatedGoals = customGoals.map(g => g.id === editingId ? {
                        ...g, name: input.name, amount: finalAmount, startWeekId: input.type === 'activity' ? input.startWeekId : null,
                        endWeekId: input.type === 'activity' ? input.endWeekId : null, startDate: input.type === 'sales' ? new Date(input.startDate).toISOString() : null,
                        endDate: finalEndDate, type: input.type || 'sales', colSpan: Number(input.colSpan) || 1
                    } : g);
                    updateCustomGoals(updatedGoals);
                    setEditingId(null);
                } else {
                    const newGoal = { 
                        id: Date.now().toString(), name: input.name, amount: finalAmount, startWeekId: input.type === 'activity' ? input.startWeekId : null,
                        endWeekId: input.type === 'activity' ? input.endWeekId : null, startDate: input.type === 'sales' ? new Date(input.startDate).toISOString() : null,
                        endDate: finalEndDate, type: input.type || 'sales', createdAt: Date.now(), colSpan: Number(input.colSpan) || 1
                    };
                    updateCustomGoals([...(customGoals || []), newGoal]);
                }
                setInput({ name: '', amount: '', startWeekId: '', endWeekId: '', startDate: '', endDate: '', type: 'sales', colSpan: 1 });
                setTab('active');
            };

            const handleEdit = (goal) => {
                let formattedStart = '';
                let formattedEnd = '';
                if (goal.type === 'sales') {
                     formattedStart = goal.startDate ? new Date(goal.startDate).toISOString().split('T')[0] : '';
                     formattedEnd = goal.endDate ? new Date(goal.endDate).toISOString().split('T')[0] : '';
                }
                setInput({ name: goal.name, amount: goal.amount, startWeekId: goal.startWeekId || '', endWeekId: goal.endWeekId || '', startDate: formattedStart, endDate: formattedEnd, type: goal.type || 'sales', colSpan: goal.colSpan || 1 });
                setEditingId(goal.id);
                setTab('active');
            };

            const cancelEdit = () => {
                setEditingId(null);
                setInput({ name: '', amount: '', startWeekId: '', endWeekId: '', startDate: '', endDate: '', type: 'sales', colSpan: 1 });
            };

            const handleDelete = (id) => {
                window.showConfirm("Weet je zeker dat je dit doel wilt verwijderen?", () => {
                    updateCustomGoals(customGoals.filter(g => g.id !== id));
                });
            };

            const today = new Date();
            today.setHours(0,0,0,0);

            const activeGoalsList = (customGoals || []).filter(g => g.endDate ? new Date(g.endDate) >= today : true).sort((a,b) => new Date(a.endDate) - new Date(b.endDate));
            const historyGoalsList = (customGoals || []).filter(g => g.endDate ? new Date(g.endDate) < today : false).sort((a,b) => new Date(b.endDate) - new Date(a.endDate));

            return (
                <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-3xl shadow-glass border border-white/50 dark:border-slate-700 w-full max-w-lg overflow-hidden modal-content flex flex-col max-h-[90vh]" onClick={e=>e.stopPropagation()}>
                        
                        <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <Icons.Target className="text-indigo-500"/> Mijn Doelen Beheren
                            </h3>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"><Icons.X/></button>
                        </div>

                        <div className="overflow-y-auto p-5 custom-scroll space-y-6">
                            <div className="bg-indigo-50/50 dark:bg-indigo-900/20 p-5 rounded-2xl border border-indigo-100 dark:border-indigo-800/50">
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="font-bold text-indigo-800 dark:text-indigo-300 text-sm flex items-center gap-2">
                                        {editingId ? <Icons.Edit className="w-3"/> : <Icons.Plus className="w-3"/>} 
                                        {editingId ? 'Doel Wijzigen' : 'Nieuw Doel Instellen'}
                                    </h4>
                                    {editingId && (
                                        <button onClick={cancelEdit} className="text-xs font-bold text-indigo-500 hover:text-indigo-700">Annuleren</button>
                                    )}
                                </div>

                                <div className="flex gap-2 mb-4 p-1 bg-slate-100 dark:bg-slate-800/50 rounded-xl">
                                    <button 
                                        onClick={() => setInput({...input, type: 'sales'})} 
                                        className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.type !== 'activity' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                    >
                                        💶 Omzet
                                    </button>
                                    <button 
                                        onClick={() => setInput({...input, type: 'activity'})} 
                                        className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.type === 'activity' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                    >
                                        📅 Activiteit
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                    <div className="sm:col-span-2">
                                        <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Naam van doel (bijv. Zomertrip)</label>
                                        <input type="text" value={input.name} onChange={e=>setInput({...input, name:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"/>
                                    </div>
                                    
                                    {input.type === 'activity' ? (
                                        <React.Fragment>
                                            <div className="sm:col-span-2">
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Doel (aantal actieve weken)</label>
                                                <div className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-indigo-50/50 dark:bg-slate-800/50 text-indigo-800 dark:text-indigo-300 font-bold">
                                                    {input.startWeekId && input.endWeekId ? (
                                                        (() => {
                                                            const s = availableWeeks.findIndex(w=>w.id===input.startWeekId);
                                                            const e = availableWeeks.findIndex(w=>w.id===input.endWeekId);
                                                            if(s !== -1 && e !== -1 && e >= s) return `${(e - s) + 1} weken (automatisch berekend)`;
                                                            return 'Let op: Eindweek moet na of op startweek vallen';
                                                        })()
                                                    ) : 'Kies eerst een start- en eindweek...'}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Start Week</label>
                                                <select value={input.startWeekId} onChange={e=>setInput({...input, startWeekId:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all">
                                                    <option value="">Kies week...</option>
                                                    {availableWeeks.map(w => <option key={w.id} value={w.id}>{w.label}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Eind Week</label>
                                                <select value={input.endWeekId} onChange={e=>setInput({...input, endWeekId:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all">
                                                    <option value="">Kies week...</option>
                                                    {availableWeeks.map(w => <option key={w.id} value={w.id}>{w.label}</option>)}
                                                </select>
                                            </div>
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <div className="sm:col-span-2">
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Doelbedrag (€)</label>
                                                <input type="number" value={input.amount} onChange={e=>setInput({...input, amount:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" placeholder="0"/>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Startdatum</label>
                                                <input type="date" value={input.startDate} onChange={e=>setInput({...input, startDate:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"/>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Einddatum</label>
                                                <input type="date" value={input.endDate} onChange={e=>setInput({...input, endDate:e.target.value})} className="w-full p-3 text-sm rounded-xl border border-indigo-200/50 dark:border-indigo-700/50 bg-white/80 dark:bg-slate-800/80 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"/>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    <div className="sm:col-span-2 mt-1">
                                        <label className="text-[10px] font-bold text-indigo-700 dark:text-indigo-400 uppercase tracking-wider block mb-1.5">Weergave Grootte (Op Dashboard)</label>
                                        <div className="flex gap-2 p-1 bg-slate-100 dark:bg-slate-800/50 rounded-xl">
                                            <button 
                                                onClick={() => setInput({...input, colSpan: 1})} 
                                                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.colSpan === 1 ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                            >
                                                1 Kolom (Compact)
                                            </button>
                                            <button 
                                                onClick={() => setInput({...input, colSpan: 2})} 
                                                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${input.colSpan === 2 ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                                            >
                                                2 Kolommen (Breed)
                                            </button>
                                        </div>
                                    </div>

                                </div>
                                <button onClick={handleSave} className="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all hover:-translate-y-0.5">
                                    {editingId ? 'Wijzigingen Opslaan' : 'Doel Toevoegen'}
                                </button>
                            </div>

                            <div>
                                <div className="flex border-b border-slate-200 dark:border-slate-800 mb-4">
                                    <button onClick={()=>setTab('active')} className={`pb-3 px-5 text-sm font-bold transition-all ${tab==='active' ? 'border-b-2 border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>Actief ({activeGoalsList.length})</button>
                                    <button onClick={()=>setTab('history')} className={`pb-3 px-5 text-sm font-bold transition-all ${tab==='history' ? 'border-b-2 border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>Geschiedenis ({historyGoalsList.length})</button>
                                </div>

                                <div className="space-y-3">
                                    {tab === 'active' && activeGoalsList.length === 0 && <p className="text-center text-slate-400 text-sm py-6 italic border-2 border-dashed dark:border-slate-700 rounded-xl">Je hebt momenteel geen actieve doelen.</p>}
                                    {tab === 'history' && historyGoalsList.length === 0 && <p className="text-center text-slate-400 text-sm py-6 italic border-2 border-dashed dark:border-slate-700 rounded-xl">Geen oude doelen gevonden.</p>}

                                    {(tab === 'active' ? activeGoalsList : historyGoalsList).map(goal => {
                                        let startLabel = '';
                                        let endLabel = '';

                                        if (goal.type === 'activity') {
                                            startLabel = availableWeeks.find(w => w.id === goal.startWeekId)?.label.split('(')[0].trim() || 'Onbekend';
                                            endLabel = availableWeeks.find(w => w.id === goal.endWeekId)?.label.split('(')[0].trim() || 'Onbekend';
                                        } else {
                                            startLabel = goal.startDate ? new Date(goal.startDate).toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' }) : '';
                                            endLabel = goal.endDate ? new Date(goal.endDate).toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit' }) : '';
                                        }
                                        
                                        return (
                                            <div key={goal.id} className={`p-4 rounded-2xl border flex items-center justify-between transition-all ${tab === 'active' ? 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 shadow-sm' : 'bg-slate-50 dark:bg-slate-800/50 border-slate-100 dark:border-slate-700/50 opacity-80'}`}>
                                                <div>
                                                    <div className="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                                                        {goal.type === 'activity' ? <Icons.Calendar className="text-indigo-400 w-4 h-4"/> : <Icons.Target className="text-indigo-400 w-4 h-4"/>}
                                                        {goal.name}
                                                    </div>
                                                    <div className="text-sm text-slate-500 dark:text-slate-400 mt-1">
                                                        Doel: <strong className="text-slate-700 dark:text-slate-300">
                                                            {goal.type === 'activity' ? `${goal.amount} weken` : formatCurrency(goal.amount)}
                                                        </strong>
                                                    </div>
                                                    <div className="text-[11px] text-slate-400 mt-1 font-medium bg-slate-100 dark:bg-slate-700 inline-block px-2 py-0.5 rounded-md">
                                                        {startLabel} t/m {endLabel}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={()=>handleEdit(goal)} className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30 transition-colors">
                                                        <Icons.Edit className="w-3.5"/>
                                                    </button>
                                                    <button onClick={()=>handleDelete(goal.id)} className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors">
                                                        <Icons.Trash className="w-3.5"/>
                                                    </button>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const RecipesTab = ({ targetUid }) => {
            const [recipes, setRecipes] = useState([]);
            const [input, setInput] = useState({ name: '', product: '', ingredients: '', instructions: '', image: '' });
            const [editingId, setEditingId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [uploading, setUploading] = useState(false);
            const [viewingRecipe, setViewingRecipe] = useState(null); 

            useEffect(() => {
                if(!targetUid) return;
                const unsub = window.db.collection('users').doc(targetUid).collection('recipes').orderBy('name').onSnapshot(snap => {
                    setRecipes(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                return () => unsub();
            }, [targetUid]);

            const handleSave = async () => {
                if(!input.name) return;
                if(editingId) {
                    await window.db.collection('users').doc(targetUid).collection('recipes').doc(editingId).update(input);
                    setEditingId(null);
                } else {
                    await window.db.collection('users').doc(targetUid).collection('recipes').add(input);
                }
                setInput({ name: '', product: '', ingredients: '', instructions: '', image: '' });
            };

            const handleDelete = (id) => { 
                window.showConfirm("Recept verwijderen?", async () => {
                    await window.db.collection('users').doc(targetUid).collection('recipes').doc(id).delete(); 
                });
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    const ref = firebase.storage().ref().child(`users/${targetUid}/recipes/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    setInput({...input, image: url});
                } catch (error) { window.showAlert("Upload fout: " + error.message); } finally { setUploading(false); }
            };

            const filtered = recipes.filter(r => r.name.toLowerCase().includes(searchTerm.toLowerCase()) || (r.product||'').toLowerCase().includes(searchTerm.toLowerCase()));

            const printRecipe = (recipe) => {
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <html>
                    <head>
                        <title>${recipe.name}</title>
                        <style>
                            body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
                            img { max-width: 100%; height: auto; max-height: 400px; border-radius: 8px; margin-bottom: 20px; object-fit: cover; }
                            h1 { color: #059669; border-bottom: 2px solid #059669; padding-bottom: 10px; margin-bottom: 5px; }
                            .product { color: #666; text-transform: uppercase; font-weight: bold; font-size: 0.9em; margin-bottom: 20px; }
                            h2 { color: #059669; margin-top: 25px; font-size: 1.2em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
                            .content { white-space: pre-wrap; line-height: 1.6; }
                            @media print {
                                body { padding: 0; }
                                h1 { color: black; border-color: black; }
                                h2 { color: black; }
                            }
                        </style>
                    </head>
                    <body>
                        <h1>${recipe.name}</h1>
                        <div class="product">${recipe.product || ''}</div>
                        ${recipe.image ? `<img src="${recipe.image}" />` : ''}
                        <h2>Ingrediënten</h2>
                        <div class="content">${recipe.ingredients || '-'}</div>
                        <h2>Bereiding</h2>
                        <div class="content">${recipe.instructions || '-'}</div>
                        <script>
                            window.onload = function() { window.print(); }
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            };

            return (
                <div className="space-y-6">
                     <div className={`p-6 rounded-3xl shadow-glass dark:shadow-glass-dark border transition-all duration-300 ${editingId ? 'bg-amber-50/80 dark:bg-amber-900/20 backdrop-blur-md border-amber-200 dark:border-amber-700' : 'bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-white/40 dark:border-slate-700'}`}>
                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-slate-700 dark:text-slate-200"><Icons.BookOpen className="text-orange-500"/> {editingId ? 'Recept Wijzigen' : 'Nieuwe Recept'}</h3>
                        <div className="grid grid-cols-1 gap-4">
                            <div className="flex flex-col sm:flex-row gap-4">
                                 <label className="w-32 h-32 border border-dashed border-slate-300 dark:border-slate-600 rounded-2xl bg-slate-50/50 dark:bg-slate-800/50 flex items-center justify-center cursor-pointer hover:bg-orange-50 dark:hover:bg-slate-700 shrink-0 relative overflow-hidden transition-colors">
                                    <input type="file" className="hidden" onChange={handleImageUpload}/>
                                    {uploading ? <Icons.Loader className="text-orange-500 text-2xl"/> : (input.image ? <img src={input.image} className="w-full h-full object-cover"/> : <div className="text-center text-slate-400 font-medium text-xs"><Icons.Image className="text-3xl mb-2 text-slate-300"/><br/>Foto Toevoegen</div>)}
                                </label>
                                <div className="flex-grow space-y-4">
                                    <input value={input.name} onChange={e=>setInput({...input, name:e.target.value})} placeholder="Recept Naam" className="w-full bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500/30 transition-all"/>
                                    <input value={input.product} onChange={e=>setInput({...input, product:e.target.value})} placeholder="Gekoppeld Product (bv. MicroCook)" className="w-full bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-600 dark:text-white p-3 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500/30 transition-all"/>
                                </div>
                            </div>
                            <textarea value={input.ingredients} onChange={e=>setInput({...input, ingredients:e.target.value})} placeholder="Ingrediënten (elk op een nieuwe regel)" className="bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-600 dark:text-white p-4 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500/30 transition-all h-32 custom-scroll" />
                            <textarea value={input.instructions} onChange={e=>setInput({...input, instructions:e.target.value})} placeholder="Bereiding..." className="bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-600 dark:text-white p-4 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500/30 transition-all h-32 custom-scroll" />
                        </div>
                        <button onClick={handleSave} className={`w-full mt-6 py-3.5 text-white font-bold rounded-2xl shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 ${editingId?'bg-gradient-to-r from-amber-500 to-amber-600 shadow-amber-500/30':'bg-gradient-to-r from-orange-500 to-rose-500 shadow-orange-500/30'}`}>{editingId ? 'Wijziging Opslaan' : 'Recept Toevoegen'}</button>
                    </div>

                    <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-6 rounded-3xl border border-white/40 dark:border-slate-700 shadow-glass dark:shadow-glass-dark">
                        <input className="w-full mb-6 p-3 bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-600 dark:text-white rounded-2xl outline-none focus:ring-2 focus:ring-orange-500/30 transition-all" placeholder="Zoek recept..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filtered.map(r => (
                                <div 
                                    key={r.id} 
                                    onClick={() => setViewingRecipe(r)}
                                    className="bg-white dark:bg-[#1e293b]/80 border border-slate-100 dark:border-slate-700/50 rounded-2xl overflow-hidden flex flex-col hover:shadow-xl dark:hover:shadow-orange-500/10 hover:-translate-y-1 relative group cursor-pointer transition-all duration-300"
                                >
                                    <div className="h-40 bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden border-b border-slate-100 dark:border-slate-700/50 relative">
                                        {r.image ? <img src={r.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/> : <Icons.Utensils className="text-slate-300 dark:text-slate-600 text-4xl"/>}
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    </div>
                                    <div className="p-4 flex-grow flex flex-col">
                                        <h4 className="font-bold text-slate-800 dark:text-slate-100 text-lg line-clamp-1">{r.name}</h4>
                                        {r.product && <div className="text-[10px] text-orange-600 dark:text-orange-400 font-bold mb-3 uppercase tracking-wider bg-orange-50 dark:bg-orange-900/30 inline-block px-2 py-1 rounded-lg w-fit">{r.product}</div>}
                                        <div className="text-sm text-slate-500 dark:text-slate-400 line-clamp-3 whitespace-pre-line mt-auto leading-relaxed">{r.ingredients}</div>
                                    </div>
                                     <div className="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={(e)=>{e.stopPropagation(); setInput(r);setEditingId(r.id);window.scrollTo({top:0,behavior:'smooth'})}} className="w-9 h-9 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-amber-500 shadow-lg"><Icons.Edit/></button>
                                        <button onClick={(e)=>{e.stopPropagation(); handleDelete(r.id)}} className="w-9 h-9 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-red-500 shadow-lg"><Icons.Trash/></button>
                                    </div>
                                </div>
                            ))}
                            {filtered.length === 0 && <div className="col-span-full text-center p-8 text-slate-400 font-medium">Geen recepten gevonden.</div>}
                        </div>
                    </div>

                    {/* DETAIL MODAL VOOR RECEPT */}
                    {viewingRecipe && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-md" onClick={() => setViewingRecipe(null)}>
                            <div className="bg-white dark:bg-slate-900 w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl overflow-hidden flex flex-col animate-in border border-white/20 dark:border-slate-700/50" onClick={e => e.stopPropagation()}>
                                {/* Header */}
                                <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm z-10 sticky top-0">
                                    <div className="min-w-0">
                                        <h3 className="font-bold text-2xl text-slate-800 dark:text-white truncate">{viewingRecipe.name}</h3>
                                        {viewingRecipe.product && <p className="text-xs font-bold text-orange-500 uppercase tracking-widest mt-1">{viewingRecipe.product}</p>}
                                    </div>
                                    <div className="flex gap-2 shrink-0">
                                        <button onClick={() => printRecipe(viewingRecipe)} className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300 hover:text-emerald-600 hover:bg-emerald-50 transition-colors" title="Printen"><Icons.Printer className="w-5 h-5"/></button>
                                        <button onClick={() => setViewingRecipe(null)} className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300 hover:text-red-600 hover:bg-red-50 transition-colors"><Icons.X className="w-5 h-5"/></button>
                                    </div>
                                </div>
                                
                                {/* Content */}
                                <div className="overflow-y-auto p-0 custom-scroll">
                                    {viewingRecipe.image && (
                                        <div className="w-full h-64 sm:h-80 bg-slate-100 dark:bg-slate-950 flex items-center justify-center overflow-hidden relative">
                                            <img src={viewingRecipe.image} className="w-full h-full object-cover"/>
                                            <div className="absolute inset-0 bg-gradient-to-t from-white dark:from-slate-900 via-transparent to-transparent"></div>
                                        </div>
                                    )}
                                    <div className="p-6 sm:p-8 grid grid-cols-1 md:grid-cols-3 gap-8 relative z-10 -mt-10 sm:-mt-16 bg-white dark:bg-slate-900 rounded-t-3xl">
                                        <div className="md:col-span-1">
                                            <div className="bg-orange-50/50 dark:bg-orange-900/10 p-5 rounded-2xl border border-orange-100/50 dark:border-orange-800/20">
                                                <h4 className="font-bold text-orange-600 dark:text-orange-400 mb-4 flex items-center gap-2"><Icons.Clipboard/> Ingrediënten</h4>
                                                <div className="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed font-medium">{viewingRecipe.ingredients || 'Geen ingrediënten opgegeven.'}</div>
                                            </div>
                                        </div>
                                        <div className="md:col-span-2">
                                            <h4 className="font-bold text-slate-800 dark:text-white mb-4 text-xl border-b border-slate-100 dark:border-slate-800 pb-3 flex items-center gap-2"><Icons.Utensils className="text-orange-500"/> Bereiding</h4>
                                            <div className="text-base text-slate-600 dark:text-slate-300 whitespace-pre-line leading-loose">{viewingRecipe.instructions || 'Geen bereidingswijze opgegeven.'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StockTab = ({ targetUid, user }) => {
            const [items, setItems] = useState([]);
            const [categories, setCategories] = useState([{ name: 'Algemeen', color: CATEGORY_COLORS[16] }]); 
            const [locations, setLocations] = useState([{ name: 'Algemeen', color: CATEGORY_COLORS[16] }]); 
            const [newItem, setNewItem] = useState({ name: '', category: 'Algemeen', location: 'Algemeen', quantity: 1, price: 0, status: 'zolder', image: '', vinted: 0 });
            const [loading, setLoading] = useState(true);
            const [editingId, setEditingId] = useState(null); 
            const [keepSettings, setKeepSettings] = useState(false); 
            const [importing, setImporting] = useState(false);
            
            const [showCatManager, setShowCatManager] = useState(false);
            const [showLocManager, setShowLocManager] = useState(false);
            const [editName, setEditName] = useState('');
            const [editColor, setEditColor] = useState(0);
            const [editingItemIndex, setEditingItemIndex] = useState(null);
            const [editingItemType, setEditingItemType] = useState(null);

            const [previewImage, setPreviewImage] = useState(null);
            const [uploading, setUploading] = useState(false);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [filterCategory, setFilterCategory] = useState('Alles');
            const [filterStatus, setFilterStatus] = useState('Alles');
            const [filterLocation, setFilterLocation] = useState('Alles');
            const [filterVintedOnly, setFilterVintedOnly] = useState(false); 
            const [sortBy, setSortBy] = useState('name');
            const [currentPage, setCurrentPage] = useState(1);
            const [itemsPerPage, setItemsPerPage] = useState(10); 

            useEffect(() => {
                if(!targetUid) return;
                const unsubStock = window.db.collection('users').doc(targetUid).collection('stock').orderBy('createdAt', 'desc').onSnapshot(snap => { setItems(snap.docs.map(d => ({id: d.id, ...d.data()}))); setLoading(false); });
                const unsubCats = window.db.collection('users').doc(targetUid).collection('settings').doc('categories').onSnapshot(doc => { 
                    if(doc.exists && doc.data().list) {
                        setCategories(doc.data().list.map(c => typeof c === 'string' ? {name:c, color: CATEGORY_COLORS[16]} : c)); 
                    }
                });
                const unsubLocs = window.db.collection('users').doc(targetUid).collection('settings').doc('locations').onSnapshot(doc => { 
                    if(doc.exists && doc.data().list) {
                        setLocations(doc.data().list.map(l => typeof l === 'string' ? {name:l, color: CATEGORY_COLORS[16]} : l)); 
                    }
                });
                return () => { unsubStock(); unsubCats(); unsubLocs(); };
            }, [targetUid]);

            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm, filterCategory, filterStatus, filterLocation, sortBy, filterVintedOnly]);

            const handleSaveItem = async () => {
                if(!newItem.name) return window.showAlert("Vul een productnaam in.");
                const itemData = { ...newItem, price: Number(newItem.price)||0, quantity: Number(newItem.quantity)||0, vinted: Number(newItem.vinted)||0, updatedAt: Date.now() };
                try {
                    if (editingId) { 
                        await window.db.collection('users').doc(targetUid).collection('stock').doc(editingId).update(itemData); 
                        setEditingId(null); 
                        setNewItem({ name: '', category: 'Algemeen', location: 'Algemeen', quantity: 1, price: 0, status: 'zolder', image: '', vinted: 0 });
                    } 
                    else { 
                        itemData.createdAt = Date.now(); 
                        await window.db.collection('users').doc(targetUid).collection('stock').add(itemData); 
                        if (keepSettings) {
                            setNewItem(prev => ({ ...prev, name: '', quantity: 1, price: 0, image: '', vinted: 0 }));
                        } else {
                            setNewItem({ name: '', category: 'Algemeen', location: 'Algemeen', quantity: 1, price: 0, status: 'zolder', image: '', vinted: 0 });
                        }
                    }
                } catch(err) { window.showAlert("Fout: " + err.message); }
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setImporting(true);

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: function(h) {
                        return h.trim();
                    },
                    complete: async (results) => {
                        const data = results.data;
                        if (!data || data.length === 0) {
                            setImporting(false);
                            return window.showAlert("Het CSV-bestand lijkt leeg te zijn of kon niet worden gelezen.");
                        }

                        let addedCount = 0;
                        let skippedCount = 0;

                        let newCats = [...categories];
                        let newLocs = [...locations];
                        let catsChanged = false;
                        let locsChanged = false;

                        const addPromises = [];

                        for (const row of data) {
                            const getVal = (possibleKeys) => {
                                const key = Object.keys(row).find(k => possibleKeys.includes(k.toLowerCase().trim()));
                                return key ? row[key] : null;
                            };

                            let itemName = getVal(['naam', 'name', 'titel', 'title', 'product', 'artikel', 'item']);
                            
                            // Als we nog geen naam hebben gevonden via bekende kolommen, pakt hij de ALLEREERSTE kolom
                            if (!itemName) {
                                const firstKey = Object.keys(row)[0];
                                itemName = row[firstKey];
                            }

                            if (!itemName || String(itemName).trim() === '') continue;

                            // Skip if already exists
                            if (items.some(item => item.name.toLowerCase() === String(itemName).toLowerCase().trim())) {
                                skippedCount++;
                                continue;
                            }

                            const rawPrice = getVal(['prijs', 'price', 'verkoopprijs', 'waarde']);
                            const price = rawPrice ? parseFloat(String(rawPrice).replace('€', '').replace(',', '.').trim()) || 0 : 0;
                            
                            const quantity = parseInt(getVal(['aantal', 'quantity', 'aantal in stock', 'stock', 'hoeveelheid'])) || 1;
                            const vinted = parseInt(getVal(['stockverkoop', 'vinted', 'op vinted', 'vinted stock', 'aantal vinted'])) || 0;
                            
                            let category = getVal(['categorie', 'category', 'soort', 'tags']) || 'Algemeen';
                            let location = getVal(['locatie', 'location', 'bak', 'doos', 'plaats']) || 'Algemeen';
                            
                            let statusVal = getVal(['status', 'staat', 'conditie']) || 'zolder';
                            let status = String(statusVal).toLowerCase().includes('gebruik') ? 'gebruik' : 'zolder';

                            if (!newCats.find(c => c.name.toLowerCase() === String(category).toLowerCase().trim())) {
                                newCats.push({ name: String(category).trim(), color: CATEGORY_COLORS[16] });
                                catsChanged = true;
                            }
                            if (!newLocs.find(l => l.name.toLowerCase() === String(location).toLowerCase().trim())) {
                                newLocs.push({ name: String(location).trim(), color: CATEGORY_COLORS[16] });
                                locsChanged = true;
                            }

                            const newItemData = {
                                name: String(itemName).trim(),
                                category: String(category).trim(),
                                location: String(location).trim(),
                                price: price,
                                quantity: quantity,
                                vinted: vinted,
                                status: status,
                                image: '',
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            };

                            addPromises.push(window.db.collection('users').doc(targetUid).collection('stock').add(newItemData));
                            addedCount++;
                        }

                        try {
                            await Promise.all(addPromises);
                            
                            if (catsChanged) await window.db.collection('users').doc(targetUid).collection('settings').doc('categories').set({ list: newCats }, { merge: true });
                            if (locsChanged) await window.db.collection('users').doc(targetUid).collection('settings').doc('locations').set({ list: newLocs }, { merge: true });

                            window.showAlert(`Import succesvol! \n${addedCount} producten toegevoegd.\n${skippedCount} producten overgeslagen (bestaan al).`);
                        } catch (err) {
                            console.error("Fout bij toevoegen producten:", err);
                            window.showAlert("Er ging iets mis tijdens het toevoegen. Check console.");
                        } finally {
                            setImporting(false);
                            e.target.value = null; 
                        }
                    },
                    error: (error) => {
                        setImporting(false);
                        window.showAlert("Fout bij het inlezen van de CSV: " + error.message);
                    }
                });
            };

            const deleteItem = (id) => { 
                window.showConfirm("Weet je zeker dat je dit product wilt verwijderen?", async () => {
                    await window.db.collection('users').doc(targetUid).collection('stock').doc(id).delete(); 
                });
            };
            const updateQuantity = async (id, current, change) => { if(current+change >= 0) await window.db.collection('users').doc(targetUid).collection('stock').doc(id).update({ quantity: current+change }); };
            
            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    const ref = firebase.storage().ref().child(`users/${user.uid}/stock/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    setNewItem({...newItem, image: url});
                } catch (error) { window.showAlert("Upload fout: " + error.message); } finally { setUploading(false); }
            };

            const openManager = (type) => {
                setEditingItemType(type);
                setEditingItemIndex(null); 
                setEditName('');
                setEditColor(0);
                if (type === 'category') setShowCatManager(true);
                if (type === 'location') setShowLocManager(true);
            };

            const saveConfig = async (type) => {
                if(!editName.trim()) return window.showAlert("Vul een naam in.");
                const list = type === 'cat' ? [...categories] : [...locations];
                const newObj = { name: editName.trim(), color: CATEGORY_COLORS[editColor] };
                if(editingItemIndex !== null) list[editingItemIndex] = newObj; else list.push(newObj);
                await window.db.collection('users').doc(targetUid).collection('settings').doc(type === 'cat' ? 'categories' : 'locations').set({ list }, { merge: true });
                setEditName(''); setEditingItemIndex(null);
            };

            const startEditConfig = (type, index, item) => {
                setEditingItemType(type);
                setEditingItemIndex(index);
                setEditName(item.name);
                const colorIndex = CATEGORY_COLORS.findIndex(c => c.bg === item.color.bg);
                setEditColor(colorIndex !== -1 ? colorIndex : 16);
            };

            const deleteConfig = (type, index) => {
                window.showConfirm(`Weet je zeker dat je deze ${type === 'cat' ? 'categorie' : 'locatie'} wilt verwijderen?`, async () => {
                    const list = (type === 'cat' ? categories : locations).filter((_, i) => i !== index);
                    await window.db.collection('users').doc(targetUid).collection('settings').doc(type === 'cat' ? 'categories' : 'locations').set({ list }, { merge: true });
                });
            };

            const filteredItems = items.filter(item => {
                return (item.name.toLowerCase().includes(searchTerm.toLowerCase()) || (item.location||'').toLowerCase().includes(searchTerm.toLowerCase())) &&
                       (filterCategory === 'Alles' || item.category === filterCategory) &&
                       (filterStatus === 'Alles' || item.status === filterStatus) &&
                       (filterLocation === 'Alles' || item.location === filterLocation) &&
                       (!filterVintedOnly || (item.vinted && Number(item.vinted) > 0)); 
            }).sort((a,b) => {
                if(sortBy==='name') return a.name.localeCompare(b.name);
                if(sortBy==='price-desc') return b.price - a.price;
