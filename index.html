<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inloggen - Tupper Life by Kaat</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tupper Life">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-setup.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #0f172a;
            background: radial-gradient(ellipse at top, #d1fae5 0%, #f8fafc 55%) fixed;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
        }
        @media (prefers-color-scheme: dark) {
            body { color: #f1f5f9; background: radial-gradient(ellipse at top, #064e3b 0%, #0b1120 55%) fixed; }
            .card { background: #111827 !important; border-color: #1f2937 !important; }
            .sub { color: #94a3b8 !important; }
        }
        .card {
            width: 100%; max-width: 380px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 28px; padding: 36px 28px 28px; text-align: center;
            box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 20px 50px -20px rgba(5,150,105,.35);
            animation: fade .4s cubic-bezier(.16,1,.3,1);
        }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .logo { height: 150px; width: auto; max-width: 100%; object-fit: contain; margin: 0 auto 18px; display: block; }
        h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
        h1 span { color: #059669; }
        .sub { color: #64748b; font-size: 15px; margin: 0 0 26px; }
        .btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
            background: #059669; color: #fff; border: 0; border-radius: 16px; padding: 15px 20px;
            font: 600 16px 'Inter', system-ui, sans-serif; cursor: pointer;
            box-shadow: 0 8px 20px -8px rgba(5,150,105,.7); transition: transform .15s, background .15s;
        }
        .btn:hover { background: #047857; }
        .btn:active { transform: scale(.98); }
        .btn[disabled] { opacity: .7; cursor: default; }
        .btn svg { width: 20px; height: 20px; background: #fff; border-radius: 50%; padding: 2px; }
        .error { display: none; margin-bottom: 16px; padding: 12px 14px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 12px; font-size: 14px; text-align: left; }
        .spinner { width: 34px; height: 34px; border: 3px solid #a7f3d0; border-top-color: #059669; border-radius: 50%; animation: spin .8s linear infinite; margin: 10px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .foot { margin-top: 20px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <main class="card">
        <img src="logonieuw.png" alt="Tupper Life logo" class="logo" onerror="this.style.display='none'">
        <h1>Tupper Life <span>by Kaat</span></h1>
        <p class="sub">Welkom! Log in om verder te gaan.</p>

        <div id="error" class="error"></div>
        <div id="loading" class="spinner"></div>

        <button id="login" class="btn hidden" type="button">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span>Inloggen met Google</span>
        </button>

        <p class="foot">Je gegevens worden veilig bewaard in je eigen account.</p>
    </main>

    <script>
        (function () {
            var errBox = document.getElementById('error');
            var btn = document.getElementById('login');
            var spinner = document.getElementById('loading');

            function showError(msg) { errBox.innerHTML = msg; errBox.style.display = 'block'; }
            function ready() { spinner.classList.add('hidden'); btn.classList.remove('hidden'); btn.disabled = false; }

            if (typeof firebase === 'undefined' || !window.auth) {
                spinner.classList.add('hidden');
                showError('De app kon niet geladen worden. Controleer je internetverbinding en vernieuw de pagina.');
                return;
            }

            // Komt de gebruiker terug na inloggen via doorverwijzing (gsm)? Dan foutmeldingen tonen.
            window.auth.getRedirectResult().catch(function (err) {
                console.error(err);
                ready();
                showError('Inloggen mislukt: ' + (err.message || err.code));
            });

            function isAdmin(email) {
                var list = (window.ADMIN_EMAILS || []).map(function (e) { return String(e).toLowerCase(); });
                return !!email && list.indexOf(String(email).toLowerCase()) !== -1;
            }

            window.auth.onAuthStateChanged(function (user) {
                // Beheerders gaan naar de beheer-app, gewone gebruikers naar de app
                if (user) window.location.replace(isAdmin(user.email) ? 'beheer.html' : 'dashboard.html');
                else ready();
            });

            btn.addEventListener('click', function () {
                errBox.style.display = 'none';
                if (window.location.protocol === 'file:') {
                    showError('Google-inloggen werkt niet rechtstreeks vanuit een map. Open de app via de website.');
                    return;
                }
                btn.disabled = true;
                window.auth.signInWithPopup(window.googleProvider).catch(function (err) {
                    console.error(err);
                    var popupProblem = ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].indexOf(err.code) !== -1;
                    if (popupProblem) {
                        // Pop-up geblokkeerd (vaak op gsm of in de app op het startscherm): dan via doorverwijzing.
                        return window.auth.signInWithRedirect(window.googleProvider);
                    }
                    btn.disabled = false;
                    if (err.code !== 'auth/popup-closed-by-user') showError('Inloggen mislukt: ' + (err.message || err.code));
                });
            });
        })();
    </script>
</body>
</html>
