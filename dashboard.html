            const [showCustomGoalsModal, setShowCustomGoalsModal] = useState(false);
            const [showStats, setShowStats] = useState(false);
            const [adminSection, setAdminSectionState] = useState(() => { try { return localStorage.getItem('tl-admin-section') || 'users'; } catch (e) { return 'users'; } });
            const setAdminSection = (s) => { setAdminSectionState(s); try { localStorage.setItem('tl-admin-section', s); } catch (e) {} };
            const [customGoals, setCustomGoals] = useState([]);
            const [viewingUser, setViewingUser] = useState(null);
            const [cameFromAdmin, setCameFromAdmin] = useState(false);
            const [showProfileMenu, setShowProfileMenu] = useState(false);
            const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem('theme') === 'dark'; } catch (e) { return false; } });
            const defaultPerms = DEFAULT_PERMS;
            const [userPermissions, setUserPermissions] = useState(defaultPerms);

            useEffect(() => {
                const unsub = window.auth.onAuthStateChanged(u => {
                    if (!u) { window.location.href = 'index.html'; return; }
                    const params = new URLSearchParams(window.location.search);
                    const viewUid = params.get('view');
                    if (viewUid && isAdminEmail(u.email) && viewUid !== u.uid) {
                        setViewingUser({ uid: viewUid, name: params.get('name') || 'Onbekend' });
                        setCameFromAdmin(true);
                    }
                    setUser(u); setLoading(false);
                    window.recordVisit(u);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
                try { localStorage.setItem('theme', darkMode ? 'dark' : 'light'); } catch (e) {}
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', darkMode ? '#0b1120' : '#059669');
            }, [darkMode]);

            const targetUid = viewingUser ? viewingUser.uid : (user ? user.uid : null);
            const isAdmin = !!(user && isAdminEmail(user.email));
            const can = (key) => isAdmin || userPermissions[key] !== false;

            useEffect(() => {
                if (!targetUid || !window.db) return;
                const logErr = (what) => (err) => console.error(what + ' laden mislukt:', err);

                const unsubData = window.db.collection('users').doc(targetUid).collection('years').doc(String(selectedYear)).collection('months')
                    .onSnapshot(snap => {
                        const d = {};
                        snap.forEach(doc => d[doc.id] = doc.data());
                        setMonthlyData(d);
                    }, logErr('Maanddata'));

                const unsubPerms = window.db.collection('users').doc(targetUid).collection('settings').doc('config')
                    .onSnapshot(doc => {
                        setUserPermissions(doc.exists ? { ...defaultPerms, ...doc.data() } : defaultPerms);
                    }, logErr('Rechten'));

                const unsubGoals = window.db.collection('users').doc(targetUid).collection('settings').doc('custom_goals')
                    .onSnapshot(doc => {
                        setCustomGoals(doc.exists ? (doc.data().list || []) : []);
                    }, logErr('Doelen'));

                const unsubGlobalPs = window.db.collection('settings').doc(`global_ps_${selectedYear}`)
                    .onSnapshot(doc => {
                        setGlobalPsData(doc.exists ? doc.data() : {});
                    }, logErr('Globale PS'));

                return () => { unsubData(); unsubPerms(); unsubGoals(); unsubGlobalPs(); };
            }, [targetUid, selectedYear]);

            // Admin: lijst van gebruikers om snel te wisselen (wie dit of vorig jaar gegevens heeft)
            const [adminUsers, setAdminUsers] = useState([]);
            const showSwitcherEnabled = false;
            useEffect(() => {
                if (!isAdmin || !window.db || !showSwitcherEnabled) return;
                const unsub = window.db.collectionGroup('months').where('yearId', 'in', [selectedYear, selectedYear - 1]).onSnapshot(snap => {
                    const map = {};
                    snap.forEach(doc => { const d = doc.data(); if (d.userId && !map[d.userId]) map[d.userId] = { uid: d.userId, name: d.userName || 'Onbekend', email: d.userEmail, photo: d.userPhoto }; });
                    setAdminUsers(Object.values(map).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'nl')));
                }, err => console.error('Gebruikerslijst laden mislukt:', err));
                return () => unsub();
            }, [isAdmin, selectedYear]);

            const availableWeeks = React.useMemo(() => buildAvailableWeeks(selectedYear, monthlyData), [selectedYear, monthlyData]);

            const updateMonthData = async (month, field, value) => {
                if (!targetUid) return;
                try {
                    await window.db.collection('users').doc(targetUid).collection('years').doc(String(selectedYear)).collection('months').doc(month).set({
                        [field]: value, userId: targetUid, userName: viewingUser ? viewingUser.name : (user.displayName || user.email || 'Onbekend'), yearId: selectedYear, monthId: month, updatedAt: Date.now()
                    }, { merge: true });
                    if (String(field).startsWith('week')) window.logActivity(targetUid, 'verkoop', `Verkoop aangepast: ${month}`);
                    else if (field === 'psLevels' || field === 'receivedGlobalPs') window.logActivity(targetUid, 'ps', `PS aangepast: ${month}`);
                } catch (e) { window.showAlert("Opslaan mislukt: " + e.message); }
            };

            const updateCustomGoals = async (newGoalsList) => {
                if (!targetUid) return;
                try { await window.db.collection('users').doc(targetUid).collection('settings').doc('custom_goals').set({ list: newGoalsList }, { merge: true }); window.logActivity(targetUid, 'doel', 'Doelen aangepast'); }
                catch (e) { window.showAlert("Opslaan mislukt: " + e.message); }
            };

            const updateGlobalPsData = async (month, newLevels) => {
                try { await window.db.collection('settings').doc(`global_ps_${selectedYear}`).set({ [month]: newLevels }, { merge: true }); }
                catch (e) { window.showAlert("Opslaan mislukt: " + e.message); }
            };

            const formatCurrency = (val) => new Intl.NumberFormat('nl-BE', { style: 'currency', currency: 'EUR' }).format(val || 0);

            const visibleTabs = TABS.filter(t => t.perm === 'admin' ? false : (!t.perm || userPermissions[t.perm] || isAdmin));
            const currentTab = visibleTabs.find(t => t.id === activeTab) || visibleTabs[0];
            const navTabs = visibleTabs.filter(t => t.id !== 'admin');
            useEffect(() => { if (!loading && currentTab && currentTab.id !== activeTab) setActiveTabState(currentTab.id); }, [loading, currentTab && currentTab.id, activeTab]);
            const isLockedForUser = (t) => t.perm && t.perm !== 'admin' && !userPermissions[t.perm];

            if (loading) return <div className="h-screen flex flex-col items-center justify-center text-emerald-600"><Icons.Loader className="text-4xl mb-4"/><div className="font-semibold">Tupper Life wordt geladen...</div></div>;

            const showSwitcher = false; // gebruikers wisselen gebeurt nu in de beheer-app (beheer.html)
            const adminUserOptions = [{ uid: user.uid, name: `${user.displayName || 'Mijn account'} (jij)` }, ...adminUsers.filter(u => u.uid !== user.uid)];
            const yearOptions = [0, 1, 2, 3, 4].map(i => new Date().getFullYear() - 2 + i);
            const yearTotal = MONTHS.reduce((acc, m) => acc + sumMonth(monthlyData[m]), 0);

            const yearSelect = (
                <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 font-semibold pl-3 pr-8 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-emerald-500/30 shadow-sm cursor-pointer text-sm">
                    {yearOptions.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
            );

            return (
                <div className="relative min-h-screen">
                    <GlobalDialogs />

                    {/* ===== KOP ===== */}
                    <header className="sticky top-0 z-30 bg-white/95 dark:bg-[#0b1120]/95 border-b border-slate-200/70 dark:border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
                            <button onClick={() => setActiveTab('overview')} className="flex items-center gap-3 shrink-0 select-none">
                                <img src="apple-touch-icon.png" alt="" className="w-9 h-9 rounded-xl shadow-sm bg-white object-cover"/>
                                <div className={`text-left leading-tight ${showSwitcher ? 'hidden sm:block' : ''}`}>
                                    <div className="font-extrabold text-[17px] text-slate-900 dark:text-white tracking-tight">Tupper Life</div>
                                    <div className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 -mt-0.5">by Kaat</div>
                                </div>
                            </button>

                            <nav className="hidden lg:flex items-center gap-1 ml-6 overflow-x-auto no-scrollbar">
                                {navTabs.map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`whitespace-nowrap px-3.5 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center gap-2 ${currentTab.id === t.id ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 hover:bg-slate-100 dark:hover:text-slate-200 dark:hover:bg-slate-800'}`}>
                                        <i className={`fa-solid ${t.icon} text-[13px]`}></i> {t.label}
                                        {isLockedForUser(t) && <Icons.Lock className="text-[10px] opacity-50"/>}
                                    </button>
                                ))}
                            </nav>

                            {showSwitcher && (
                                <div className="ml-auto relative">
                                    <i className={`fa-solid ${viewingUser ? 'fa-user-shield text-amber-600' : 'fa-users text-slate-400'} absolute left-3 top-1/2 -translate-y-1/2 text-xs pointer-events-none`}></i>
                                    <select
                                        value={viewingUser ? viewingUser.uid : ''}
                                        onChange={e => { const u = adminUsers.find(x => x.uid === e.target.value); setViewingUser(u || null); }}
                                        title="Wissel van gebruiker"
                                        className={`max-w-[13.5rem] sm:max-w-[16rem] pl-8 pr-7 py-2 rounded-xl border text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500/30 cursor-pointer truncate ${viewingUser ? 'bg-amber-50 border-amber-300 text-amber-900 dark:bg-amber-900/30 dark:border-amber-700 dark:text-amber-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200'}`}
                                    >
                                        <option value="">Mijn account</option>
                                        {adminUsers.filter(u => u.uid !== user.uid).map(u => <option key={u.uid} value={u.uid}>{u.name}</option>)}
                                    </select>
                                </div>
                            )}

                            <div className={`relative ${showSwitcher ? '' : 'ml-auto'}`}>
                                <button onClick={() => setShowProfileMenu(!showProfileMenu)} className="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 hover:ring-4 hover:ring-emerald-500/15 transition-all" aria-label="Profielmenu">
                                    {user.photoURL ? <img src={user.photoURL} className="w-full h-full object-cover" referrerPolicy="no-referrer"/> : <Icons.User/>}
                                </button>
                                {showProfileMenu && (
                                    <React.Fragment>
                                        <div className="fixed inset-0 z-10" onClick={() => setShowProfileMenu(false)}></div>
                                        <div className="absolute right-0 mt-2 w-72 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 z-20 py-2 overflow-hidden modal-content">
                                            <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
                                                {user.photoURL ? <img src={user.photoURL} referrerPolicy="no-referrer" className="w-10 h-10 rounded-full object-cover"/> : <div className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><Icons.User/></div>}
                                                <div className="min-w-0">
                                                    <div className="text-sm font-bold truncate text-slate-800 dark:text-white">{user.displayName || 'Mijn account'}</div>
                                                    <div className="text-xs text-slate-500 truncate">{user.email}</div>
                                                </div>
                                            </div>
                                            <button onClick={() => setDarkMode(!darkMode)} className="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                                                <span className="text-sm font-semibold flex items-center gap-3 text-slate-700 dark:text-slate-200"><i className={`fa-solid ${darkMode ? 'fa-moon' : 'fa-sun'} w-5 text-slate-400`}></i> Donkere modus</span>
                                                <span className={`w-11 h-6 rounded-full relative transition-colors ${darkMode ? 'bg-emerald-500' : 'bg-slate-200 dark:bg-slate-600'}`}>
                                                    <span className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform shadow-sm ${darkMode ? 'translate-x-5' : ''}`}></span>
                                                </span>
                                            </button>
                                            {can('showGoals') && <button onClick={() => { setShowCustomGoalsModal(true); setShowProfileMenu(false); }} className="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-semibold text-slate-700 dark:text-slate-200 flex gap-3 items-center"><i className="fa-solid fa-bullseye w-5 text-indigo-500"></i> Mijn doelen</button>}
                                            {isAdmin && <a href="beheer.html" className="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-semibold text-slate-700 dark:text-slate-200 flex gap-3 items-center"><i className="fa-solid fa-screwdriver-wrench w-5 text-amber-500"></i> Naar de beheer-app</a>}
                                            <div className="border-t border-slate-100 dark:border-slate-800 mt-1 pt-1">
                                                <button onClick={() => window.auth.signOut()} className="w-full text-left px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm font-semibold text-red-600 dark:text-red-400 flex gap-3 items-center"><i className="fa-solid fa-right-from-bracket w-5"></i> Uitloggen</button>
                                            </div>
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>
                        </div>
                        {viewingUser && (
                            <div className="bg-amber-400 text-amber-950 text-xs sm:text-sm font-semibold py-2 px-4 flex justify-center items-center gap-3">
                                <span><i className="fa-solid fa-user-shield mr-1.5"></i>Je bekijkt het account van <strong>{viewingUser.name}</strong></span>
                                <button onClick={() => { if (cameFromAdmin) window.location.href = 'beheer.html#user=' + encodeURIComponent(viewingUser.uid); else setViewingUser(null); }} className="bg-amber-950/10 hover:bg-amber-950/20 px-2.5 py-1 rounded-lg font-bold whitespace-nowrap">{cameFromAdmin ? '← Terug naar beheer' : 'Afsluiten'}</button>
                            </div>
                        )}
                    </header>

                    {/* ===== INHOUD ===== */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-5 sm:pt-8 pb-28 lg:pb-12">
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-5 sm:mb-7">
                            <div className="min-w-0">
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight flex items-center gap-3">
                                    {currentTab.label}
                                    {isLockedForUser(currentTab) && <span className="text-[11px] font-bold uppercase tracking-wider bg-slate-200 dark:bg-slate-800 text-slate-500 px-2 py-1 rounded-lg"><Icons.Lock className="mr-1"/>uit voor gebruiker</span>}
                                </h2>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">{currentTab.subtitle}</p>
                            </div>
                            <div id="page-actions" className="flex flex-wrap items-center justify-end gap-2 sm:gap-3 ml-auto empty:hidden"></div>
                            {currentTab.id === 'admin' && <div className="shrink-0">{yearSelect}</div>}
                            {currentTab.id === 'catalogs' && isAdmin && (
                                <button onClick={() => { window.location.href = 'beheer.html#catalogs'; }} className="shrink-0 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 shadow-sm"><i className="fa-solid fa-screwdriver-wrench text-amber-500"></i> Beheren</button>
                            )}
                            {currentTab.id === 'overview' && (
                                <div className="flex items-center gap-2 shrink-0">
                                    {can('showStats') && <button onClick={() => setShowStats(!showStats)} title={showStats ? 'Kerncijfers verbergen' : 'Kerncijfers tonen'} className={`flex items-center gap-2 px-3 sm:px-4 py-2.5 rounded-xl border text-sm font-semibold shadow-sm transition-colors ${showStats ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                        <i className="fa-solid fa-chart-simple text-emerald-500"></i>
                                        <span className="hidden sm:inline">Kerncijfers</span>
                                        <Icons.ChevronDown className={`hidden sm:inline text-xs transition-transform ${showStats ? 'rotate-180' : ''}`}/>
                                    </button>}
                                    {can('showGoals') && <button onClick={() => setShowCustomGoalsModal(true)} className="hidden sm:flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 shadow-sm"><i className="fa-solid fa-bullseye"></i> Mijn doelen</button>}
                                    {yearSelect}
                                </div>
                            )}
                        </div>

                        <ErrorBoundary key={currentTab.id + (viewingUser ? viewingUser.uid : '')}>
                            {currentTab.id === 'overview' && (
                                <div className="space-y-6 sm:space-y-8">
                                    {showStats && can('showStats') && <OverviewStats monthlyData={monthlyData} selectedYear={selectedYear} formatCurrency={formatCurrency} />}

                                    {can('showClub') && (
                                        <ClubTab targetUid={targetUid} monthlyData={monthlyData} selectedYear={selectedYear} formatCurrency={formatCurrency} />
                                    )}

                                    {can('showGoals') && <CustomGoalsDisplay customGoals={customGoals} monthlyData={monthlyData} selectedYear={selectedYear} formatCurrency={formatCurrency} availableWeeks={availableWeeks} />}
                                    {can('showGoals') && <button onClick={() => setShowCustomGoalsModal(true)} className="sm:hidden w-full flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm font-semibold text-indigo-600 dark:text-indigo-400 shadow-sm"><i className="fa-solid fa-bullseye"></i> Mijn doelen beheren</button>}

                                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-glass dark:shadow-glass-dark border border-slate-200/80 dark:border-slate-800 overflow-hidden w-full">
                                        <div className="px-4 sm:px-6 pt-5 pb-3 flex items-center justify-between">
                                            <h3 className="font-bold text-slate-800 dark:text-white">Maanden {selectedYear}</h3>
                                            <span className="text-xs text-slate-400">{can('canEditSales') ? 'Tik op een maand om je verkoop in te vullen' : 'Tik op een maand om je verkoop te bekijken'}</span>
                                        </div>
                                        <div className="w-full overflow-x-auto custom-scroll">
                                            <table className="w-full text-left border-collapse min-w-full">
                                                <thead className="border-y border-slate-100 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40">
                                                    <tr>
                                                        <th className="px-3 sm:px-5 py-3 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold">Maand</th>
                                                        <th className="px-3 sm:px-5 py-3 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold text-right">Verkoop</th>
                                                        <th className="px-3 sm:px-5 py-3 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold text-right">Winst</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {MONTHS.map((m, index) => <MonthRow key={m} month={m} monthIndex={index} year={selectedYear} data={monthlyData[m] || {}} updateMonthData={updateMonthData} formatCurrency={formatCurrency} user={user} globalPs={globalPsData[m] || []} showPs={can('showPs')} canEdit={can('canEditSales')} canEditPs={can('canEditPersonalPs')} />)}
                                                </tbody>
                                                <tfoot className="bg-gradient-to-r from-emerald-600 to-teal-600 text-white">
                                                    <tr>
                                                        <td className="px-3 sm:px-5 py-4 font-extrabold text-sm sm:text-base uppercase tracking-wider">Totaal {selectedYear}</td>
                                                        <td className="px-3 sm:px-5 py-4 font-extrabold text-base sm:text-xl text-right whitespace-nowrap">{formatCurrency(yearTotal)}</td>
                                                        <td className="px-3 sm:px-5 py-4 font-extrabold text-base sm:text-xl text-right whitespace-nowrap">{formatCurrency(yearTotal * PROFIT_RATE)}</td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentTab.id === 'catalogs' && <CatalogsTab isAdmin={isAdmin} showPromotions={can('showPromotions')} />}
                            {currentTab.id === 'requests' && <RequestsTab targetUid={targetUid}/>}
                            {currentTab.id === 'stock' && <StockTab targetUid={targetUid} user={user} showCsvImport={can('showCsvImport')}/>}
                            {currentTab.id === 'recipes' && <RecipesTab targetUid={targetUid}/>}
                            {currentTab.id === 'customers' && <CustomersTab targetUid={targetUid}/>}
                            {currentTab.id === 'admin' && isAdmin && <AdminPage users={adminUserOptions} formatCurrency={formatCurrency} section={adminSection} setSection={setAdminSection} selectedYear={selectedYear} globalPsData={globalPsData} updateGlobalPsData={updateGlobalPsData} isAdmin={isAdmin} onSelectUser={(u) => { setViewingUser(u); setActiveTab('overview'); }} />}
                        </ErrorBoundary>
                    </main>

                    {/* ===== MENUBALK ONDERAAN (GSM & TABLET) ===== */}
                    <nav className="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-[#0b1120]/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 pb-safe">
                        <div className="flex max-w-xl mx-auto">
                            {navTabs.map(t => {
                                const active = currentTab.id === t.id;
                                return (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex-1 min-w-0 flex flex-col items-center justify-center gap-1 pt-2.5 pb-2 transition-colors ${active ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-500'}`}>
                                        <span className={`w-12 h-7 rounded-full flex items-center justify-center transition-colors ${active ? 'bg-emerald-50 dark:bg-emerald-900/40' : ''}`}><i className={`fa-solid ${t.icon} text-[17px]`}></i></span>
                                        <span className={`text-[10.5px] leading-none truncate max-w-full px-0.5 ${active ? 'font-bold' : 'font-medium'}`}>{t.short}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <AdminUserModal isOpen={showAdminModal} onClose={() => setShowAdminModal(false)} selectedYear={selectedYear} onSelectUser={(u) => { setViewingUser(u); setShowAdminModal(false); }}/>
                    <CustomGoalsModal isOpen={showCustomGoalsModal} onClose={() => setShowCustomGoalsModal(false)} customGoals={customGoals} updateCustomGoals={updateCustomGoals} formatCurrency={formatCurrency} availableWeeks={availableWeeks} />
                    <GlobalPsAdminModal isOpen={showGlobalPsModal} onClose={() => setShowGlobalPsModal(false)} selectedYear={selectedYear} globalPsData={globalPsData} updateGlobalPsData={updateGlobalPsData} />
                </div>
            );
        }

        // =====================================================================
        //  BEHEERDERS-APP (beheer.html) — gebruikt dezelfde onderdelen als de app
        // =====================================================================
        const ADMIN_NAV = [
            { id: 'start',     label: 'Start',       icon: 'fa-house',            group: 'Overzicht', subtitle: 'Alles in één oogopslag: verkoop, gebruikers en activiteit' },
            { id: 'users',     label: 'Gebruikers',  icon: 'fa-users',            group: 'Overzicht', subtitle: 'Wie gebruikt de app, wanneer en hoeveel' },
            { id: 'activity',  label: 'Activiteit',  icon: 'fa-clock-rotate-left', group: 'Overzicht', subtitle: 'Logboek: wat heeft iedereen gedaan' },
            { id: 'sales',     label: 'Verkoop',     icon: 'fa-chart-line',       group: 'Per gebruiker', subtitle: 'Verkoop per week bekijken en aanpassen' },
            { id: 'goals',     label: 'Doelen',      icon: 'fa-bullseye',         group: 'Per gebruiker', subtitle: 'Doelen van elke gebruiker beheren' },
            { id: 'requests',  label: 'Wensen',      icon: 'fa-gift',             group: 'Per gebruiker', subtitle: 'Wensen van elke gebruiker beheren' },
            { id: 'stock',     label: 'Voorraad',    icon: 'fa-box',              group: 'Per gebruiker', subtitle: 'Voorraad van elke gebruiker beheren' },
            { id: 'customers', label: 'Klanten',     icon: 'fa-address-book',     group: 'Per gebruiker', subtitle: 'Klanten van elke gebruiker beheren' },
            { id: 'recipes',   label: 'Recepten',    icon: 'fa-utensils',         group: 'Per gebruiker', subtitle: 'Recepten van elke gebruiker beheren' },
            { id: 'rights',    label: 'Rechten',     icon: 'fa-user-lock',        group: 'Instellingen', subtitle: 'Wat elke gebruiker mag zien en doen' },
            { id: 'ps',        label: 'Globale PS',  icon: 'fa-award',            group: 'Instellingen', subtitle: 'Beloningen voor iedereen, per maand' },
            { id: 'catalogs',  label: 'Catalogen',   icon: 'fa-book-open-reader', group: 'Instellingen', subtitle: 'Catalogen, leaflets en weekpromoties' },
        ];
        const ADMIN_NAV_GROUPS = ['Overzicht', 'Per gebruiker', 'Instellingen'];

        const ACTIVITY_ICONS = {
            bezoek: { icon: 'fa-right-to-bracket', cls: 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-300' },
            verkoop: { icon: 'fa-euro-sign', cls: 'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400' },
            ps: { icon: 'fa-award', cls: 'bg-amber-50 text-amber-600 dark:bg-amber-900/30 dark:text-amber-400' },
            wens: { icon: 'fa-gift', cls: 'bg-pink-50 text-pink-600 dark:bg-pink-900/30 dark:text-pink-400' },
            voorraad: { icon: 'fa-box', cls: 'bg-sky-50 text-sky-600 dark:bg-sky-900/30 dark:text-sky-400' },
            klant: { icon: 'fa-address-book', cls: 'bg-purple-50 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400' },
            recept: { icon: 'fa-utensils', cls: 'bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400' },
            doel: { icon: 'fa-bullseye', cls: 'bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400' },
        };
        const ACTIVITY_LABELS = { bezoek: 'Bezoeken', verkoop: 'Verkoop', ps: 'PS', wens: 'Wensen', voorraad: 'Voorraad', klant: 'Klanten', recept: 'Recepten', doel: 'Doelen' };

        const timeAgo = (ts) => {
            if (!ts) return 'nooit';
            const sec = (Date.now() - ts) / 1000;
            if (sec < 60) return 'zonet';
            if (sec < 3600) return `${Math.floor(sec / 60)} min geleden`;
            if (sec < 86400) return `${Math.floor(sec / 3600)} u geleden`;
            const d = Math.floor(sec / 86400);
            if (d === 1) return 'gisteren';
            if (d < 30) return `${d} dagen geleden`;
            return new Date(ts).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' });
        };
        const fmtDateTime = (ts) => ts ? new Date(ts).toLocaleString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
        const activityStatus = (ts) => {
            if (!ts) return { label: 'Nog niet gezien', dot: 'bg-slate-300 dark:bg-slate-600', cls: 'text-slate-400' };
            const min = (Date.now() - ts) / 60000;
            if (min < 10) return { label: 'Nu actief', dot: 'bg-emerald-500 animate-pulse', cls: 'text-emerald-600 dark:text-emerald-400' };
            if (min < 60 * 24) return { label: `Vandaag (${timeAgo(ts)})`, dot: 'bg-emerald-400', cls: 'text-emerald-600 dark:text-emerald-400' };
            if (min < 60 * 24 * 7) return { label: `Deze week (${timeAgo(ts)})`, dot: 'bg-amber-400', cls: 'text-amber-600 dark:text-amber-400' };
            return { label: `Inactief (${timeAgo(ts)})`, dot: 'bg-red-400', cls: 'text-red-500' };
        };

        const openUserApp = (u) => {
            window.location.href = `dashboard.html?view=${encodeURIComponent(u.uid)}&name=${encodeURIComponent(u.name || '')}`;
        };

        // Alle gegevens van één gebruiker ophalen (eenmalig, met 'Vernieuwen')
        const loadUserDetails = async (uid) => {
            const base = window.db.collection('users').doc(uid);
            const safe = (p) => p.catch(e => { console.warn('Lezen mislukt', uid, e && e.message); return null; });
            const [prof, req, stock, cust, rec, goals, act] = await Promise.all([
                safe(base.collection('settings').doc('profile').get()),
                safe(base.collection('requests').get()),
                safe(base.collection('stock').get()),
                safe(base.collection('customers').get()),
                safe(base.collection('recipes').get()),
                safe(base.collection('settings').doc('custom_goals').get()),
                safe(base.collection('activity').orderBy('ts', 'desc').limit(100).get()),
            ]);
            const reqs = req ? req.docs.map(d => d.data()) : [];
            const st = stock ? stock.docs.map(d => d.data()) : [];
            const custs = cust ? cust.docs.map(d => d.data()) : [];
            const recs = rec ? rec.docs.map(d => d.data()) : [];
            const lastData = Math.max(0, ...reqs.map(r => Math.max(r.createdAt || 0, r.foundAt || 0)), ...st.map(x => Math.max(x.createdAt || 0, x.updatedAt || 0)));
            return {
                profile: prof && prof.exists ? prof.data() : null,
                requests: { total: reqs.length, open: reqs.filter(r => !r.completed).length, found: reqs.filter(r => r.completed).length },
                stock: { items: st.length, qty: st.reduce((a, x) => a + (Number(x.quantity) || 0), 0), value: st.reduce((a, x) => a + (Number(x.price) || 0) * (Number(x.quantity) || 0), 0), vinted: st.reduce((a, x) => a + (Number(x.vinted) || 0), 0) },
                customers: custs.length,
                recipes: recs.length,
                goals: goals && goals.exists ? (goals.data().list || []).length : 0,
                activity: act ? act.docs.map(d => ({ id: d.id, ...d.data() })) : [],
                lastData: lastData || null,
            };
        };

        // Alle gebruikers vinden: via verkoopgegevens, profielen en hoofd-documenten
        const useAdminData = (user, monthDocs, refreshKey) => {
            const [profiles, setProfiles] = useState({});
            const [details, setDetails] = useState({});
            const [loadingDetails, setLoadingDetails] = useState(true);

            useEffect(() => {
                if (!user) return;
                let cancelled = false;
                const found = {};
                const p1 = window.db.collectionGroup('settings').get().then(snap => {
                    snap.forEach(d => {
                        if (d.id !== 'profile') return;
                        const data = d.data();
                        const uid = data.uid || (d.ref && d.ref.parent && d.ref.parent.parent ? d.ref.parent.parent.id : null);
                        if (uid) found[uid] = { ...(found[uid] || {}), ...data, uid };
                    });
                }).catch(e => console.warn('Profielen via collectionGroup niet beschikbaar:', e && e.message));
                const p2 = window.db.collection('users').get().then(snap => {
                    snap.forEach(d => { found[d.id] = { ...d.data(), ...(found[d.id] || {}), uid: d.id }; });
                }).catch(e => console.warn('Gebruikerslijst niet beschikbaar:', e && e.message));
                Promise.all([p1, p2]).then(() => { if (!cancelled) setProfiles(found); });
                return () => { cancelled = true; };
            }, [user && user.uid, refreshKey]);

            const map = {};
            const add = (uid, patch) => { if (!uid) return; map[uid] = { ...(map[uid] || { uid }), ...Object.fromEntries(Object.entries(patch).filter(([k, v]) => v !== undefined && v !== '' && v !== null)) }; };
            monthDocs.forEach(d => add(d.userId, { name: d.userName }));
            Object.values(profiles).forEach(p => add(p.uid, { name: p.name, email: p.email, photo: p.photo }));
            if (user) add(user.uid, { name: user.displayName, email: user.email, photo: user.photoURL });
            Object.keys(details).forEach(uid => { const pr = details[uid] && details[uid].profile; if (pr) add(uid, { name: pr.name, email: pr.email, photo: pr.photo }); });
            const users = Object.values(map).map(u => ({ ...u, name: u.name || u.email || 'Onbekend' })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'nl'));
            const uidKey = users.map(u => u.uid).join(',');

            useEffect(() => {
                if (!uidKey) return;
                let cancelled = false;
                setLoadingDetails(true);
                Promise.all(uidKey.split(',').map(uid => loadUserDetails(uid).then(d => [uid, d]))).then(entries => {
                    if (cancelled) return;
                    setDetails(Object.fromEntries(entries));
                    setLoadingDetails(false);
                });
                return () => { cancelled = true; };
            }, [uidKey, refreshKey]);

            return { users, details, loadingDetails };
        };

        const salesByUser = (monthDocs, year) => {
            const curName = currentMonthName();
            const out = {}, seen = {};
            monthDocs.forEach(d => {
                if (Number(d.yearId) !== year || !d.userId) return;
                const monthName = d._id || d.monthId;
                if (!MONTHS.includes(monthName)) return;
                if (d._path && d._path !== `users/${d.userId}/years/${year}/months/${monthName}`) return;
                const k = d.userId + '|' + monthName; if (seen[k]) return; seen[k] = true;
                const o = out[d.userId] || (out[d.userId] = { total: 0, current: 0, months: 0, lastSale: 0 });
                const t = sumMonth(d);
                o.total += t; if (t > 0) o.months += 1; if (monthName === curName) o.current += t;
                if (d.updatedAt) o.lastSale = Math.max(o.lastSale, d.updatedAt);
            });
            return out;
        };

        const lastSeenOf = (u, det) => {
            const p = det && det.profile;
            return Math.max(p ? (p.lastActive || p.lastLogin || 0) : 0, det && det.activity && det.activity[0] ? det.activity[0].ts : 0) || null;
        };

        const StatCard = ({ label, value, sub, icon, tint, onClick }) => (
            <div onClick={onClick} className={`bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-glass dark:shadow-glass-dark ${onClick ? 'cursor-pointer hover:border-slate-300 dark:hover:border-slate-700' : ''}`}>
                <div className="flex items-start justify-between gap-2">
                    <div className="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 leading-tight">{label}</div>
                    <div className={`w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center shrink-0 ${tint}`}><i className={`fa-solid ${icon} text-sm`}></i></div>
                </div>
                <div className="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white mt-2 tracking-tight">{value}</div>
                {sub && <div className="text-[11px] sm:text-xs text-slate-400 mt-0.5 truncate">{sub}</div>}
            </div>
        );

        const Avatar = ({ u, size = 'w-10 h-10' }) => (
            <div className={`${size} rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden shrink-0 flex items-center justify-center text-slate-500 font-bold`}>
                {u && u.photo ? <img src={u.photo} referrerPolicy="no-referrer" className="w-full h-full object-cover"/> : <span>{((u && u.name) || '?').trim().charAt(0).toUpperCase()}</span>}
            </div>
        );

        const ActivityList = ({ items, showUser = false, empty = 'Nog geen activiteit geregistreerd.' }) => (
            items.length === 0 ? <p className="text-sm text-slate-400 text-center py-8">{empty}</p> : (
                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                    {items.map((a, i) => {
                        const ic = ACTIVITY_ICONS[a.type] || ACTIVITY_ICONS.bezoek;
                        return (
                            <div key={(a.id || '') + i} className="flex items-center gap-3 py-2.5">
                                <span className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${ic.cls}`}><i className={`fa-solid ${ic.icon} text-xs`}></i></span>
                                <div className="min-w-0 flex-grow">
                                    <div className="text-sm text-slate-700 dark:text-slate-200 truncate">{showUser && <strong className="font-semibold">{a.userName}: </strong>}{a.text}</div>
                                    <div className="text-[11px] text-slate-400">{fmtDateTime(a.ts)} · {timeAgo(a.ts)}</div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            )
        );

        const Panel = ({ title, right, children, className = '' }) => (
            <div className={`bg-white dark:bg-slate-900 rounded-3xl shadow-glass dark:shadow-glass-dark border border-slate-200/80 dark:border-slate-800 ${className}`}>
                {(title || right) && <div className="px-4 sm:px-6 pt-5 pb-3 flex items-center justify-between gap-3"><h3 className="font-bold text-slate-800 dark:text-white">{title}</h3>{right}</div>}
                <div className="px-4 sm:px-6 pb-5">{children}</div>
            </div>
        );

        // ---------- START ----------
        const AdminStart = ({ users, details, sales, selectedYear, formatCurrency, onOpenUser, setSection, loadingDetails }) => {
            const isCurrentYear = selectedYear === new Date().getFullYear();
            const curName = currentMonthName();
            const total = users.reduce((a, u) => a + ((sales[u.uid] || {}).total || 0), 0);
            const current = users.reduce((a, u) => a + ((sales[u.uid] || {}).current || 0), 0);
            const seen = users.map(u => lastSeenOf(u, details[u.uid]));
            const onlineNow = seen.filter(t => t && Date.now() - t < 10 * 60000).length;
            const active7 = seen.filter(t => t && Date.now() - t < 7 * 86400000).length;
            const sum = (f) => users.reduce((a, u) => a + (details[u.uid] ? f(details[u.uid]) : 0), 0);
            const ranked = [...users].sort((a, b) => ((sales[b.uid] || {}).total || 0) - ((sales[a.uid] || {}).total || 0));
            const feed = users.flatMap(u => ((details[u.uid] || {}).activity || []).map(a => ({ ...a, userName: u.name, uid: u.uid }))).sort((a, b) => b.ts - a.ts).slice(0, 12);

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                        <StatCard label={`Omzet ${selectedYear} (iedereen)`} value={formatCurrency(total)} sub={`Winst ${formatCurrency(total * PROFIT_RATE)}`} icon="fa-euro-sign" tint="bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400" onClick={() => setSection('sales')}/>
                        <StatCard label={isCurrentYear ? `Deze maand (${curName})` : 'Gemiddeld per gebruiker'} value={formatCurrency(isCurrentYear ? current : (users.length ? total / users.length : 0))} icon="fa-calendar-day" tint="bg-sky-50 text-sky-600 dark:bg-sky-900/30 dark:text-sky-400"/>
                        <StatCard label="Gebruikers" value={String(users.length)} sub={`${onlineNow} nu actief · ${active7} deze week`} icon="fa-users" tint="bg-violet-50 text-violet-600 dark:bg-violet-900/30 dark:text-violet-400" onClick={() => setSection('users')}/>
                        <StatCard label="Topverkoper" value={ranked[0] && (sales[ranked[0].uid] || {}).total ? formatCurrency(sales[ranked[0].uid].total) : '–'} sub={ranked[0] && (sales[ranked[0].uid] || {}).total ? ranked[0].name : 'Nog geen verkoop'} icon="fa-trophy" tint="bg-amber-50 text-amber-600 dark:bg-amber-900/30 dark:text-amber-400"/>
                        <StatCard label="Open wensen (iedereen)" value={String(sum(d => d.requests.open))} sub={`${sum(d => d.requests.found)} gevonden`} icon="fa-gift" tint="bg-pink-50 text-pink-600 dark:bg-pink-900/30 dark:text-pink-400" onClick={() => setSection('requests')}/>
                        <StatCard label="Voorraadwaarde (iedereen)" value={formatCurrency(sum(d => d.stock.value))} sub={`${sum(d => d.stock.qty)} stuks · ${sum(d => d.stock.items)} producten`} icon="fa-box" tint="bg-cyan-50 text-cyan-600 dark:bg-cyan-900/30 dark:text-cyan-400" onClick={() => setSection('stock')}/>
                        <StatCard label="Klanten (iedereen)" value={String(sum(d => d.customers))} icon="fa-address-book" tint="bg-purple-50 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400" onClick={() => setSection('customers')}/>
                        <StatCard label="Recepten / doelen" value={`${sum(d => d.recipes)} / ${sum(d => d.goals)}`} icon="fa-utensils" tint="bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400"/>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                        <Panel title={`Gebruikers ${selectedYear}`} className="xl:col-span-2" right={<button onClick={() => setSection('users')} className="text-xs font-semibold text-emerald-600 hover:underline">Alle details →</button>}>
                            {ranked.length === 0 ? <p className="text-center text-slate-400 py-8 text-sm">{loadingDetails ? 'Laden...' : 'Nog geen gebruikers gevonden.'}</p> : (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800 -mx-4 sm:-mx-6">
                                    {ranked.map((u, i) => {
                                        const sl = sales[u.uid] || {}; const st = activityStatus(lastSeenOf(u, details[u.uid]));
                                        return (
                                            <button key={u.uid} onClick={() => onOpenUser(u.uid)} className="w-full flex items-center gap-3 px-4 sm:px-6 py-3 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                                <span className="w-6 text-center text-xs font-bold text-slate-400 shrink-0">{i + 1}</span>
                                                <Avatar u={u}/>
                                                <span className="flex-grow min-w-0">
                                                    <span className="block font-semibold text-slate-800 dark:text-slate-100 truncate">{u.name}</span>
                                                    <span className={`flex items-center gap-1.5 text-xs ${st.cls}`}><span className={`w-2 h-2 rounded-full ${st.dot}`}></span>{st.label}</span>
                                                </span>
                                                <span className="text-right shrink-0">
                                                    <span className="block font-bold text-slate-900 dark:text-white tabular-nums">{formatCurrency(sl.total || 0)}</span>
                                                    <span className="block text-xs text-slate-400 tabular-nums">{isCurrentYear ? `deze maand ${formatCurrency(sl.current || 0)}` : `${sl.months || 0} maanden`}</span>
                                                </span>
                                                <i className="fa-solid fa-chevron-right text-slate-300 text-xs shrink-0"></i>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </Panel>
                        <Panel title="Recente activiteit" right={<button onClick={() => setSection('activity')} className="text-xs font-semibold text-emerald-600 hover:underline">Alles →</button>}>
                            <ActivityList items={feed} showUser empty={loadingDetails ? 'Laden...' : 'Nog geen activiteit. Die wordt vanaf nu bijgehouden.'}/>
                        </Panel>
                    </div>
                </div>
            );
        };

        // ---------- GEBRUIKERS (tabel met alles) ----------
        const AdminUsersOverview = ({ users, details, sales, formatCurrency, onOpenUser, selectedYear }) => {
            const [sort, setSort] = useState('active');
            const [q, setQ] = useState('');
            const rows = users.filter(u => !q || (u.name + ' ' + (u.email || '')).toLowerCase().includes(q.toLowerCase())).map(u => {
                const d = details[u.uid] || {}; const sl = sales[u.uid] || {};
                return { u, d, sl, seen: lastSeenOf(u, d) || 0 };
            }).sort((a, b) => sort === 'active' ? b.seen - a.seen : sort === 'sales' ? (b.sl.total || 0) - (a.sl.total || 0) : (a.u.name || '').localeCompare(b.u.name || '', 'nl'));
            const th = "px-3 py-3 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold whitespace-nowrap";
            const td = "px-3 py-3 whitespace-nowrap text-sm";
            return (
                <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row gap-3">
                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Zoek op naam of e-mail..." className="flex-grow p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/30"/>
                        <select value={sort} onChange={e => setSort(e.target.value)} className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 dark:text-white font-semibold outline-none">
                            <option value="active">Sorteer: laatst actief</option>
                            <option value="sales">Sorteer: omzet {selectedYear}</option>
                            <option value="name">Sorteer: naam</option>
                        </select>
                    </div>
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-glass border border-slate-200/80 dark:border-slate-800 overflow-x-auto custom-scroll">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50/70 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-800">
                                <tr>
                                    <th className={th}>Gebruiker</th><th className={th}>Status</th><th className={th}>Laatste login</th><th className={th}>Bezoeken</th><th className={th}>Toestel</th>
                                    <th className={th + ' text-right'}>Omzet {selectedYear}</th><th className={th + ' text-right'}>Deze maand</th><th className={th + ' text-right'}>Wensen open</th>
                                    <th className={th + ' text-right'}>Voorraad</th><th className={th + ' text-right'}>Klanten</th><th className={th + ' text-right'}>Recepten</th><th className={th + ' text-right'}>Doelen</th><th className={th}>Laatste actie</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                {rows.map(({ u, d, sl, seen }) => {
                                    const st = activityStatus(seen); const p = d.profile || {};
                                    return (
                                        <tr key={u.uid} onClick={() => onOpenUser(u.uid)} className="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                            <td className={td}><div className="flex items-center gap-3"><Avatar u={u} size="w-8 h-8"/><div><div className="font-semibold text-slate-800 dark:text-slate-100">{u.name}</div><div className="text-xs text-slate-400">{u.email || '–'}</div></div></div></td>
                                            <td className={td}><span className={`flex items-center gap-1.5 ${st.cls}`}><span className={`w-2 h-2 rounded-full ${st.dot}`}></span>{st.label}</span></td>
                                            <td className={td + ' text-slate-600 dark:text-slate-300'}>{fmtDateTime(p.lastLogin)}</td>
                                            <td className={td + ' text-slate-600 dark:text-slate-300'}>{p.visits || 0}</td>
